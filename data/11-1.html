<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор: Дефект масс и энергия</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
        }
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            background: #e9ecef;
            border: 1px solid #ced4da;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #495057;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: #17a2b8;
            color: white;
            border-color: #17a2b8;
        }
        h1 {
            color: #003366;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            margin-top: 10px;
            border-bottom: 2px solid #17a2b8;
            padding-bottom: 15px;
            padding-right: 150px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }
        .control-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #495057;
        }
        .control-group input {
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 16px;
        }
        .constant-box {
            background: #fff3e0;
            border: 1px solid #ffb74d;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            color: #e65100;
            text-align: center;
            flex: 1;
            min-width: 200px;
        }

        /* Зона симуляции */
        .simulation-area {
            position: relative;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 10px; 
            min-height: 300px;
            margin-bottom: 25px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        svg {
            width: 100%;
            height: 300px;
            border-radius: 6px;
            background-color: #e3f2fd;
        }

        /* Анимации весов */
        .balance-beam {
            transform-origin: 400px 150px;
            transition: transform 1.5s ease-in-out;
        }
        .pan-left, .pan-right {
            transition: transform 1.5s ease-in-out;
        }
        .energy-burst {
            transform-origin: center;
            transform: scale(0);
            opacity: 0;
            transition: transform 1.5s ease-out, opacity 1.5s;
        }
        
        /* Состояния после проверки */
        .tilted .balance-beam {
            transform: rotate(-10deg);
        }
        .tilted .pan-left {
            transform: translateY(35px);
        }
        .tilted .pan-right {
            transform: translateY(-35px);
        }
        .tilted .energy-burst {
            transform: scale(1);
            opacity: 1;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Блок проверки знаний */
        .quiz-section {
            background: #f1f8e9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #c5e1a5;
        }
        .quiz-section h3 {
            margin-top: 0;
            color: #33691e;
        }
        .quiz-inputs {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .quiz-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 18px;
            color: #2e7d32;
        }
        .quiz-input-group input {
            width: 180px;
            padding: 8px;
            border: 1px solid #a5d6a7;
            border-radius: 4px;
            font-size: 16px;
        }
        .hint-text {
            font-size: 13px;
            color: #666;
            margin-left: 10px;
            font-weight: normal;
        }
        .btn-check {
            background-color: #43a047;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-check:hover {
            background-color: #2e7d32;
        }
        #feedback {
            margin-top: 15px;
            font-size: 16px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            line-height: 1.5;
        }
        .feedback-success {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #a5d6a7;
        }
        .feedback-error {
            background-color: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef9a9a;
        }
        .moral-message {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-weight: bold;
            color: #0d47a1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLang('kk')" id="btn-kk">ҚАЗ</button>
        <button class="lang-btn active" onclick="setLang('ru')" id="btn-ru">РУС</button>
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">ENG</button>
    </div>

    <h1 data-i18n="title">РАСЧЕТ ЭНЕРГИИ И ДЕФЕКТА МАСС</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="massDefect" data-i18n="lblMass">Дефект масс Δm (мг):</label>
            <input type="number" id="massDefect" value="1" min="0.1" step="0.1" oninput="resetSimulation()">
        </div>
        <div class="constant-box">
            <span data-i18n="lblSpeedLight">Скорость света (c):</span><br>
            3 × 10⁸ м/с
        </div>
    </div>

    <div class="simulation-area" id="simArea">
        <svg viewBox="0 0 800 300">
            <polygon points="380,280 420,280 400,150" fill="#78909c" />
            <circle cx="400" cy="150" r="6" fill="#37474f" />

            <g class="balance-beam" id="beam">
                <line x1="200" y1="150" x2="600" y2="150" stroke="#546e7a" stroke-width="6" stroke-linecap="round"/>
                <circle cx="200" cy="150" r="4" fill="#37474f" />
                <circle cx="600" cy="150" r="4" fill="#37474f" />
            </g>

            <g class="pan-left" id="panLeft">
                <line x1="200" y1="150" x2="160" y2="230" stroke="#90a4ae" stroke-width="2"/>
                <line x1="200" y1="150" x2="240" y2="230" stroke="#90a4ae" stroke-width="2"/>
                <path d="M 150 230 Q 200 260 250 230 Z" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
                
                <circle cx="185" cy="220" r="12" fill="#2196f3"/>
                <text x="185" y="225" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">D</text>
                <circle cx="215" cy="220" r="12" fill="#f44336"/>
                <text x="215" y="225" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">T</text>
                
                <text x="200" y="275" font-family="Arial" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">m₁ + m₂</text>
            </g>

            <g class="pan-right" id="panRight">
                <line x1="600" y1="150" x2="560" y2="230" stroke="#90a4ae" stroke-width="2"/>
                <line x1="600" y1="150" x2="640" y2="230" stroke="#90a4ae" stroke-width="2"/>
                <path d="M 550 230 Q 600 260 650 230 Z" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
                
                <circle cx="600" cy="220" r="15" fill="#4caf50"/>
                <text x="600" y="225" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">He</text>
                <circle cx="575" cy="225" r="6" fill="#9e9e9e"/>
                <text x="575" y="228" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle">n</text>
                
                <text x="600" y="275" font-family="Arial" font-size="14" font-weight="bold" fill="#000" text-anchor="middle" data-i18n="lblNucleus">m<tspan dy="4" font-size="10">ядра</tspan></text>
                
                <g class="energy-burst" transform="translate(625, 190)">
                    <path d="M 0 -30 L 10 -10 L 30 0 L 10 10 L 0 30 L -10 10 L -30 0 L -10 -10 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="2"/>
                    <text x="0" y="5" font-family="Arial" font-size="12" font-weight="bold" fill="#d84315" text-anchor="middle">E</text>
                </g>
            </g>
            
            <text x="400" y="100" font-family="Arial" font-size="18" font-weight="bold" fill="#d32f2f" text-anchor="middle" id="massDefectText" style="opacity: 0; transition: opacity 1.5s;">Δm > 0 (Дефект масс)</text>
        </svg>
    </div>

    <div class="quiz-section">
        <h3 data-i18n="quizTitle">Проверка расчетов</h3>
        <p data-i18n="quizDesc">Используя формулу Эйнштейна (E = Δm · c²), рассчитайте выделенную энергию. Не забудьте перевести миллиграммы (мг) в килограммы (кг).</p>
        <div class="quiz-inputs">
            <div class="quiz-input-group">
                <label for="ansE">E = </label>
                <input type="number" id="ansE" placeholder="Дж">
                <span class="hint-text" data-i18n="lblHint">(можно вводить число с нулями или в формате, например, 5e10)</span>
            </div>
        </div>
        <button class="btn-check" data-i18n="btnCheck" onclick="checkAnswers()">Проверить ответ и запустить реакцию</button>
        <div id="feedback"></div>
    </div>
</div>

<script>
    // --- СЛОВАРЬ ПЕРЕВОДОВ ---
    const dict = {
        ru: {
            title: "РАСЧЕТ ЭНЕРГИИ И ДЕФЕКТА МАСС",
            lblMass: "Дефект масс Δm (мг):",
            lblSpeedLight: "Скорость света (c):",
            lblNucleus: "m<tspan dy='4' font-size='10'>ядра</tspan>",
            quizTitle: "Проверка расчетов",
            quizDesc: "Используя формулу Эйнштейна (E = Δm · c²), рассчитайте выделенную энергию. Не забудьте перевести миллиграммы (мг) в килограммы (кг).",
            btnCheck: "Проверить ответ и запустить реакцию",
            lblHint: "(можно вводить число с нулями или в формате, например, 5e10)",
            errFill: "<strong>Ошибка:</strong> Пожалуйста, введите значение энергии.",
            msgSuccess: "<strong>✅ Верно!</strong> Вы правильно применили формулу Эйнштейна.",
            msgError: "<strong>❌ Ошибка в вычислениях.</strong> Проверьте расчеты и попробуйте еще раз.",
            analysisTitle: "Глобальное единство (Проект ITER):",
            analysisGood: "Исчезновение всего {M} мг массы дает колоссальные <strong>{E} Дж</strong> экологически чистой энергии (эквивалент сжиганию тонн угля)!",
            moral: "🌍 Создание искусственного солнца требует объединения умов и финансов всего мира. Путь к спасению климата лежит через полное политическое и научное единство государств!",
            defectText: "Δm > 0 (Дефект масс)"
        },
        kk: {
            title: "ЭНЕРГИЯ ЖӘНЕ МАССА АҚАУЫН ЕСЕПТЕУ",
            lblMass: "Масса ақауы Δm (мг):",
            lblSpeedLight: "Жарық жылдамдығы (c):",
            lblNucleus: "m<tspan dy='4' font-size='10'>ядра</tspan>",
            quizTitle: "Есептеулерді тексеру",
            quizDesc: "Эйнштейн формуласын (E = Δm · c²) пайдаланып, бөлінген энергияны есептеңіз. Миллиграмды (мг) килограмға (кг) аударуды ұмытпаңыз.",
            btnCheck: "Жауапты тексеру және реакцияны бастау",
            lblHint: "(сандарды нөлдермен немесе, мысалы, 5e10 пішімінде енгізуге болады)",
            errFill: "<strong>Қате:</strong> Энергия мәнін енгізіңіз.",
            msgSuccess: "<strong>✅ Дұрыс!</strong> Сіз Эйнштейн формуласын дұрыс қолдандыңыз.",
            msgError: "<strong>❌ Есептеудегі қателік.</strong> Есептеулерді тексеріп, қайтадан көріңіз.",
            analysisTitle: "Жаһандық бірлік (ITER жобасы):",
            analysisGood: "Бар-жоғы {M} мг массаның жоғалуы экологиялық таза <strong>{E} Дж</strong> энергия береді (тонна көмір жағуға тең)!",
            moral: "🌍 Жасанды күн құру бүкіл әлемнің ақыл-ойы мен қаржысын біріктіруді талап етеді. Климатты құтқару жолы мемлекеттердің толық саяси және ғылыми бірлігі арқылы өтеді!",
            defectText: "Δm > 0 (Масса ақауы)"
        },
        en: {
            title: "ENERGY AND MASS DEFECT CALCULATION",
            lblMass: "Mass defect Δm (mg):",
            lblSpeedLight: "Speed of light (c):",
            lblNucleus: "m<tspan dy='4' font-size='10'>nuc</tspan>",
            quizTitle: "Calculation check",
            quizDesc: "Using Einstein's formula (E = Δm · c²), calculate the released energy. Remember to convert milligrams (mg) to kilograms (kg).",
            btnCheck: "Check answer and start reaction",
            lblHint: "(you can enter standard numbers or scientific notation like 5e10)",
            errFill: "<strong>Error:</strong> Please enter the energy value.",
            msgSuccess: "<strong>✅ Correct!</strong> You correctly applied Einstein's formula.",
            msgError: "<strong>❌ Calculation error.</strong> Please check your calculations and try again.",
            analysisTitle: "Global Unity (ITER Project):",
            analysisGood: "The disappearance of just {M} mg of mass yields a colossal <strong>{E} J</strong> of clean energy (equivalent to burning tons of coal)!",
            moral: "🌍 Creating an artificial sun requires the combined minds and finances of the entire world. The path to saving the climate lies through complete political and scientific global unity!",
            defectText: "Δm > 0 (Mass defect)"
        }
    };

    let currentLang = 'ru';
    let currentEnergy = 90000000000; // Для 1 мг по умолчанию

    function setLang(lang) {
        currentLang = lang;
        
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');

        document.querySelectorAll('[data-i18n]').forEach(el => {
            let key = el.getAttribute('data-i18n');
            if (dict[lang][key]) {
                el.innerHTML = dict[lang][key];
            }
        });

        document.getElementById('massDefectText').textContent = dict[lang].defectText;
        
        resetSimulation();
        
        // Если блок ответа уже открыт, обновляем его
        if (document.getElementById('feedback').style.display === 'block') {
            checkAnswers();
        }
    }

    function resetSimulation() {
        let dm = parseFloat(document.getElementById('massDefect').value) || 0;
        // Расчет энергии: E = dm * 10^-6 * (3*10^8)^2 = dm * 10^-6 * 9*10^16 = dm * 9*10^10
        currentEnergy = dm * 90000000000;

        // Сброс анимаций и текстов
        document.getElementById('simArea').classList.remove('tilted');
        document.getElementById('massDefectText').style.opacity = '0';
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('ansE').value = '';
    }

    function checkAnswers() {
        let langData = dict[currentLang];
        let userE = parseFloat(document.getElementById('ansE').value);
        let dm = parseFloat(document.getElementById('massDefect').value) || 0;
        let feedback = document.getElementById('feedback');

        feedback.style.display = 'block';

        // Допуск на округление (до 1%)
        let isCorrect = Math.abs(userE - currentEnergy) / currentEnergy < 0.01;

        if (isNaN(userE)) {
            feedback.className = 'feedback-error';
            feedback.innerHTML = langData.errFill;
        } else if (isCorrect) {
            
            // Математически корректное форматирование степени (с использованием HTML-тегов <sup>)
            let expParts = currentEnergy.toExponential(1).split('e');
            let base = expParts[0].replace('.0', '');
            let exponent = parseInt(expParts[1]); // убираем лишний плюс, если есть
            let formattedEnergy = `${base} &times; 10<sup>${exponent}</sup>`; 
            
            let analysisText = langData.analysisGood.replace('{M}', dm).replace('{E}', formattedEnergy);
            
            let fullAnalysis = `<br><br><strong>${langData.analysisTitle}</strong><br>${analysisText}<br><div class="moral-message">${langData.moral}</div>`;

            feedback.className = 'feedback-success';
            feedback.innerHTML = langData.msgSuccess + fullAnalysis;
            
            // ЗАПУСК АНИМАЦИИ (перевес весов и вспышка энергии)
            document.getElementById('simArea').classList.add('tilted');
            document.getElementById('massDefectText').style.opacity = '1';
        } else {
            feedback.className = 'feedback-error';
            feedback.innerHTML = langData.msgError;
            // Убираем анимацию при ошибке
            document.getElementById('simArea').classList.remove('tilted');
            document.getElementById('massDefectText').style.opacity = '0';
        }
    }

    // Инициализация
    window.onload = function() {
        setLang('ru');
    };
</script>

</body>
</html>
