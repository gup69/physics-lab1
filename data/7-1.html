<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор / Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
        }
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            background: #e9ecef;
            border: 1px solid #ced4da;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #495057;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: #17a2b8;
            color: white;
            border-color: #17a2b8;
        }
        h1 {
            color: #003366;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            margin-top: 10px;
            border-bottom: 2px solid #17a2b8;
            padding-bottom: 15px;
            padding-right: 150px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }
        .control-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #495057;
        }
        .control-group input {
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 16px;
        }
        
        /* Зона симуляции */
        .simulation-area {
            position: relative;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 40px 20px 20px 20px; 
            min-height: 250px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .start-line {
            position: absolute;
            top: 40px;
            bottom: 20px;
            left: 20px;
            border-left: 3px solid #adb5bd;
            z-index: 1;
        }
        .dog-line {
            position: absolute;
            top: 40px;
            bottom: 20px;
            border-left: 3px dashed #ff9800;
            z-index: 5;
            transition: left 0.3s ease;
        }
        .dog-marker {
            position: absolute;
            top: 50%;
            left: -7px;
            width: 12px;
            height: 12px;
            background-color: #ff9800;
            border-radius: 50%;
            transform: translateY(-50%);
        }
        .dog-label {
            position: absolute;
            top: -25px;
            left: 0;
            transform: translateX(-50%);
            color: #f57c00;
            font-weight: bold;
            white-space: nowrap;
            background-color: rgba(248, 249, 250, 0.9);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .car-section {
            margin-bottom: 30px;
            position: relative;
            padding-left: 20px; /* Отступ от стартовой линии */
        }
        .car-info {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .car-a-text { color: #1976d2; }
        .car-b-text { color: #d32f2f; }
        
        .track {
            position: relative;
            height: 40px;
            border-bottom: 3px solid #6c757d;
        }
        
        /* Анимированные автомобили */
        .car-animator {
            position: absolute;
            bottom: 2px;
            left: 0%;
            transition: left 1.5s ease-out; /* Плавная анимация движения */
            z-index: 10;
        }
        .car-box {
            width: 50px;
            height: 25px;
            border-radius: 6px 6px 2px 2px;
            position: relative;
        }
        /* Колеса */
        .car-box::before, .car-box::after {
            content: '';
            position: absolute;
            bottom: -4px;
            width: 10px;
            height: 10px;
            background-color: #212529;
            border-radius: 50%;
        }
        .car-box::before { left: 5px; }
        .car-box::after { right: 5px; }
        
        .car-a-box { background-color: #1976d2; }
        .car-b-box { background-color: #d32f2f; }
        
        .distance-text {
            font-size: 14px;
            font-weight: bold;
            display: none; /* Скрыто до правильного ответа */
            background: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .text-safe { color: #388e3c; border-color: #c8e6c9; background: #e8f5e9; }
        .text-danger { color: #c62828; border-color: #ffcdd2; background: #ffebee; }

        /* Блок проверки знаний */
        .quiz-section {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #90caf9;
        }
        .quiz-section h3 {
            margin-top: 0;
            color: #0d47a1;
        }
        .quiz-inputs {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .quiz-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quiz-input-group input {
            width: 80px;
            padding: 8px;
            border: 1px solid #90caf9;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn-check {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-check:hover {
            background-color: #115293;
        }
        #feedback {
            margin-top: 15px;
            font-size: 16px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            line-height: 1.5;
        }
        .feedback-success {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #a5d6a7;
        }
        .feedback-error {
            background-color: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef9a9a;
        }
        .moral-message {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-weight: bold;
            color: #d32f2f;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLang('kk')" id="btn-kk">ҚАЗ</button>
        <button class="lang-btn active" onclick="setLang('ru')" id="btn-ru">РУС</button>
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">ENG</button>
    </div>

    <h1 data-i18n="title">РАСЧЕТ ПУТИ ЗА ВРЕМЯ РЕАКЦИИ (t = 1 с)</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="speedA" data-i18n="lblSpeedA">Скорость А (км/ч):</label>
            <input type="number" id="speedA" value="36" min="0" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label for="speedB" data-i18n="lblSpeedB">Скорость Б (км/ч):</label>
            <input type="number" id="speedB" value="72" min="0" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label for="dogDist" data-i18n="lblDist">Дистанция до собаки (м):</label>
            <input type="number" id="dogDist" value="15" min="1" oninput="updateSimulation()">
        </div>
    </div>

    <div class="simulation-area">
        <div class="start-line"></div>
        <div class="dog-line" id="dogLine">
            <div class="dog-label" id="dogLabel">Собака (15 м)</div>
            <div class="dog-marker"></div>
        </div>

        <div class="car-section">
            <div class="car-info">
                <div class="car-a-text">
                    <span id="carAlabelText">Автомобиль А</span>:&nbsp;v = <span id="valA_kmh">36</span>&nbsp;<span class="unit-kmh">км/ч</span>
                </div>
                <div class="distance-text" id="textA"></div>
            </div>
            <div class="track">
                <div class="car-animator" id="carA">
                    <div class="car-box car-a-box"></div>
                </div>
            </div>
        </div>

        <div class="car-section">
            <div class="car-info">
                <div class="car-b-text">
                    <span id="carBlabelText">Автомобиль Б</span>:&nbsp;v = <span id="valB_kmh">72</span>&nbsp;<span class="unit-kmh">км/ч</span>
                </div>
                <div class="distance-text" id="textB"></div>
            </div>
            <div class="track">
                <div class="car-animator" id="carB">
                    <div class="car-box car-b-box"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="quiz-section">
        <h3 data-i18n="quizTitle">Проверка расчетов</h3>
        <p data-i18n="quizDesc">Рассчитайте путь, который проедет каждый автомобиль до начала торможения (за время реакции t = 1 с).</p>
        <div class="quiz-inputs">
            <div class="quiz-input-group">
                <label for="ansA">S(A) = </label>
                <input type="number" id="ansA" placeholder="м">
            </div>
            <div class="quiz-input-group">
                <label for="ansB">S(Б) = </label>
                <input type="number" id="ansB" placeholder="м">
            </div>
        </div>
        <button class="btn-check" data-i18n="btnCheck" onclick="checkAnswers()">Проверить ответы</button>
        <div id="feedback"></div>
    </div>
</div>

<script>
    // --- СЛОВАРЬ ПЕРЕВОДОВ ---
    const dict = {
        ru: {
            title: "РАСЧЕТ ПУТИ ЗА ВРЕМЯ РЕАКЦИИ (t = 1 с)",
            lblSpeedA: "Скорость А (км/ч):",
            lblSpeedB: "Скорость Б (км/ч):",
            lblDist: "Дистанция до собаки (м):",
            quizTitle: "Проверка расчетов",
            quizDesc: "Рассчитайте путь, который проедет каждый автомобиль до начала торможения (за время реакции t = 1 с).",
            btnCheck: "Проверить ответы",
            unitKmh: "км/ч",
            unitM: "м",
            carA: "Автомобиль А",
            carB: "Автомобиль Б",
            dogName: "Собака",
            collision: "Столкновение!",
            errFill: "<strong>Ошибка:</strong> Пожалуйста, введите оба значения перед проверкой.",
            msgSuccess: "<strong>✅ Верно!</strong> Вы правильно применили формулу с учетом перевода км/ч в м/с.",
            msgError: "<strong>❌ Ошибка в вычислениях.</strong> Не забудьте сначала перевести скорость в м/с (разделив на 3.6), а затем умножить на время реакции (1 с).",
            analysisTitle: "Анализ ситуации на дороге:",
            statusOk: "✔ Водитель {X} едет с допустимой скоростью (≤ 40 км/ч).",
            statusBad: "❌ Водитель {X} превышает скорость!",
            moral: "⚠️ Помните: от безответственных действий водителя и несоблюдения скоростного режима могут пострадать окружающие!"
        },
        kk: {
            title: "РЕАКЦИЯ УАҚЫТЫНДАҒЫ ЖОЛДЫ ЕСЕПТЕУ (t = 1 с)",
            lblSpeedA: "А жылдамдығы (км/сағ):",
            lblSpeedB: "Б жылдамдығы (км/сағ):",
            lblDist: "Итке дейінгі қашықтық (м):",
            quizTitle: "Есептеулерді тексеру",
            quizDesc: "Әрбір автомобильдің тежелу басталғанға дейінгі (реакция уақыты t = 1 с ішінде) жүретін жолын есептеңіз.",
            btnCheck: "Жауаптарды тексеру",
            unitKmh: "км/сағ",
            unitM: "м",
            carA: "А автомобилі",
            carB: "Б автомобилі",
            dogName: "Ит",
            collision: "Соқтығысу!",
            errFill: "<strong>Қате:</strong> Тексермес бұрын екі мәнді де енгізіңіз.",
            msgSuccess: "<strong>✅ Дұрыс!</strong> Сіз км/сағ-ты м/с-қа аударуды ескере отырып формуланы дұрыс қолдандыңыз.",
            msgError: "<strong>❌ Есептеудегі қателік.</strong> Алдымен жылдамдықты м/с-қа (3.6-ға бөліп) аударып, содан кейін реакция уақытына (1 с) көбейтуді ұмытпаңыз.",
            analysisTitle: "Жолдағы жағдайды талдау:",
            statusOk: "✔ {X} жүргізушісі рұқсат етілген жылдамдықпен келе жатыр (≤ 40 км/сағ).",
            statusBad: "❌ {X} жүргізушісі жылдамдықты асыруда!",
            moral: "⚠️ Есіңізде болсын: жүргізушінің жауапсыз әрекеттерінен және жылдамдық режимін сақтамауынан айналадағы адамдар зардап шегуі мүмкін!"
        },
        en: {
            title: "REACTION TIME DISTANCE CALCULATION (t = 1 s)",
            lblSpeedA: "Speed A (km/h):",
            lblSpeedB: "Speed B (km/h):",
            lblDist: "Distance to the dog (m):",
            quizTitle: "Calculation check",
            quizDesc: "Calculate the distance each car will travel before braking begins (during reaction time t = 1 s).",
            btnCheck: "Check answers",
            unitKmh: "km/h",
            unitM: "m",
            carA: "Car A",
            carB: "Car B",
            dogName: "Dog",
            collision: "Collision!",
            errFill: "<strong>Error:</strong> Please enter both values before checking.",
            msgSuccess: "<strong>✅ Correct!</strong> You correctly applied the formula considering the conversion from km/h to m/s.",
            msgError: "<strong>❌ Calculation error.</strong> Remember to first convert the speed to m/s (by dividing by 3.6), and then multiply by the reaction time (1 s).",
            analysisTitle: "Road situation analysis:",
            statusOk: "✔ Driver {X} is driving at a permitted speed (≤ 40 km/h).",
            statusBad: "❌ Driver {X} is speeding!",
            moral: "⚠️ Remember: irresponsible actions of the driver and failure to comply with the speed limit can harm others!"
        }
    };

    let currentLang = 'ru';
    let currentSa = 0;
    let currentSb = 0;
    let currentMaxDist = 1;
    let currentDogDist = 15;
    const SPEED_LIMIT_KMH = 40;

    function setLang(lang) {
        currentLang = lang;
        
        // Обновляем кнопки переключателя
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');

        // Обновляем статические тексты по атрибутам
        document.querySelectorAll('[data-i18n]').forEach(el => {
            let key = el.getAttribute('data-i18n');
            if (dict[lang][key]) {
                el.innerHTML = dict[lang][key];
            }
        });

        // Обновляем единицы измерения
        document.querySelectorAll('.unit-kmh').forEach(el => el.textContent = dict[lang].unitKmh);
        document.getElementById('ansA').placeholder = dict[lang].unitM;
        document.getElementById('ansB').placeholder = dict[lang].unitM;

        updateSimulation();
    }

    function updateSimulation() {
        let langData = dict[currentLang];
        
        let vA_kmh = parseFloat(document.getElementById('speedA').value) || 0;
        let vB_kmh = parseFloat(document.getElementById('speedB').value) || 0;
        currentDogDist = parseFloat(document.getElementById('dogDist').value) || 1; 

        let vA_ms = vA_kmh / 3.6;
        let vB_ms = vB_kmh / 3.6;

        currentSa = vA_ms * 1;
        currentSb = vB_ms * 1;

        // Обновляем названия автомобилей и собаки
        document.getElementById('carAlabelText').textContent = langData.carA;
        document.getElementById('carBlabelText').textContent = langData.carB;
        document.getElementById('dogLabel').textContent = `${langData.dogName} (${currentDogDist} ${langData.unitM})`;

        // Обновляем числа скоростей
        document.getElementById('valA_kmh').textContent = vA_kmh;
        document.getElementById('valB_kmh').textContent = vB_kmh;

        // Расчет масштаба для экрана (добавляем 20% пространства справа)
        currentMaxDist = Math.max(currentSa, currentSb, currentDogDist) * 1.2; 
        if (currentMaxDist === 0) currentMaxDist = 1; 

        // Передвигаем собаку на новую позицию
        let dogPosPercent = (currentDogDist / currentMaxDist) * 100;
        document.getElementById('dogLine').style.left = `calc(${dogPosPercent}% + 20px)`;

        // СБРОС АНИМАЦИИ: Возвращаем машины на старт и скрываем итоговый текст
        document.getElementById('carA').style.left = '0%';
        document.getElementById('carB').style.left = '0%';
        
        document.getElementById('textA').style.display = 'none';
        document.getElementById('textB').style.display = 'none';
        document.getElementById('feedback').style.display = 'none';
        
        // Очищаем поля ввода пользователя, если он меняет условия
        document.getElementById('ansA').value = '';
        document.getElementById('ansB').value = '';
    }

    function checkAnswers() {
        let langData = dict[currentLang];
        let userA = parseFloat(document.getElementById('ansA').value);
        let userB = parseFloat(document.getElementById('ansB').value);
        let vA_kmh = parseFloat(document.getElementById('speedA').value) || 0;
        let vB_kmh = parseFloat(document.getElementById('speedB').value) || 0;
        let feedback = document.getElementById('feedback');

        feedback.style.display = 'block';

        let isACorrect = Math.abs(userA - currentSa) < 0.2;
        let isBCorrect = Math.abs(userB - currentSb) < 0.2;

        let statusA = vA_kmh <= SPEED_LIMIT_KMH 
            ? `<span style="color: #2e7d32;">${langData.statusOk.replace('{X}', 'А')}</span>` 
            : `<span style="color: #c62828;">${langData.statusBad.replace('{X}', 'А')}</span>`;
            
        let statusB = vB_kmh <= SPEED_LIMIT_KMH 
            ? `<span style="color: #2e7d32;">${langData.statusOk.replace('{X}', 'Б')}</span>` 
            : `<span style="color: #c62828;">${langData.statusBad.replace('{X}', 'Б')}</span>`;

        let analysisHtml = `<br><br><strong>${langData.analysisTitle}</strong><br>${statusA}<br>${statusB}`;
        let moralHtml = `<div class="moral-message">${langData.moral}</div>`;

        if (isNaN(userA) || isNaN(userB)) {
            feedback.className = 'feedback-error';
            feedback.innerHTML = langData.errFill;
        } else if (isACorrect && isBCorrect) {
            feedback.className = 'feedback-success';
            feedback.innerHTML = langData.msgSuccess + analysisHtml + moralHtml;
            
            // ЗАПУСК АНИМАЦИИ при правильном ответе
            animateCars(langData);
        } else {
            feedback.className = 'feedback-error';
            feedback.innerHTML = langData.msgError + analysisHtml + moralHtml;
        }
    }

    function animateCars(langData) {
        // Расчет процентов для сдвига машин (с учетом отступа стартовой линии)
        let posA = (currentSa / currentMaxDist) * 100;
        let posB = (currentSb / currentMaxDist) * 100;
        
        document.getElementById('carA').style.left = `calc(${posA}%)`;
        document.getElementById('carB').style.left = `calc(${posB}%)`;

        // Показываем текст дистанций (с задержкой для эффекта)
        setTimeout(() => {
            let textA = document.getElementById('textA');
            let textB = document.getElementById('textB');
            
            textA.style.display = 'block';
            textB.style.display = 'block';
            
            // Оформление текста А
            let sAText = `S(A) = ${currentSa.toFixed(1).replace('.0', '')} ${langData.unitM}`;
            if (currentSa >= currentDogDist) {
                textA.className = 'distance-text text-danger';
                textA.textContent = sAText + ' — ' + langData.collision;
            } else {
                textA.className = 'distance-text text-safe';
                textA.textContent = sAText;
            }

            // Оформление текста Б
            let sBText = `S(Б) = ${currentSb.toFixed(1).replace('.0', '')} ${langData.unitM}`;
            if (currentSb >= currentDogDist) {
                textB.className = 'distance-text text-danger';
                textB.textContent = sBText + ' — ' + langData.collision;
            } else {
                textB.className = 'distance-text text-safe';
                textB.textContent = sBText;
            }
        }, 1500); // Показываем результат после завершения анимации (1.5 сек)
    }

    // Инициализация
    window.onload = function() {
        setLang('ru');
    };
</script>

</body>
</html>
