    function updateSimulation() {
        const angleDeg = parseFloat(angleSlider.value);
        const angleRad = angleDeg * (Math.PI / 180);
        const h = PLANE_LENGTH_METERS * Math.sin(angleRad);
        const baseLength = PLANE_LENGTH_METERS * Math.cos(angleRad);
        const forceGravityComponent = BLOCK_MASS * G * Math.sin(angleRad);
        const forceNormal = BLOCK_MASS * G * Math.cos(angleRad);
        const forceFriction = FRICTION_COEFFICIENT * forceNormal;
        const forceTraction = forceGravityComponent + forceFriction;
        angleValue.textContent = `${angleDeg}°`;
        inclinedPlane.style.transform = `rotate(${-angleDeg}deg)`;
        planeBase.style.width = `${baseLength * PIXELS_PER_METER}px`;
        planeHeight.style.height = `${h * PIXELS_PER_METER}px`;
        planeHeight.style.left = `${20 + baseLength * PIXELS_PER_METER}px`;

        heightLine.textContent = `h = ${h.toFixed(2)} м`;
    }

    }

    function checkAnswers() {
        // ИСПРАВЛЕНО: Полностью переписана логика валидации
        let allFieldsValid = true;
        validationMessageDiv.textContent = ''; 

        // 1. Сначала убираем всю предыдущую подсветку
        const allInputs = document.querySelectorAll('.student-info input, #results-table-body input');
        allInputs.forEach(input => input.classList.remove('empty-input'));

        // 2. Проверяем поля ученика
        const studentInputs = document.querySelectorAll('.student-info input');
        studentInputs.forEach(input => {
            if (input.value.trim() === '') {
                allFieldsValid = false;
                input.classList.add('empty-input');
            }
        });

        // 3. Проверяем поля таблицы
        const tableInputs = document.querySelectorAll('#results-table-body input:not([disabled])');
        tableInputs.forEach(input => {
            if (input.value.trim() === '') {
                allFieldsValid = false;
                input.classList.add('empty-input');
            }
        });

        // 4. Если что-то не заполнено, показываем сообщение и выходим
        if (!allFieldsValid) {
            validationMessageDiv.textContent = translations[currentLang].validation_message;
            return;
        }
        // Конец блока валидации

        let correctCount = 0;
        const totalQuestions = 9;
        answersReviewDiv.innerHTML = `<h4>${translations[currentLang].answers_review_title}</h4>`;

        for (let i = 1; i <= 3; i++) {
            const rowData = state.currentTableData[i-1];
            if (!rowData.h) { 
                validationMessageDiv.textContent = translations[currentLang].validation_message;
                return;
            }

            const userAp = parseFloat(document.getElementById(`Ap-${i}`).value.replace(',', '.'));
            const userAz = parseFloat(document.getElementById(`Az-${i}`).value.replace(',', '.'));
            const userKpd = parseFloat(document.getElementById(`kpd-${i}`).value.replace(',', '.'));
            
            const correctAp = BLOCK_MASS * G * rowData.h;
            const correctAz = rowData.F * rowData.l;
            const correctKpd = (correctAp / correctAz) * 100;

            correctCount += checkAndHighlight(`Ap-${i}`, userAp, correctAp, 0.05, `Опыт ${i}, A<sub>полезная</sub>`);
            correctCount += checkAndHighlight(`Az-${i}`, userAz, correctAz, 0.05, `Опыт ${i}, A<sub>затраченная</sub>`);
            correctCount += checkAndHighlight(`kpd-${i}`, userKpd, correctKpd, 2, `Опыт ${i}, КПД`);
        }
        
        state.attemptsLeft--;
        const finalScore = Math.round((correctCount / totalQuestions) * 10);
        state.finalScoreText = `${finalScore} ${translations[currentLang].out_of_10}`;
        finalResultDiv.innerHTML = `<h3>${translations[currentLang].final_result_title} <span class="${finalScore > 7 ? 'correct' : 'incorrect'}">${state.finalScoreText}</span></h3>`;

        if (state.attemptsLeft <= 0 || correctCount === totalQuestions) {
            checkButton.disabled = true;
            checkButton.style.backgroundColor = '#7f8c8d';
            showAnswersButton.style.display = 'inline-block';
            shareToTeacherButton.style.display = 'inline-block';
            answersReviewDiv.style.display = 'block';
            disableAllInputs();
        }
        updateCheckButtonText();
    }
    
    function checkAndHighlight(inputId, userValue, correctValue, tolerance, label) {
        const input = document.getElementById(inputId);
        const isCorrect = !isNaN(userValue) && Math.abs(userValue - correctValue) <= tolerance * (tolerance > 1 ? 1 : correctValue);
        input.classList.remove('correct-input', 'incorrect-input');
        input.classList.add(isCorrect ? 'correct-input' : 'incorrect-input');
        let reviewHTML = `<div><strong>${label}:</strong> `;
        if (isCorrect) {
            reviewHTML += `<span class="correct">${translations[currentLang].your_answer} ${userValue.toFixed(2)} ✔</span>`;
        } else {
            reviewHTML += `<span class="incorrect">${translations[currentLang].your_answer} ${isNaN(userValue) ? '?' : userValue.toFixed(2)} ✖</span> | <span class="correct">${translations[currentLang].correct_answer} ${correctValue.toFixed(2)}</span>`;
        }
        reviewHTML += `</div>`;
        answersReviewDiv.innerHTML += reviewHTML;
        return isCorrect ? 1 : 0;
    }

    function showAnswers() {
        for (let i = 1; i <= 3; i++) {
            const rowData = state.currentTableData[i-1];
            if (rowData.h) {
                const correctAp = BLOCK_MASS * G * rowData.h;
                // ИСПРАВЛЕНА ОПЕЧАТКА: было rowAta.l, стало rowData.l
                const correctAz = rowData.F * rowData.l;
                const correctKpd = (correctAp / correctAz) * 100;
                document.getElementById(`Ap-${i}`).value = correctAp.toFixed(2);
                document.getElementById(`Az-${i}`).value = correctAz.toFixed(2);
                document.getElementById(`kpd-${i}`).value = correctKpd.toFixed(1);
            }
        }
    }
    
    function disableAllInputs() {
        document.querySelectorAll('#results-table-body input:not([disabled])').forEach(input => input.disabled = true);
    }
    
    async function shareToTeacher() {
        const button = shareToTeacherButton;
        button.disabled = true;
        button.textContent = translations[currentLang].sending;
        try {
            const canvas = await html2canvas(document.getElementById('printableArea'), { scale: 2 });
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const student = `${document.getElementById('student_lastname').value} ${document.getElementById('student_firstname').value}`;
            const studentClass = `${document.getElementById('student_class_number').value}${document.getElementById('student_class_letter').value}`;
            const caption = `${translations[currentLang].report_student} ${student}\n` + `${translations[currentLang].report_class} ${studentClass}\n` + `${translations[currentLang].main_title}\n` + `${translations[currentLang].report_score} ${state.finalScoreText}`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('caption', caption);
            formData.append('photo', blob, 'report.png');
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
            const result = await response.json();
            if (result.ok) {
                button.textContent = translations[currentLang].send_success;
                button.style.backgroundColor = '#27ae60';
            } else { throw new Error(result.description); }
        } catch (error) {
            console.error('Telegram API error:', error);
            button.textContent = translations[currentLang].send_error;
            button.style.backgroundColor = '#e74c3c';
        }
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-key]').forEach(element => {
            const key = element.dataset.key;
            if (translations[lang] && translations[lang][key]) {
                let text = translations[lang][key];
                if (key === 'copyright') text = text.replace('{year}', new Date().getFullYear());
                if (key === 'instruction_step2') text = text.replace('{mass}', BLOCK_MASS);
                element.innerHTML = text;
            }
        });
        updateCheckButtonText();
    }

    function updateCheckButtonText() {
        if (state.attemptsLeft > 0 && !checkButton.disabled) {
            const attemptKey = state.attemptsLeft === 1 ? 'attempts_left_1' : 'attempts_left_2';
            const attemptText = translations[currentLang][attemptKey];
            checkButton.innerHTML = `${translations[currentLang].check_button} (${state.attemptsLeft} ${attemptText})`;
        } else {
            checkButton.innerHTML = translations[currentLang].check_button;
        }
    }
    
    function generateTable() {
        const tbody = document.getElementById('results-table-body');
        tbody.innerHTML = '';
        for (let i = 1; i <= 3; i++) {
            tbody.innerHTML += `<tr><td>${i}</td><td><input type="text" id="h-${i}" disabled></td><td><input type="text" id="l-${i}" disabled></td><td><input type="text" id="F-${i}" disabled></td><td><input type="text" id="Ap-${i}" placeholder="0.00"></td><td><input type="text" id="Az-${i}" placeholder="0.00"></td><td><input type="text" id="kpd-${i}" placeholder="0.0"></td><td><button class="record-btn" id="record-btn-${i}" data-key="record_button"></button></td></tr>`;
        }
        for (let i = 1; i <= 3; i++) {
            document.getElementById(`record-btn-${i}`).addEventListener('click', () => recordData(i));
        }
    }

    // Инициализация
    generateTable();
    updateSimulation();
    setLanguage('ru');

    // Обработчики событий
    angleSlider.addEventListener('input', updateSimulation);
    checkButton.addEventListener('click', checkAnswers);
    showAnswersButton.addEventListener('click', showAnswers);
    shareToTeacherButton.addEventListener('click', shareToTeacher);
    document.querySelectorAll('.lang-btn[data-lang]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelector('.lang-btn.active').classList.remove('active');
            e.target.classList.add('active');
            setLanguage(e.target.dataset.lang);
        });
    });
    document.getElementById('backButton').addEventListener('click', () => window.history.back());
});
</script>
</body>
</html>
