    const lever = document.getElementById('lever');
    const leverArea = document.getElementById('lever-area');
    const leverMarkings = document.getElementById('lever-markings');
    const weightsSource = document.querySelector('.weights-source .weight');
    const resetSimBtn = document.getElementById('reset-sim-btn');
    const backButton = document.getElementById('backButton');
    const checkButton = document.getElementById('checkButton');
    const showAnswersButton = document.getElementById('showAnswersButton');
    const shareToTeacherButton = document.getElementById('shareToTeacherButton');
    const finalResultDiv = document.getElementById('finalResult');
    const answersReviewDiv = document.getElementById('answersReview');
    const validationMessageDiv = document.getElementById('validationMessage');

    let state = { attemptsLeft: 2, finalScoreText: '' };
    let draggedItem = null;
    const PIXELS_PER_METER = 200;
    const LEVER_LENGTH_PX = 600;
    const FULCRUM_OFFSET_PX = LEVER_LENGTH_PX / 2;

    function setupLever() {
        leverMarkings.innerHTML = '';
        for (let i = -15; i <= 15; i++) {
            if (i === 0) continue;
            const pos = FULCRUM_OFFSET_PX + i * (PIXELS_PER_METER / 10);
            const mark = document.createElement('div'); mark.classList.add('mark');
            const hook = document.createElement('div'); hook.classList.add('weight-hook');
            if (i % 5 === 0) {
                mark.classList.add('major');
                const label = document.createElement('span'); label.classList.add('mark-label');
                label.textContent = Math.abs(i) / 10;
                mark.appendChild(label);
            } else { mark.classList.add('minor'); }
            mark.style.left = `${pos}px`;
            mark.appendChild(hook);
            leverMarkings.appendChild(mark);
        }
    }
    function updateLeverBalance() {
        let netTorque = 0;
        const weightsOnLever = lever.querySelectorAll('.weight');
        weightsOnLever.forEach(w => {
            const posPixels = parseFloat(w.style.left) + (w.offsetWidth / 2);
            const distancePixels = posPixels - FULCRUM_OFFSET_PX;
            const distanceMeters = distancePixels / PIXELS_PER_METER;
            const force = parseFloat(w.textContent);
            netTorque += force * distanceMeters;
        });
        const angle = Math.max(-20, Math.min(20, netTorque * 5));
        lever.style.transform = `translateX(-50%) rotate(${angle}deg)`;
    }
    function resetSimulation() {
        lever.querySelectorAll('.weight').forEach(w => w.remove());
        updateLeverBalance();
    }
    
    // *** ОБНОВЛЕННАЯ ЛОГИКА ПЕРЕМЕЩЕНИЯ ***
    function startDrag(event, element, isSource) {
        event.preventDefault();

        if (isSource) {
            draggedItem = element.cloneNode(true);
        } else {
            draggedItem = element;
        }

        // Делаем элемент видимым поверх всего
        draggedItem.style.position = 'fixed';
        draggedItem.style.zIndex = '1000';
        draggedItem.style.cursor = 'grabbing';
        document.body.appendChild(draggedItem);

        let shiftX = event.clientX - element.getBoundingClientRect().left;
        let shiftY = event.clientY - element.getBoundingClientRect().top;

        moveAt(event.clientX, event.clientY);

        function moveAt(clientX, clientY) {
            draggedItem.style.left = `${clientX - shiftX}px`;
            draggedItem.style.top = `${clientY - shiftY}px`;
        }

        function onMouseMove(event) {
            moveAt(event.clientX, event.clientY);
        }
        document.addEventListener('mousemove', onMouseMove);

        function onMouseUp(event) {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);

            const rect = leverArea.getBoundingClientRect();
            // Проверяем, отпущена ли мышь над областью рычага
            if (event.clientX > rect.left && event.clientX < rect.right && event.clientY > rect.top && event.clientY < rect.bottom) {
                // Если да, то размещаем груз
                lever.appendChild(draggedItem);
                draggedItem.style.position = 'absolute'; // Возвращаем обычное позиционирование
                draggedItem.style.cursor = 'grab';
                draggedItem.style.zIndex = '100';

                const dropX = event.clientX - rect.left;
                const snapDistanceMeters = Math.round((dropX - FULCRUM_OFFSET_PX) / (PIXELS_PER_METER / 10)) * 0.1;
                const snapX = FULCRUM_OFFSET_PX + snapDistanceMeters * PIXELS_PER_METER - (draggedItem.offsetWidth / 2);
                
                let weightsAtSamePosition = 0;
                lever.querySelectorAll('.weight').forEach(w => {
                    if (w !== draggedItem && Math.abs(parseFloat(w.style.left) - snapX) < 1) {
                        weightsAtSamePosition++;
                    }
                });
                const weightHeight = draggedItem.offsetHeight;
                const newTop = 10 + (weightsAtSamePosition * weightHeight);

                draggedItem.style.left = `${snapX}px`;
                draggedItem.style.top = `${newTop}px`;
            } else {
                // Если мышь отпущена за пределами области, удаляем груз
                draggedItem.remove();
            }
            
            updateLeverBalance();
            draggedItem = null;
        }
        document.addEventListener('mouseup', onMouseUp);

        if(draggedItem) {
            draggedItem.ondragstart = function() { return false; };
        }
    }

    weightsSource.addEventListener('mousedown', (e) => startDrag(e, weightsSource, true));
    
    lever.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('weight')) {
            startDrag(e, e.target, false);
        }
    });

    lever.addEventListener('dblclick', function(e) {
        if (e.target.classList.contains('weight')) {
            e.target.remove();
            updateLeverBalance();
        }
    });

            grade_level: "7th Grade", author_prefix: "Author:", author_details: "Yuriy Gryaznov, Physics Teacher, Gymnasium №8, Shymkent, Kazakhstan", copyright: "© All rights reserved, {year}", main_title: "Interactive Laboratory Work №9", lab_topic_title: "Topic: Determining the Equilibrium Condition of a Lever", lab_goal_title: "Objective:", lab_goal_text: "To experimentally verify the condition under which a lever is in equilibrium.", instruction_title: "Instructions", instruction_step1: "Place weights on the left and right arms of the lever to bring it into equilibrium.", instruction_step2: "For EACH weight or group of weights, calculate the moment of force using the formula M = F · l.", instruction_step3: "Find the SUM of all moments on the left arm and the SUM of all moments on the right arm.", instruction_step4: "Record these sums in the table. Repeat the experiment two more times.", instruction_step5: "To remove a weight, double-click on it. When the table is complete, click \"Check\".", procedure_title: "Procedure", weights_source_label: "Weights Source:", reset_sim_btn: "Reset Weights", results_table_title: "Results Table", th_exp_num: "Exp. №", th_left_arm: "Left Arm", th_right_arm: "Right Arm", th_moment_sum_left: "Sum of moments M₁, N·m", th_moment_sum_right: "Sum of moments M₂, N·m", check_button: "Check", back_button: "Back", student_lastname: "Last Name", student_firstname: "First Name", student_class_number: "Grade (number)", student_class_letter: "Letter", attempts_left_1: "attempt", attempts_left_2: "attempts", show_answers_button: "Show Answers", share_button: "Share with Teacher", sending: "Sending...", send_success: "Report sent successfully!", send_error: "Sending error.", validation_message: "Please fill in all student and table fields.", final_result_title: "Your final result:", out_of_10: "out of 10", answers_review_title: "Answer Review:", your_answer: "Your answer:", correct_answer: "Correct answer:", report_student: "Student:", report_class: "Class:", report_score: "Final Score:", review_equal: "Moments must be equal to achieve equilibrium."
        }
    };
    let currentLang = 'ru';
    
    function setLanguage(lang) {
        currentLang = lang; document.querySelector('html').setAttribute('lang', lang);
        document.querySelectorAll('[data-key]').forEach(element => {
            const key = element.getAttribute('data-key');
            if (translations[lang] && translations[lang][key]) {
                let text = translations[lang][key];
                if (key === 'copyright') { text = text.replace('{year}', new Date().getFullYear()); }
                element.innerHTML = text;
            }
        });
        updateCheckButtonText();
    }
    
    document.querySelectorAll('.lang-btn[data-lang]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (btn.classList.contains('active')) return;
            document.querySelectorAll('.lang-btn[data-lang]').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active'); setLanguage(e.target.dataset.lang);
        });
    });
    
    function updateCheckButtonText() {
        if (state.attemptsLeft > 0) {
            const attemptKey = state.attemptsLeft === 1 ? 'attempts_left_1' : 'attempts_left_2';
            const attemptText = translations[currentLang][attemptKey] || (state.attemptsLeft === 1 ? 'attempt' : 'attempts');
            checkButton.innerHTML = `${translations[currentLang].check_button} (${state.attemptsLeft} ${attemptText})`;
        }
    }
    
    checkButton.addEventListener('click', function() {
        if (state.attemptsLeft <= 0) return;
        let allFieldsValid = true;
        validationMessageDiv.style.display = 'none';
        const inputsToCheck = document.querySelectorAll('.student-info input, #results-table-body input');
        inputsToCheck.forEach(input => {
            if (input.value.trim() === '') {
                input.classList.add('incorrect-input'); allFieldsValid = false;
            } else { input.classList.remove('incorrect-input'); }
        });
        if (!allFieldsValid) {
            validationMessageDiv.textContent = translations[currentLang].validation_message;
            validationMessageDiv.style.display = 'block'; return;
        }
        state.attemptsLeft--;
        let correctRows = 0;
        const totalRows = 3;
        for (let i = 1; i <= totalRows; i++) {
            const m1_input = document.getElementById(`m1-total-${i}`);
            const m2_input = document.getElementById(`m2-total-${i}`);
            m1_input.classList.remove('correct-input', 'incorrect-input');
            m2_input.classList.remove('correct-input', 'incorrect-input');
            const m1_user = parseFloat(m1_input.value.replace(',', '.'));
            const m2_user = parseFloat(m2_input.value.replace(',', '.'));
            if (!isNaN(m1_user) && !isNaN(m2_user) && m1_user > 0 && Math.abs(m1_user - m2_user) < 0.005) {
                m1_input.classList.add('correct-input');
                m2_input.classList.add('correct-input');
                correctRows++;
            } else {
                m1_input.classList.add('incorrect-input');
                m2_input.classList.add('incorrect-input');
            }
        }
        updateCheckButtonText();
        if (state.attemptsLeft === 0) {
            checkButton.style.display = 'none';
            showAnswersButton.style.display = 'inline-block';
            shareToTeacherButton.style.display = 'inline-block';
            const score = (correctRows / totalRows * 10).toFixed(1);
            state.finalScoreText = `${score} ${translations[currentLang].out_of_10}`;
            finalResultDiv.innerHTML = `<h3>${translations[currentLang].final_result_title} <span class="${score >= 5 ? 'correct' : 'incorrect'}">${state.finalScoreText}</span></h3>`;
            document.querySelectorAll('td input, .student-info input').forEach(input => { input.disabled = true; });
        }
    });
    
    showAnswersButton.addEventListener('click', function() {
        let reviewHTML = `<h4>${translations[currentLang].answers_review_title}</h4>`;
        for (let i = 1; i <= 3; i++) {
            const m1_input = document.getElementById(`m1-total-${i}`);
            const m2_input = document.getElementById(`m2-total-${i}`);
            const isRowCorrect = m1_input.classList.contains('correct-input');
            reviewHTML += `<p><b>${translations[currentLang].th_exp_num} ${i}:</b> `;
            if (isRowCorrect) {
                reviewHTML += `<span class="correct">${m1_input.value} Н·м ≈ ${m2_input.value} Н·м. Верно!</span></p>`;
            } else {
                reviewHTML += `<span class="incorrect">${m1_input.value} Н·м ≠ ${m2_input.value} Н·м. Ошибка.</span> ${translations[currentLang].review_equal}</p>`;
            }
        }
        answersReviewDiv.innerHTML = reviewHTML;
        answersReviewDiv.style.display = 'block';
        showAnswersButton.style.display = 'none';
    });
    
    shareToTeacherButton.addEventListener('click', async function() {
        const studentLastName = document.getElementById('student_lastname').value;
        const studentFirstName = document.getElementById('student_firstname').value;
        const studentClassNumber = document.getElementById('student_class_number').value;
        const studentClassLetter = document.getElementById('student_class_letter').value;
        if (!studentLastName || !studentFirstName || !studentClassNumber || !studentClassLetter) {
            alert(translations[currentLang].validation_message); return;
        }
        const button = this;
        const originalText = button.innerHTML;
        button.disabled = true; button.innerHTML = translations[currentLang].sending;
        let reportText = `*Отчет по лабораторной работе №10*\n\n`;
        reportText += `*${translations[currentLang].report_student}* ${studentLastName} ${studentFirstName}\n`;
        reportText += `*${translations[currentLang].report_class}* ${studentClassNumber} "${studentClassLetter}"\n`;
        reportText += `*${translations[currentLang].report_score}* ${state.finalScoreText}\n\n`;
        reportText += `*Таблица результатов:*\n`;
        reportText += `\`\`\`\n`;
        reportText += `| № | M1 (сумма, ответ) | M2 (сумма, ответ) |\n`;
        reportText += `|---|-------------------|-------------------|\n`;
        for (let i = 1; i <= 3; i++) {
            const m1 = document.getElementById(`m1-total-${i}`).value;
            const m2 = document.getElementById(`m2-total-${i}`).value;
            reportText += `| ${i} | ${m1.padEnd(17)} | ${m2.padEnd(17)} |\n`;
        }
        reportText += `\`\`\``;
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: reportText, parse_mode: 'Markdown' }) });
            const data = await response.json();
            if (data.ok) { button.innerHTML = translations[currentLang].send_success; } else { throw new Error(data.description); }
        } catch (error) {
            console.error('Telegram API error:', error); button.innerHTML = translations[currentLang].send_error;
            setTimeout(() => { button.disabled = false; button.innerHTML = originalText; }, 3000);
        }
    });

    // --- НАЧАЛЬНАЯ НАСТРОЙКА ПРИ ЗАГРУЗКЕ СТРАНИЦЫ ---
    resetSimBtn.addEventListener('click', resetSimulation);
    backButton.addEventListener('click', () => window.history.back());
    setupLever();
    setLanguage('ru');
    updateCheckButtonText();
});
</script>
</body>
</html>
