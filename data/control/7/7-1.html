    location.reload();
}

function renderAssessment() {
    document.getElementById('title').innerText = uiText[currentLang].title;
    document.getElementById('back-txt').innerText = uiText[currentLang].back;
    document.getElementById('submit-btn').innerText = uiText[currentLang].submit;
    document.getElementById('variant-id').innerText = (currentLang === 'ru' ? "Индивидуальный вариант №" : (currentLang === 'kk' ? "Жеке нұсқа №" : "Individual Variant №")) + (variant + 1);

    document.querySelectorAll('.lang-switcher button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + currentLang).classList.add('active');

    // --- ЧАСТЬ 1: ТЕСТЫ (4 балла) ---
    let p1 = document.getElementById('part1');
    p1.innerHTML = `<h2>${uiText[currentLang].p1}</h2>`;
    
    let shuffledTests = shuffle([...questionsBank]).slice(0, 4);
    shuffledTests.forEach((t, i) => {
        let div = document.createElement('div');
        div.className = 'task';
        div.innerHTML = `<p>${i + 1}. ${t.q[currentLang]}</p>`;
        
        let shuffledOpts = shuffle([...t.o]);
        shuffledOpts.forEach(opt => {
            let textIdx = currentLang === 'ru' ? 0 : (currentLang === 'kk' ? 1 : 2);
            div.innerHTML += `
                <label class="option-label">
                    <input type="radio" name="test-${i}" data-correct="${opt[3]}"> ${opt[textIdx]}
                </label>`;
        });
        p1.appendChild(div);
    });

    // --- ЧАСТЬ 2: СООТВЕТСТВИЯ (3 пары) ---
    let p2 = document.getElementById('part2');
    p2.innerHTML = `<h2>${uiText[currentLang].p2}</h2>`;
    
    let matchCard = document.createElement('div');
    matchCard.className = 'task';
    matchCard.innerHTML = `<p>${uiText[currentLang].matchPrompt}</p>`;
    
    let shuffledMatching = shuffle([...matchingBank]);
    shuffledMatching.forEach((m, i) => {
        let shuffledOpts = shuffle([...m.options]);
        let selectHtml = `<option value="">-- ${currentLang==='ru'?'Выберите':'Таңдаңыз'} --</option>`;
        
        shuffledOpts.forEach(opt => {
            // Исправлено: обращаемся к объекту текста по ключу языка, а не по индексу
            let optText = opt.text[currentLang];
            selectHtml += `<option value="${opt.key}">${opt.key}) ${optText}</option>`;
        });

        matchCard.innerHTML += `
            <div class="matching-row">
                <span><b>${i + 1})</b> ${m.term[currentLang]}</span>
                <select class="match-select" data-correct="${m.correct}">${selectHtml}</select>
            </div>`;
    });
    p2.appendChild(matchCard);

    // --- ЧАСТЬ 3: КОНТЕКСТ (3 вопроса) ---
    let p3 = document.getElementById('part3');
    let activeCtx = contextVariants[variant];
    
    p3.innerHTML = `
        <h2>${uiText[currentLang].p3}</h2>
        <div class="context-box">${activeCtx.text[currentLang]}</div>`;

    activeCtx.questions.forEach((cq, i) => {
        let div = document.createElement('div');
        div.className = 'task';
        div.innerHTML = `<p>${cq.q[currentLang]}</p>`;
        
        let shuffledCqOpts = shuffle([...cq.o]);
        shuffledCqOpts.forEach(opt => {
            let textIdx = currentLang === 'ru' ? 0 : (currentLang === 'kk' ? 1 : 2);
            div.innerHTML += `
                <label class="option-label">
                    <input type="radio" name="ctx-${i}" data-correct="${opt[3]}"> ${opt[textIdx]}
                </label>`;
        });
        p3.appendChild(div);
    });
}

function checkAssessment() {
    let score = 0;

    // Проверка тестов (4 балла)
    document.querySelectorAll('#part1 .task').forEach(task => {
        let selected = task.querySelector('input[type="radio"]:checked');
        let statusSpan = document.createElement('span');
        statusSpan.className = 'status';
        if (selected) {
            if (selected.getAttribute('data-correct') === 'true') {
                score++;
                statusSpan.innerText = '✅';
                selected.parentElement.style.borderColor = '#059669';
                selected.parentElement.style.background = '#ECFDF5';
            } else {
                statusSpan.innerText = '❌';
                selected.parentElement.style.borderColor = '#DC2626';
                selected.parentElement.style.background = '#FEF2F2';
            }
            selected.parentElement.appendChild(statusSpan);
        }
    });

    // Проверка соответствий (3 балла)
    document.querySelectorAll('.matching-row').forEach(row => {
        let select = row.querySelector('select');
        let statusSpan = document.createElement('span');
        statusSpan.className = 'status';
        if (select.value === select.getAttribute('data-correct')) {
            score++;
            statusSpan.innerText = '✅';
            select.style.borderColor = '#059669';
        } else {
            statusSpan.innerText = '❌';
            select.style.borderColor = '#DC2626';
        }
        row.appendChild(statusSpan);
    });

    // Проверка контекста (3 балла)
    document.querySelectorAll('#part3 .task').forEach(task => {
        let selected = task.querySelector('input[type="radio"]:checked');
        let statusSpan = document.createElement('span');
        statusSpan.className = 'status';
        if (selected) {
            if (selected.getAttribute('data-correct') === 'true') {
                score++;
                statusSpan.innerText = '✅';
                selected.parentElement.style.borderColor = '#059669';
                selected.parentElement.style.background = '#ECFDF5';
            } else {
                statusSpan.innerText = '❌';
                selected.parentElement.style.borderColor = '#DC2626';
                selected.parentElement.style.background = '#FEF2F2';
            }
            selected.parentElement.appendChild(statusSpan);
        }
    });

    document.getElementById('submit-btn').style.display = 'none';
    let scoreBox = document.getElementById('score-box');
    scoreBox.style.display = 'block';
    
    let gradeText = currentLang === 'ru' ? 'Итоговая оценка:' : (currentLang === 'kk' ? 'Қорытынды баға:' : 'Final Grade:');
    scoreBox.innerText = `${gradeText} ${score} / 10`;
    scoreBox.scrollIntoView({ behavior: 'smooth' });
}

window.onload = renderAssessment;
</script>
</body>
</html>
