<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный Клуб: Безмолвный Саботаж</title>
    
    <style>
        /* Все стили (CSS) остаются точно такими же, как в прошлых версиях. */
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #game-container { position: relative; width: 1280px; height: 720px; background-color: #000; background-size: cover; background-position: center; border-radius: 10px; overflow: hidden; transition: background-image 0.5s ease-in-out; }
        #stats-display { position: absolute; top: 20px; left: 20px; background-color: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 8px; font-size: 22px; z-index: 30; }
        #stats-display span { margin-right: 20px; }
        #character-sprite { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); height: 95%; max-width: 800px; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 0; z-index: 10; }
        #dialogue-box { position: absolute; bottom: 20px; left: 5%; width: 90%; min-height: 200px; background-color: rgba(10, 20, 40, 0.9); border: 2px solid #6c91d9; border-radius: 15px; padding: 20px; box-sizing: border-box; z-index: 21; }
        #dialogue-text.task-text { font-size: 26px; color: #ffc107; text-align: center; }
        #character-name { font-size: 28px; font-weight: bold; color: #ffc107; margin-bottom: 15px; }
        #dialogue-text { font-size: 24px; line-height: 1.4; margin: 0; }
        .term { color: cyan; text-decoration: underline; cursor: pointer; }
        #choices-container { position: absolute; bottom: 240px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 22; }
        .choice-button { width: 70%; padding: 18px; font-size: 20px; font-weight: bold; background-color: rgba(40, 80, 150, 0.9); color: #fff; border: 2px solid #a8c1ff; border-radius: 30px; cursor: pointer; text-align: center; transition: background-color 0.2s, transform 0.2s; }
        .choice-button:hover { background-color: rgba(60, 110, 200, 1); transform: scale(1.02); }
        #visual-model-container, #glossary-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 40; color: white; font-size: 1.2em; }
        .visual-model, .glossary-box { display: flex; position: relative; width: 80%; max-width: 900px; padding: 30px; box-sizing: border-box; border: 2px solid cyan; background-color: rgba(10, 20, 30, 0.95); border-radius: 10px; justify-content: center; align-items: center; }
        .glossary-box { flex-direction: column; text-align: center; }
        .close-button { position: absolute; top: 10px; right: 20px; color: #ff4500; font-size: 3em; line-height: 1; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .close-button:hover { color: #ff7733; }
        #glossary-title { font-size: 2em; color: #ffc107; margin-bottom: 20px; padding-right: 40px; }
        #glossary-text { font-size: 1.4em; line-height: 1.5; }
        #model-trajectory canvas { width: 100%; height: 100%; }
        #model-forces img { max-width: 90%; max-height: 90%; object-fit: contain; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stats-display">
            <span title="Теория">🧠 T: <span id="stat-theory">0</span></span>
            <span title="Практика">🛠️ П: <span id="stat-practice">0</span></span>
        </div>
        <img id="character-sprite" src="" alt="Персонаж">
        <div id="glossary-container">
            <div class="glossary-box">
                <span class="close-button">&times;</span>
                <h2 id="glossary-title"></h2>
                <p id="glossary-text"></p>
            </div>
        </div>
        <div id="dialogue-box">
            <div id="character-name"></div><p id="dialogue-text"></p>
        </div>
        <div id="choices-container"></div>
    </div>

    <audio id="audio-click" src="audio/click.wav"></audio>
    <audio id="audio-correct" src="audio/correct.wav"></audio>
    <audio id="audio-wrong" src="audio/wrong.wav"></audio>
    <audio id="audio-ambient" src="audio/ambient_lab.mp3" loop></audio>
    <audio id="audio-music" src="audio/background_music.mp3" loop></audio>

    <script>
        const storyData = {
            chapter4_scene1: {
                background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/elena_worried.png', character: 'Елена',
                text: 'Снова проблемы! Вся внешняя связь пропала. На экранах только шум. Мы не можем получить данные со спутника.',
                choices: [{ text: 'В чем может быть дело?', nextSceneId: 'chapter4_scene2' }]
            },
            chapter4_scene2: {
                 background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/alex_smirk.png', character: 'Алекс',
                 text: 'Похоже на мощные помехи. Кто-то глушит наш сигнал на определённой <span class="term" data-term="frequency">частоте</span>. Нам нужно её вычислить, чтобы поставить фильтр.',
                 choices: [{ text: 'Какие у нас данные?', nextSceneId: 'chapter4_act1_quiz' }]
            },
            chapter4_act1_quiz: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: null, character: 'ЗАДАЧА: СВОЙСТВА ВОЛНЫ', isTask: true,
                text: 'Анализатор спектра показывает, что <span class="term" data-term="wavelength">длина волны</span> помехи (λ) равна __LAMBDA__ м. Какова её <span class="term" data-term="frequency">частота</span> (ν)?<br>Используйте формулу ν = c / λ, где c ≈ 300,000,000 м/с.',
                choices: 'CHOICES_CH4_ACT1'
            },
            chapter4_act1_fail: {
                background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/alex_neutral.png', character: 'Алекс',
                text: 'Неверно. Чтобы найти частоту (ν), нужно скорость света разделить на длину волны. Не перепутай!',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter4_act1_quiz'}]
            },
            chapter4_act1_success: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: 'assets/sprites/elena_happy.png', character: 'Елена',
                text: 'Точно! Частота __FREQ__ МГц. Я ставлю режекторный фильтр на эту частоту... Есть! Помехи пропали!',
                choices: [{ text: 'Отлично! Связь восстановлена?', nextSceneId: 'chapter4_act2_scene1'}]
            },
            chapter4_act2_scene1: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                text: 'Сигнал со спутника появился, но его частота (ν) "сдвинута". Мы принимаем __FREQ_OBS__ ГГц, хотя спутник должен передавать на __FREQ_SRC__ ГГц. Это <span class="term" data-term="doppler">эффект Доплера</span>!',
                choices: [{ text: 'Что это значит?', nextSceneId: 'chapter4_act2_quiz'}]
            },
            chapter4_act2_quiz: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: null, character: 'ЗАДАЧА: ЭФФЕКТ ДОПЛЕРА', isTask: true,
                text: 'Наблюдаемая частота (ν_набл) __FREQ_OBS__ ГГц выше исходной (ν_ист) __FREQ_SRC__ ГГц. Что это говорит о движении спутника?',
                choices: [
                    { text: 'Спутник приближается к нам', isCorrect: true, stat: 'theory', nextSceneId: 'chapter4_act2_success'},
                    { text: 'Спутник удаляется от нас', isCorrect: false, nextSceneId: 'chapter4_act2_fail'},
                    { text: 'Спутник неподвижен', isCorrect: false, nextSceneId: 'chapter4_act2_fail'}
                ]
            },
            chapter4_act2_fail: {
                background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'ОШИБКА',
                text: 'Не совсем. Вспомните: при приближении источника волны "сжимаются", и частота (ν) увеличивается. При удалении — "растягиваются", и частота (ν) уменьшается.',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter4_act2_quiz'}]
            },
            chapter4_act2_success: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: 'assets/sprites/alina_happy.png', character: 'Доктор Белова',
                text: 'Именно! Частота (ν) увеличилась, значит, спутник приближается. И судя по величине сдвига... он летит прямо на нас! Это нештатная ситуация!',
                choices: [{ text: 'Нужно срочно действовать!', nextSceneId: 'chapter4_act3_scene1'}]
            },
            chapter4_act3_scene1: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: 'assets/sprites/max_neutral.png', character: 'Инженер Орлов',
                text: 'Единственный способ остановить его — сфокусировать на нём мощный лазерный импульс. Нам нужно настроить <span class="term" data-term="lens">линзу</span>, чтобы получить точный фокус.',
                choices: [{ text: 'Приступаю к настройке!', nextSceneId: 'chapter4_act3_quiz'}]
            },
            chapter4_act3_quiz: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: null, character: 'ЗАДАЧА: ТОНКАЯ ЛИНЗА', isTask: true,
                text: 'Используя <span class="term" data-term="lens_formula">формулу тонкой линзы</span> 1/F = 1/d + 1/f, найдите <span class="term" data-term="focal_length">фокусное расстояние</span> F, если расстояние до объекта d = __D__ м, а расстояние до изображения (фокуса) f = __F_IMG__ м.',
                choices: 'CHOICES_CH4_ACT3'
            },
            chapter4_act3_fail: {
                background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/max_worried.png', character: 'Инженер Орлов',
                text: 'Неверно! Формула использует обратные величины. Сначала найди 1/d и 1/f, сложи их, а потом найди F = 1 / (результат сложения).',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter4_act3_quiz'}]
            },
            chapter4_act3_success: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: 'assets/sprites/max_happy.png', character: 'Инженер Орлов',
                text: 'Есть! Фокусное расстояние __F_LENS__ м. Линза откалибрована. Запускаю импульс... Попадание! Спутник остановлен!',
                choices: [{ text: 'Миссия выполнена!', nextSceneId: 'ending_ch4'}]
            },
            ending_ch4: {
                background: 'assets/backgrounds/control_room.jpg', sprite: 'assets/sprites/2.png', character: 'ИТОГ',
                text: 'Поздравляем! Вы раскрыли саботаж и освоили основы волновых процессов. Все миссии пройдены!',
                choices: [
                    { text: 'К списку миссий', href: 'missions.html', onComplete: 'mission4' }
                ]
            }
        };

        const glossary = {
            frequency: { title: "Частота (ν)", text: "Количество колебаний (или волн), проходящих через точку в пространстве за единицу времени. Измеряется в Герцах (Гц)." },
            wavelength: { title: "Длина волны (λ)", text: "Расстояние между двумя ближайшими точками, колеблющимися в одинаковой фазе. Связана с частотой и скоростью волны формулой λ = v/ν." },
            doppler: { title: "Эффект Доплера", text: "Изменение частоты и длины волны, воспринимаемое наблюдателем, вследствие движения источника волн и/или наблюдателя. Если источник приближается, частота увеличивается." },
            lens: { title: "Линза", text: "Прозрачное тело, ограниченное двумя преломляющими поверхностями. Собирающие линзы фокусируют параллельные лучи в одной точке (фокусе)." },
            lens_formula: { title: "Формула тонкой линзы", text: "Связывает фокусное расстояние линзы (F) с расстоянием от линзы до объекта (d) и расстоянием от линзы до изображения (f). Формула: 1/F = 1/d + 1/f." },
            focal_length: { title: "Фокусное расстояние (F)", text: "Расстояние от оптического центра линзы до её главного фокуса. Определяет оптическую силу линзы." }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const gameContainer = document.getElementById('game-container');
            const spriteElement = document.getElementById('character-sprite');
            const nameElement = document.getElementById('character-name');
            const textElement = document.getElementById('dialogue-text');
            const choicesContainer = document.getElementById('choices-container');
            const statTheory = document.getElementById('stat-theory');
            const statPractice = document.getElementById('stat-practice');
            const glossaryContainer = document.getElementById('glossary-container');
            const glossaryCloseButton = document.querySelector('.close-button');
            const audioClick = document.getElementById('audio-click');
            const audioCorrect = document.getElementById('audio-correct');
            const audioWrong = document.getElementById('audio-wrong');
            const audioAmbient = document.getElementById('audio-ambient');
            const audioMusic = document.getElementById('audio-music');
            let gameState = {};

            function playSound(sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play failed: ", e));
            }

            function generateProblemData() {
                const p = {};
                const c = 300000000;
                p.LAMBDA = (Math.random() * (1.5 - 1.0) + 1.0).toFixed(2);
                const f_correct = c / p.LAMBDA;
                const f_wrong1 = c * p.LAMBDA;
                const f_wrong2 = p.LAMBDA / c;
                p.FREQ = (f_correct / 1000000).toFixed(1);
                p.CHOICES_CH4_ACT1 = [
                    { text: `${p.FREQ} МГц`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter4_act1_success' },
                    { text: `${(f_wrong1 / 1000000).toFixed(1)} МГц`, isCorrect: false, nextSceneId: 'chapter4_act1_fail' },
                    { text: `${(f_wrong2 * 1000000).toFixed(1)} МГц`, isCorrect: false, nextSceneId: 'chapter4_act1_fail' }
                ].sort(() => Math.random() - 0.5);

                p.FREQ_SRC = (2.2 + Math.random() * 0.2).toFixed(2);
                p.FREQ_OBS = (parseFloat(p.FREQ_SRC) + 0.1 + Math.random() * 0.1).toFixed(2);
                
                p.D = 1000 + Math.floor(Math.random() * 501);
                p.F_IMG = 10 + Math.floor(Math.random() * 6);
                const F_correct_act3 = 1 / (1/p.D + 1/p.F_IMG);
                const F_wrong1_act3 = 1/p.D + 1/p.F_IMG;
                const F_wrong2_act3 = p.D + p.F_IMG;
                p.F_LENS = F_correct_act3.toFixed(2);
                p.CHOICES_CH4_ACT3 = [
                    { text: `${p.F_LENS} м`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter4_act3_success' },
                    { text: `${F_wrong1_act3.toFixed(2)} м`, isCorrect: false, nextSceneId: 'chapter4_act3_fail' },
                    { text: `${F_wrong2_act3} м`, isCorrect: false, nextSceneId: 'chapter4_act3_fail' }
                ].sort(() => Math.random() - 0.5);

                return p;
            }

            function initGame() {
                gameState = {
                    currentSceneId: 'chapter4_scene1',
                    stats: { theory: 0, practice: 0 },
                    problemData: generateProblemData(),
                    viewedModels: {},
                    audioStarted: false
                };
                renderScene();
            }

            function renderScene() {
                const currentScene = storyData[gameState.currentSceneId];
                gameContainer.style.backgroundImage = `url(${currentScene.background})`;
                spriteElement.style.opacity = currentScene.sprite ? '1' : '0';
                if (currentScene.sprite) spriteElement.src = currentScene.sprite;
                nameElement.textContent = currentScene.character || '';
                
                let renderedText = currentScene.text;
                for (const key in gameState.problemData) {
                    if (typeof gameState.problemData[key] !== 'object' && typeof gameState.problemData[key] !== 'function') {
                        const value = gameState.problemData[key];
                        const roundedValue = Number.isInteger(value) || value.toString().split('.')[1]?.length <= 1 ? value : parseFloat(value).toFixed(2);
                        renderedText = renderedText.replace(new RegExp(`__${key}__`, 'g'), roundedValue);
                    }
                }
                textElement.innerHTML = renderedText;
                textElement.classList.toggle('task-text', !!currentScene.isTask);

                choicesContainer.innerHTML = '';
                const choicesSource = (typeof currentScene.choices === 'string')
                    ? gameState.problemData[currentScene.choices]
                    : currentScene.choices;

                choicesSource.forEach(choice => {
                    const button = document.createElement('button');
                    button.innerHTML = choice.text;
                    button.className = 'choice-button';
                    button.onclick = () => {
                        playSound(audioClick);
                        handleChoice(choice);
                    };
                    choicesContainer.appendChild(button);
                });
                
                updateStatsDisplay();
                
                document.querySelectorAll('.term').forEach(term => {
                    term.onclick = (e) => {
                        e.stopPropagation();
                        const termKey = e.target.dataset.term;
                        showGlossary(termKey);
                    };
                });
            }
            
            function handleChoice(choice) {
                if (!gameState.audioStarted) {
                    audioAmbient.volume = 0.3;
                    audioMusic.volume = 0.5;
                    audioAmbient.play().catch(e => {});
                    audioMusic.play().catch(e => {});
                    gameState.audioStarted = true;
                }

                if (choice.href) {
                    if (choice.onComplete) {
                        localStorage.setItem(`${choice.onComplete}_status`, 'completed');
                    }
                    window.location.href = choice.href;
                    return;
                }
                
                if (choice.hasOwnProperty('isCorrect')) {
                    playSound(choice.isCorrect ? audioCorrect : audioWrong);
                }
                
                if (choice.isCorrect && choice.stat) {
                    gameState.stats[choice.stat]++;
                } else if (choice.stat && !choice.hasOwnProperty('isCorrect')) {
                    gameState.stats[choice.stat]++;
                }
                
                gameState.currentSceneId = choice.nextSceneId;
                renderScene();
            }
            
            function updateStatsDisplay() {
                statTheory.textContent = gameState.stats.theory;
                statPractice.textContent = gameState.stats.practice;
            }

            function showGlossary(termKey) {
                const termData = glossary[termKey];
                if (!termData) return;
                
                document.getElementById('glossary-title').textContent = termData.title;
                document.getElementById('glossary-text').textContent = termData.text;
                glossaryContainer.style.display = 'flex';
            }

            glossaryContainer.onclick = (e) => {
                if (e.target === glossaryContainer) {
                    glossaryContainer.style.display = 'none';
                }
            };
            glossaryCloseButton.onclick = () => {
                glossaryContainer.style.display = 'none';
            };
            
            initGame();
        });
    </script>
</body>
</html>
