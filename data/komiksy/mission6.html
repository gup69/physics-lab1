<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный Клуб: Кристальный Коллапс</title>
    
    <style>
        /* Все стили (CSS) остаются точно такими же, как в прошлых версиях. */
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #game-container { position: relative; width: 1280px; height: 720px; background-color: #000; background-size: cover; background-position: center; border-radius: 10px; overflow: hidden; transition: background-image 0.5s ease-in-out; }
        #stats-display { position: absolute; top: 20px; left: 20px; background-color: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 8px; font-size: 22px; z-index: 30; }
        #stats-display span { margin-right: 20px; }
        #character-sprite { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); height: 95%; max-width: 800px; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 0; z-index: 10; }
        #dialogue-box { position: absolute; bottom: 20px; left: 5%; width: 90%; min-height: 200px; background-color: rgba(10, 20, 40, 0.9); border: 2px solid #6c91d9; border-radius: 15px; padding: 20px; box-sizing: border-box; z-index: 21; }
        #dialogue-text.task-text { font-size: 26px; color: #ffc107; text-align: center; }
        #character-name { font-size: 28px; font-weight: bold; color: #ffc107; margin-bottom: 15px; }
        #dialogue-text { font-size: 24px; line-height: 1.4; margin: 0; }
        .term { color: cyan; text-decoration: underline; cursor: pointer; }
        #choices-container { position: absolute; bottom: 240px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 22; }
        .choice-button { width: 70%; padding: 18px; font-size: 20px; font-weight: bold; background-color: rgba(40, 80, 150, 0.9); color: #fff; border: 2px solid #a8c1ff; border-radius: 30px; cursor: pointer; text-align: center; transition: background-color 0.2s, transform 0.2s; }
        .choice-button:hover { background-color: rgba(60, 110, 200, 1); transform: scale(1.02); }
        #glossary-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 40; color: white; font-size: 1.2em; }
        .glossary-box { display: flex; position: relative; width: 80%; max-width: 900px; padding: 30px; box-sizing: border-box; border: 2px solid cyan; background-color: rgba(10, 20, 30, 0.95); border-radius: 10px; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
        .close-button { position: absolute; top: 10px; right: 20px; color: #ff4500; font-size: 3em; line-height: 1; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .close-button:hover { color: #ff7733; }
        #glossary-title { font-size: 2em; color: #ffc107; margin-bottom: 20px; padding-right: 40px; }
        #glossary-text { font-size: 1.4em; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stats-display">
            <span title="Теория">🧠 T: <span id="stat-theory">0</span></span>
            <span title="Практика">🛠️ П: <span id="stat-practice">0</span></span>
        </div>
        <img id="character-sprite" src="" alt="Персонаж">
        <div id="glossary-container">
            <div class="glossary-box">
                <span class="close-button">&times;</span>
                <h2 id="glossary-title"></h2>
                <p id="glossary-text"></p>
            </div>
        </div>
        <div id="dialogue-box">
            <div id="character-name"></div><p id="dialogue-text"></p>
        </div>
        <div id="choices-container"></div>
    </div>

    <audio id="audio-click" src="audio/click.wav"></audio>
    <audio id="audio-correct" src="audio/correct.wav"></audio>
    <audio id="audio-wrong" src="audio/wrong.wav"></audio>
    <audio id="audio-ambient" src="audio/ambient_lab.mp3" loop></audio>
    <audio id="audio-music" src="audio/background_music.mp3" loop></audio>

    <script>
        const storyData = {
            // --- АКТ 1: НАСЫЩЕННЫЙ ПАР ---
            chapter6_scene1: {
                background: 'assets/backgrounds/vacuum_chamber_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                text: 'Тревога! Микро-удар по обшивке! Система охлаждения вакуумной камеры дала сбой, температура растет!',
                choices: [{ text: 'Чем это опасно?', nextSceneId: 'chapter6_scene2' }]
            },
            chapter6_scene2: {
                 background: 'assets/backgrounds/vacuum_chamber_alarm.jpg', sprite: 'assets/sprites/alex_smirk.png', character: 'Алекс',
                 text: 'Остатки жидкого хладагента начали <span class="term" data-term="evaporation">испаряться</span>! Давление <span class="term" data-term="vapor">насыщенного пара</span> растет и давит на кристалл. Нужно срочно его рассчитать.',
                 choices: [{ text: 'Какие у нас данные?', nextSceneId: 'chapter6_act1_quiz' }]
            },
            chapter6_act1_quiz: {
                background: 'assets/backgrounds/vacuum_chamber.jpg', sprite: null, character: 'ЗАДАЧА: ДАВЛЕНИЕ ПАРА', isTask: true,
                text: 'Давление насыщенного пара зависит от температуры. Если при __T1__°C оно было __P1__ кПа, то каким оно станет при __T2__°C?',
                choices: 'CHOICES_CH6_ACT1'
            },
            chapter6_act1_fail: {
                background: 'assets/backgrounds/vacuum_chamber_alarm.jpg', sprite: 'assets/sprites/alex_neutral.png', character: 'Алекс',
                text: 'Неверно. Запомни, с ростом температуры давление насыщенного пара растет нелинейно, гораздо быстрее, чем у идеального газа!',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter6_act1_quiz'}]
            },
            chapter6_act1_success: {
                background: 'assets/backgrounds/vacuum_chamber.jpg', sprite: 'assets/sprites/alina_happy.png', character: 'Доктор Белова',
                text: 'Верно, давление подскочило до __P2__ кПа! Это уже опасно для структуры кристалла. Орлов, нам нужен жидкий стабилизатор!',
                choices: [{ text: 'Приступаем ко второму этапу.', nextSceneId: 'chapter6_act2_scene1'}]
            },

            // --- АКТ 2: ПОВЕРХНОСТНОЕ НАТЯЖЕНИЕ ---
            chapter6_act2_scene1: {
                background: 'assets/backgrounds/vacuum_chamber.jpg', sprite: 'assets/sprites/max_neutral.png', character: 'Инженер Орлов',
                text: 'Впрыскиваю каплю стабилизатора... Черт, в невесомости <span class="term" data-term="surface_tension">поверхностное натяжение</span> превратило её в идеальный шарик! Она не покрывает кристалл.',
                choices: [{ text: 'Что делать?', nextSceneId: 'chapter6_act2_quiz'}]
            },
            chapter6_act2_quiz: {
                background: 'assets/backgrounds/vacuum_chamber.jpg', sprite: null, character: 'ЗАДАЧА: ПОВЕРХНОСТНОЕ НАТЯЖЕНИЕ', isTask: true,
                text: 'Чтобы жидкость "растеклась" по поверхности, нужно уменьшить силу поверхностного натяжения. Что для этого нужно добавить?',
                choices: [
                    { text: 'Нагреватель, чтобы увеличить температуру', isCorrect: false, nextSceneId: 'chapter6_act2_fail'},
                    { text: 'Поверхностно-активное вещество (ПАВ)', isCorrect: true, stat: 'practice', nextSceneId: 'chapter6_act2_success'},
                    { text: 'Соль, чтобы увеличить плотность', isCorrect: false, nextSceneId: 'chapter6_act2_fail'}
                ]
            },
            chapter6_act2_fail: {
                background: 'assets/backgrounds/vacuum_chamber_alarm.jpg', sprite: 'assets/sprites/max_worried.png', character: 'Инженер Орлов',
                text: 'Не сработает! Единственный надежный способ ослабить силы межмолекулярного притяжения в жидкости — это добавить ПАВ.',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter6_act2_quiz'}]
            },
            chapter6_act2_success: {
                background: 'assets/backgrounds/vacuum_chamber.jpg', sprite: 'assets/sprites/max_happy.png', character: 'Инженер Орлов',
                text: 'Точно! Добавляю микродозу ПАВ... Есть! Капля растеклась по кристаллу, создавая защитную пленку!',
                choices: [{ text: 'Отлично! Теперь кристалл в безопасности?', nextSceneId: 'chapter6_act3_scene1'}]
            },

            // --- АКТ 3: ДЕФОРМАЦИЯ ТВЕРДЫХ ТЕЛ ---
            chapter6_act3_scene1: {
                background: 'assets/backgrounds/vacuum_chamber_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                text: 'Не совсем. Из-за скачка температуры в кристалле возникло <span class="term" data-term="stress">механическое напряжение</span>. Если оно превысит предел упругости, деформация станет необратимой!',
                choices: [{ text: 'Нужно срочно его рассчитать!', nextSceneId: 'chapter6_act3_quiz'}]
            },
            chapter6_act3_quiz: {
                background: 'assets/backgrounds/vacuum_chamber.jpg', sprite: null, character: 'ЗАДАЧА: ЗАКОН ГУКА', isTask: true,
                text: 'Рассчитайте <span class="term" data-term="stress">механическое напряжение</span> (σ) в кристалле по формуле σ = F/S.<br>Сила сжатия F = __F__ Н, площадь сечения S = __S__ м².',
                choices: 'CHOICES_CH6_ACT3'
            },
            chapter6_act3_fail: {
                background: 'assets/backgrounds/vacuum_chamber_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                text: 'Неверный расчет! Напряжение — это сила, деленная на площадь. Убедись, что используешь правильные единицы измерения.',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter6_act3_quiz'}]
            },
            chapter6_act3_success: {
                background: 'assets/backgrounds/vacuum_chamber.jpg', sprite: 'assets/sprites/alina_happy.png', character: 'Доктор Белова',
                text: 'Верно, напряжение __STRESS__ МПа. Это ниже предела упругости нашего кристалла. Он выдержал! Отличная работа, команда!',
                choices: [{ text: 'Миссия выполнена!', nextSceneId: 'ending_ch6'}]
            },
            ending_ch6: {
                background: 'assets/backgrounds/control_room.jpg', sprite: 'assets/sprites/2.png', character: 'ИТОГ',
                text: 'Поздравляем! Вы справились с "Кристальным Коллапсом" и освоили свойства вещества. Все миссии пройдены!',
                choices: [
                    { text: 'К списку миссий', href: 'missions.html', onComplete: 'mission6' }
                ]
            }
        };

        const glossary = {
            evaporation: { title: "Испарение", text: "Процесс фазового перехода вещества из жидкого состояния в газообразное (пар), происходящий на поверхности жидкости." },
            vapor: { title: "Насыщенный пар", text: "Пар, находящийся в термодинамическом равновесии со своей жидкостью. Его давление при данной температуре является максимально возможным." },
            surface_tension: { title: "Поверхностное натяжение (σ)", text: "Свойство жидкости, обусловленное силами межмолекулярного притяжения, которое заставляет её принимать форму с минимальной площадью поверхности (например, сферу в невесомости)." },
            stress: { title: "Механическое напряжение (σ)", text: "Мера внутренних сил, возникающих в деформируемом теле под влиянием внешних воздействий. Измеряется в Паскалях (Па). Формула: σ = F/S." },
        };

        document.addEventListener('DOMContentLoaded', () => {
            const gameContainer = document.getElementById('game-container');
            const spriteElement = document.getElementById('character-sprite');
            const nameElement = document.getElementById('character-name');
            const textElement = document.getElementById('dialogue-text');
            const choicesContainer = document.getElementById('choices-container');
            const statTheory = document.getElementById('stat-theory');
            const statPractice = document.getElementById('stat-practice');
            const glossaryContainer = document.getElementById('glossary-container');
            const glossaryCloseButton = document.querySelector('.close-button');
            const audioClick = document.getElementById('audio-click');
            const audioCorrect = document.getElementById('audio-correct');
            const audioWrong = document.getElementById('audio-wrong');
            const audioAmbient = document.getElementById('audio-ambient');
            const audioMusic = document.getElementById('audio-music');
            let gameState = {};

            function playSound(sound) {
                sound.currentTime = 0;
                sound.play().catch(e => {});
            }

            function generateProblemData() {
                const p = {};
                // Акт 1
                p.T1 = 80;
                p.P1 = 47.3;
                p.T2 = 100;
                p.P2 = 101.3; // Давление насыщенного пара воды при 100 C
                const p_wrong1 = p.P1 * (p.T2/p.T1); // Ошибка: линейная зависимость
                p.CHOICES_CH6_ACT1 = [
                    { text: `${p.P2} кПа`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter6_act1_success' },
                    { text: `${p_wrong1.toFixed(1)} кПа`, isCorrect: false, nextSceneId: 'chapter6_act1_fail' },
                    { text: `${(p.P1 * 0.8).toFixed(1)} кПа`, isCorrect: false, nextSceneId: 'chapter6_act1_fail' }
                ].sort(() => Math.random() - 0.5);
                
                // Акт 3
                p.F = 50000 + Math.floor(Math.random() * 20001); // 50-70 кН
                p.S = (0.0001 + Math.random() * 0.0001).toPrecision(1); // 1-2 см^2
                const stress_correct = (p.F / p.S) / 1000000; // в МПа
                const stress_wrong1 = (p.F * p.S) / 1000000;
                p.STRESS = stress_correct.toFixed(1);
                p.CHOICES_CH6_ACT3 = [
                    { text: `${p.STRESS} МПа`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter6_act3_success' },
                    { text: `${(stress_correct * 0.5).toFixed(1)} МПа`, isCorrect: false, nextSceneId: 'chapter6_act3_fail' },
                    { text: `${(stress_wrong1).toFixed(1)} МПа`, isCorrect: false, nextSceneId: 'chapter6_act3_fail' }
                ].sort(() => Math.random() - 0.5);

                return p;
            }

            function initGame() {
                gameState = {
                    currentSceneId: 'chapter6_scene1',
                    stats: { theory: 0, practice: 0 },
                    problemData: generateProblemData(),
                    viewedModels: {},
                    audioStarted: false
                };
                renderScene();
            }

            function renderScene() {
                const currentScene = storyData[gameState.currentSceneId];
                gameContainer.style.backgroundImage = `url(${currentScene.background})`;
                spriteElement.style.opacity = currentScene.sprite ? '1' : '0';
                if (currentScene.sprite) spriteElement.src = currentScene.sprite;
                nameElement.textContent = currentScene.character || '';
                
                let renderedText = currentScene.text;
                for (const key in gameState.problemData) {
                    if (typeof gameState.problemData[key] !== 'object' && typeof gameState.problemData[key] !== 'function') {
                        const value = gameState.problemData[key];
                        renderedText = renderedText.replace(new RegExp(`__${key}__`, 'g'), value);
                    }
                }
                textElement.innerHTML = renderedText;
                textElement.classList.toggle('task-text', !!currentScene.isTask);

                choicesContainer.innerHTML = '';
                const choicesSource = (typeof currentScene.choices === 'string')
                    ? gameState.problemData[currentScene.choices]
                    : currentScene.choices;

                choicesSource.forEach(choice => {
                    const button = document.createElement('button');
                    button.innerHTML = choice.text;
                    button.className = 'choice-button';
                    button.onclick = () => {
                        playSound(audioClick);
                        handleChoice(choice);
                    };
                    choicesContainer.appendChild(button);
                });
                
                updateStatsDisplay();
                
                document.querySelectorAll('.term').forEach(term => {
                    term.onclick = (e) => {
                        e.stopPropagation();
                        const termKey = e.target.dataset.term;
                        showGlossary(termKey);
                    };
                });
            }
            
            function handleChoice(choice) {
                if (!gameState.audioStarted) {
                    audioAmbient.volume = 0.3;
                    audioMusic.volume = 0.5;
                    audioAmbient.play().catch(e => {});
                    audioMusic.play().catch(e => {});
                    gameState.audioStarted = true;
                }

                if (choice.href) {
                    if (choice.onComplete) {
                        localStorage.setItem(`${choice.onComplete}_status`, 'completed');
                    }
                    window.location.href = choice.href;
                    return;
                }
                
                if (choice.hasOwnProperty('isCorrect')) {
                    playSound(choice.isCorrect ? audioCorrect : audioWrong);
                }
                
                if (choice.isCorrect && choice.stat) {
                    gameState.stats[choice.stat]++;
                } else if (choice.stat && !choice.hasOwnProperty('isCorrect')) {
                    gameState.stats[choice.stat]++;
                }
                
                gameState.currentSceneId = choice.nextSceneId;
                renderScene();
            }
            
            function updateStatsDisplay() {
                statTheory.textContent = gameState.stats.theory;
                statPractice.textContent = gameState.stats.practice;
            }

            function showGlossary(termKey) {
                const termData = glossary[termKey];
                if (!termData) return;
                
                document.getElementById('glossary-title').textContent = termData.title;
                document.getElementById('glossary-text').textContent = termData.text;
                glossaryContainer.style.display = 'flex';
            }

            glossaryContainer.onclick = (e) => {
                if (e.target === glossaryContainer) {
                    glossaryContainer.style.display = 'none';
                }
            };
            glossaryCloseButton.onclick = () => {
                glossaryContainer.style.display = 'none';
            };
            
            initGame();
        });
    </script>
</body>
</html>
