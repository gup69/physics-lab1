<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный Клуб: Прозрачная Угроза</title>
    
    <style>
        /* Все стили (CSS) остаются точно такими же, как в прошлых версиях. */
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #game-container { position: relative; width: 1280px; height: 720px; background-color: #000; background-size: cover; background-position: center; border-radius: 10px; overflow: hidden; transition: background-image 0.5s ease-in-out; }
        #stats-display { position: absolute; top: 20px; left: 20px; background-color: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 8px; font-size: 22px; z-index: 30; }
        #stats-display span { margin-right: 20px; }
        #character-sprite { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); height: 95%; max-width: 800px; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 0; z-index: 10; }
        #dialogue-box { position: absolute; bottom: 20px; left: 5%; width: 90%; min-height: 200px; background-color: rgba(10, 20, 40, 0.9); border: 2px solid #6c91d9; border-radius: 15px; padding: 20px; box-sizing: border-box; z-index: 21; }
        #dialogue-text.task-text { font-size: 26px; color: #ffc107; text-align: center; }
        #character-name { font-size: 28px; font-weight: bold; color: #ffc107; margin-bottom: 15px; }
        #dialogue-text { font-size: 24px; line-height: 1.4; margin: 0; }
        .term { color: cyan; text-decoration: underline; cursor: pointer; }
        #choices-container { position: absolute; bottom: 240px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 22; }
        .choice-button { width: 70%; padding: 18px; font-size: 20px; font-weight: bold; background-color: rgba(40, 80, 150, 0.9); color: #fff; border: 2px solid #a8c1ff; border-radius: 30px; cursor: pointer; text-align: center; transition: background-color 0.2s, transform 0.2s; }
        .choice-button:hover { background-color: rgba(60, 110, 200, 1); transform: scale(1.02); }
        #glossary-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 40; color: white; font-size: 1.2em; }
        .glossary-box { display: flex; position: relative; width: 80%; max-width: 900px; padding: 30px; box-sizing: border-box; border: 2px solid cyan; background-color: rgba(10, 20, 30, 0.95); border-radius: 10px; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
        .close-button { position: absolute; top: 10px; right: 20px; color: #ff4500; font-size: 3em; line-height: 1; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .close-button:hover { color: #ff7733; }
        #glossary-title { font-size: 2em; color: #ffc107; margin-bottom: 20px; padding-right: 40px; }
        #glossary-text { font-size: 1.4em; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stats-display">
            <span title="Теория">🧠 T: <span id="stat-theory">0</span></span>
            <span title="Практика">🛠️ П: <span id="stat-practice">0</span></span>
        </div>
        <img id="character-sprite" src="" alt="Персонаж">
        <div id="glossary-container">
            <div class="glossary-box">
                <span class="close-button">&times;</span>
                <h2 id="glossary-title"></h2>
                <p id="glossary-text"></p>
            </div>
        </div>
        <div id="dialogue-box">
            <div id="character-name"></div><p id="dialogue-text"></p>
        </div>
        <div id="choices-container"></div>
    </div>

    <audio id="audio-click" src="audio/click.wav"></audio>
    <audio id="audio-correct" src="audio/correct.wav"></audio>
    <audio id="audio-wrong" src="audio/wrong.wav"></audio>
    <audio id="audio-ambient" src="audio/ambient_lab.mp3" loop></audio>
    <audio id="audio-music" src="audio/background_music.mp3" loop></audio>

    <script>
        const storyData = {
            // --- АКТ 1: ОТРАЖЕНИЕ СВЕТА ---
            chapter10_scene1: {
                background: 'assets/backgrounds/optics_lab_alarm.jpg', sprite: 'assets/sprites/max_worried.png', character: 'Инженер Орлов',
                text: 'Тревога! Прототип маскировочного дрона вышел из строя! Он невидим, и мы отслеживаем его только по отражению лазерного луча от его зеркальной обшивки.',
                choices: [{ text: 'Нужно предсказать его траекторию!', nextSceneId: 'chapter10_scene2' }]
            },
            chapter10_scene2: {
                 background: 'assets/backgrounds/optics_lab_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                 text: 'Луч падает на дрон под одним углом, а <span class="term" data-term="reflection">отражается</span> под другим. Нам нужно знать, куда он полетит после следующего отражения.',
                 choices: [{ text: 'Приступаю к анализу.', nextSceneId: 'chapter10_act1_quiz' }]
            },
            chapter10_act1_quiz: {
                background: 'assets/backgrounds/optics_lab.jpg', sprite: null, character: 'ЗАДАЧА: ЗАКОН ОТРАЖЕНИЯ', isTask: true,
                text: 'Согласно <span class="term" data-term="reflection_law">закону отражения</span>, чему равен <span class="term" data-term="reflection_angle">угол отражения (β)</span>, если <span class="term" data-term="incidence_angle">угол падения (α)</span> лазерного луча составляет __ALPHA__ градусов?',
                choices: 'CHOICES_CH10_ACT1'
            },
            chapter10_act1_fail: {
                background: 'assets/backgrounds/optics_lab_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'ОШИБКА',
                text: 'Это один из самых фундаментальных законов оптики! Угол падения всегда равен углу отражения. Попробуй еще раз!',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter10_act1_quiz'}]
            },
            chapter10_act1_success: {
                background: 'assets/backgrounds/optics_lab.jpg', sprite: 'assets/sprites/alina_happy.png', character: 'Доктор Белова',
                text: 'Именно! Угол отражения тоже __ALPHA__ градусов. Мы знаем, где он будет! Но дрон скрылся за аквариумом с охлаждающей жидкостью!',
                choices: [{ text: 'Переходим к следующему этапу.', nextSceneId: 'chapter10_act2_scene1'}]
            },

            // --- АКТ 2: ПРЕЛОМЛЕНИЕ СВЕТА ---
            chapter10_act2_scene1: {
                background: 'assets/backgrounds/optics_lab_alarm.jpg', sprite: 'assets/sprites/max_neutral.png', character: 'Инженер Орлов',
                text: 'Мы видим дрон сквозь жидкость, но из-за <span class="term" data-term="refraction">преломления света</span> его реальное положение искажено. Чтобы попасть в него лазером, нужно рассчитать точный угол.',
                choices: [{ text: 'Какие у нас данные?', nextSceneId: 'chapter10_act2_quiz'}]
            },
            chapter10_act2_quiz: {
                background: 'assets/backgrounds/optics_lab.jpg', sprite: null, character: 'ЗАДАЧА: ЗАКОН СНЕЛЛИУСА', isTask: true,
                text: 'Рассчитайте <span class="term" data-term="refraction_angle">угол преломления (γ)</span> луча в жидкости.<br>n₁sin(α) = n₂sin(γ). n₁ (воздух)≈1, n₂ (жидкость)=__N2__, угол падения α=__ALPHA2__°.',
                choices: 'CHOICES_CH10_ACT2'
            },
            chapter10_act2_fail: {
                background: 'assets/backgrounds/optics_lab_alarm.jpg', sprite: 'assets/sprites/max_worried.png', character: 'Инженер Орлов',
                text: 'Неверно! Вырази sin(γ) = (n₁/n₂) * sin(α), найди его значение, а потом возьми арксинус. Калькулятор в помощь!',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter10_act2_quiz'}]
            },
            chapter10_act2_success: {
                background: 'assets/backgrounds/optics_lab.jpg', sprite: 'assets/sprites/max_happy.png', character: 'Инженер Орлов',
                text: 'Точно! Угол преломления __GAMMA__ градусов. Перенаправляю лазер... Попадание! Маскировочное поле отключено!',
                choices: [{ text: 'Отлично! Теперь нужно его захватить.', nextSceneId: 'chapter10_act3_scene1'}]
            },

            // --- АКТ 3: СОБИРАЮЩАЯ ЛИНЗА ---
            chapter10_act3_scene1: {
                background: 'assets/backgrounds/optics_lab.jpg', sprite: 'assets/sprites/elena_neutral.png', character: 'Елена',
                text: 'Дрон виден, но он очень маленький. Чтобы манипулятор мог его схватить, нам нужно получить четкое, увеличенное изображение с помощью камеры.',
                choices: [{ text: 'Нужно настроить фокус!', nextSceneId: 'chapter10_act3_quiz'}]
            },
            chapter10_act3_quiz: {
                background: 'assets/backgrounds/optics_lab.jpg', sprite: null, character: 'ЗАДАЧА: ФОРМУЛА ЛИНЗЫ', isTask: true,
                text: 'На каком расстоянии от <span class="term" data-term="lens">линзы</span> (f) нужно разместить матрицу, чтобы получить четкое изображение?<br>1/F = 1/d + 1/f. F = __F__ м, d = __D__ м.',
                choices: 'CHOICES_CH10_ACT3'
            },
            chapter10_act3_fail: {
                background: 'assets/backgrounds/optics_lab_alarm.jpg', sprite: 'assets/sprites/elena_worried.png', character: 'Елена',
                text: 'Неправильно. Сначала найди 1/f = 1/F - 1/d. Затем найди f = 1 / (результат вычитания).',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter10_act3_quiz'}]
            },
            chapter10_act3_success: {
                background: 'assets/backgrounds/optics_lab.jpg', sprite: 'assets/sprites/elena_happy.png', character: 'Елена',
                text: 'Именно так! Расстояние до изображения __F_IMG__ м. Настраиваю фокус... Изображение четкое! Захват произведен!',
                choices: [{ text: 'Миссия выполнена!', nextSceneId: 'ending_ch10'}]
            },
            ending_ch10: {
                background: 'assets/backgrounds/control_room.jpg', sprite: 'assets/sprites/2.png', character: 'ИТОГ',
                text: 'Поздравляем! Вы справились с "Прозрачной Угрозой" и освоили законы лучевой оптики. Все миссии пройдены!',
                choices: [
                    { text: 'К списку миссий', href: 'missions.html', onComplete: 'mission10' }
                ]
            }
        };

        const glossary = {
            reflection: { title: "Отражение света", text: "Явление, при котором свет, падающий на границу раздела двух сред, возвращается в первую среду." },
            reflection_law: { title: "Закон отражения", text: "Падающий луч, отраженный луч и перпендикуляр к границе раздела, восстановленный в точке падения, лежат в одной плоскости, причем угол падения равен углу отражения (α = β)." },
            incidence_angle: { title: "Угол падения (α)", text: "Угол между падающим лучом и перпендикуляром к отражающей поверхности в точке падения." },
            reflection_angle: { title: "Угол отражения (β)", text: "Угол между отраженным лучом и перпендикуляром к отражающей поверхности в точке падения." },
            refraction: { title: "Преломление света", text: "Изменение направления распространения света при его прохождении через границу раздела двух сред. Происходит из-за разной скорости света в этих средах." },
            refraction_angle: { title: "Угол преломления (γ)", text: "Угол между преломленным лучом и перпендикуляром к границе раздела в точке падения." },
            lens: { title: "Линза", text: "Прозрачное тело, ограниченное двумя преломляющими поверхностями. Собирающие линзы фокусируют параллельные лучи в одной точке (фокусе)." },
            lens_formula: { title: "Формула тонкой линзы", text: "Связывает фокусное расстояние линзы (F) с расстоянием от линзы до объекта (d) и расстоянием от линзы до изображения (f). Формула: 1/F = 1/d + 1/f." }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const gameContainer = document.getElementById('game-container');
            const spriteElement = document.getElementById('character-sprite');
            const nameElement = document.getElementById('character-name');
            const textElement = document.getElementById('dialogue-text');
            const choicesContainer = document.getElementById('choices-container');
            const statTheory = document.getElementById('stat-theory');
            const statPractice = document.getElementById('stat-practice');
            const glossaryContainer = document.getElementById('glossary-container');
            const glossaryCloseButton = document.querySelector('.close-button');
            const audioClick = document.getElementById('audio-click');
            const audioCorrect = document.getElementById('audio-correct');
            const audioWrong = document.getElementById('audio-wrong');
            const audioAmbient = document.getElementById('audio-ambient');
            const audioMusic = document.getElementById('audio-music');
            let gameState = {};

            function playSound(sound) {
                sound.currentTime = 0;
                sound.play().catch(e => {});
            }

            function generateProblemData() {
                const p = {};
                // Акт 1
                p.ALPHA = 30 + Math.floor(Math.random() * 31); // 30-60 градусов
                const alpha_wrong = 90 - p.ALPHA;
                p.CHOICES_CH10_ACT1 = [
                    { text: `${p.ALPHA}°`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter10_act1_success' },
                    { text: `${alpha_wrong}°`, isCorrect: false, nextSceneId: 'chapter10_act1_fail' },
                    { text: `${p.ALPHA * 2}°`, isCorrect: false, nextSceneId: 'chapter10_act1_fail' }
                ].sort(() => Math.random() - 0.5);

                // Акт 2
                p.ALPHA2 = 40 + Math.floor(Math.random() * 21); // 40-60
                p.N2 = (1.3 + Math.random() * 0.4).toFixed(2); // 1.30-1.69
                const gamma_correct_rad = Math.asin(Math.sin(p.ALPHA2 * Math.PI / 180) / p.N2);
                const gamma_correct_deg = gamma_correct_rad * 180 / Math.PI;
                p.GAMMA = Math.round(gamma_correct_deg);
                const gamma_wrong1_deg = p.ALPHA2 / p.N2;
                const gamma_wrong2_deg = Math.asin(p.N2 * Math.sin(p.ALPHA2 * Math.PI / 180)) * 180 / Math.PI;
                p.CHOICES_CH10_ACT2 = [
                    { text: `${p.GAMMA}°`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter10_act2_success' },
                    { text: `${Math.round(gamma_wrong1_deg)}°`, isCorrect: false, nextSceneId: 'chapter10_act2_fail' },
                    { text: `${Math.round(gamma_wrong2_deg) || p.GAMMA + 10}°`, isCorrect: false, nextSceneId: 'chapter10_act2_fail' }
                ].sort(() => Math.random() - 0.5);

                // Акт 3
                p.F = (1.5 + Math.random()).toFixed(2); // 1.5-2.5 м
                p.D = 3 + Math.floor(Math.random() * 5); // 3-7 м
                const f_img_correct = 1 / (1/p.F - 1/p.D);
                p.F_IMG = f_img_correct.toFixed(2);
                const f_img_wrong1 = p.F - p.D;
                const f_img_wrong2 = 1/p.F - 1/p.D;
                 p.CHOICES_CH10_ACT3 = [
                    { text: `${p.F_IMG} м`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter10_act3_success' },
                    { text: `${f_img_wrong1.toFixed(2)} м`, isCorrect: false, nextSceneId: 'chapter10_act3_fail' },
                    { text: `${f_img_wrong2.toFixed(2)} м`, isCorrect: false, nextSceneId: 'chapter10_act3_fail' }
                ].sort(() => Math.random() - 0.5);

                return p;
            }

            function initGame() {
                gameState = {
                    currentSceneId: 'chapter10_scene1',
                    stats: { theory: 0, practice: 0 },
                    problemData: generateProblemData(),
                    viewedModels: {},
                    audioStarted: false
                };
                renderScene();
            }

            function renderScene() {
                const currentScene = storyData[gameState.currentSceneId];
                gameContainer.style.backgroundImage = `url(${currentScene.background})`;
                spriteElement.style.opacity = currentScene.sprite ? '1' : '0';
                if (currentScene.sprite) spriteElement.src = currentScene.sprite;
                nameElement.textContent = currentScene.character || '';
                
                let renderedText = currentScene.text;
                for (const key in gameState.problemData) {
                    if (typeof gameState.problemData[key] !== 'object' && typeof gameState.problemData[key] !== 'function') {
                        renderedText = renderedText.replace(new RegExp(`__${key}__`, 'g'), gameState.problemData[key]);
                    }
                }
                textElement.innerHTML = renderedText;
                textElement.classList.toggle('task-text', !!currentScene.isTask);

                choicesContainer.innerHTML = '';
                const choicesSource = (typeof currentScene.choices === 'string')
                    ? gameState.problemData[currentScene.choices]
                    : currentScene.choices;

                choicesSource.forEach(choice => {
                    let choiceText = choice.text;
                    for (const key in gameState.problemData) {
                        if (typeof gameState.problemData[key] !== 'object') {
                             choiceText = choiceText.replace(new RegExp(`__${key}__`, 'g'), gameState.problemData[key]);
                        }
                    }
                    const button = document.createElement('button');
                    button.innerHTML = choiceText;
                    button.className = 'choice-button';
                    button.onclick = () => {
                        playSound(audioClick);
                        handleChoice(choice);
                    };
                    choicesContainer.appendChild(button);
                });
                
                updateStatsDisplay();
                
                document.querySelectorAll('.term').forEach(term => {
                    term.onclick = (e) => {
                        e.stopPropagation();
                        const termKey = e.target.dataset.term;
                        showGlossary(termKey);
                    };
                });
            }
            
            function handleChoice(choice) {
                if (!gameState.audioStarted) {
                    audioAmbient.volume = 0.3;
                    audioMusic.volume = 0.5;
                    audioAmbient.play().catch(e => {});
                    audioMusic.play().catch(e => {});
                    gameState.audioStarted = true;
                }

                if (choice.href) {
                    if (choice.onComplete) {
                        localStorage.setItem(`${choice.onComplete}_status`, 'completed');
                    }
                    window.location.href = choice.href;
                    return;
                }
                
                if (choice.hasOwnProperty('isCorrect')) {
                    playSound(choice.isCorrect ? audioCorrect : audioWrong);
                }
                
                if (choice.isCorrect && choice.stat) {
                    gameState.stats[choice.stat]++;
                } else if (choice.stat && !choice.hasOwnProperty('isCorrect')) {
                    gameState.stats[choice.stat]++;
                }
                
                gameState.currentSceneId = choice.nextSceneId;
                renderScene();
            }
            
            function updateStatsDisplay() {
                statTheory.textContent = gameState.stats.theory;
                statPractice.textContent = gameState.stats.practice;
            }

            function showGlossary(termKey) {
                const termData = glossary[termKey];
                if (!termData) return;
                
                document.getElementById('glossary-title').textContent = termData.title;
                document.getElementById('glossary-text').textContent = termData.text;
                glossaryContainer.style.display = 'flex';
            }

            glossaryContainer.onclick = (e) => {
                if (e.target === glossaryContainer) {
                    glossaryContainer.style.display = 'none';
                }
            };
            glossaryCloseButton.onclick = () => {
                glossaryContainer.style.display = 'none';
            };
            
            initGame();
        });
    </script>
</body>
</html>
