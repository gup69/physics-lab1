<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный Клуб: Угроза Перегрева</title>
    
    <style>
        /* Все стили (CSS) остаются точно такими же, как в прошлой версии. */
        /* Вы можете просто скопировать их из предыдущего файла. */
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #game-container { position: relative; width: 1280px; height: 720px; background-color: #000; background-size: cover; background-position: center; border-radius: 10px; overflow: hidden; transition: background-image 0.5s ease-in-out; }
        #stats-display { position: absolute; top: 20px; left: 20px; background-color: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 8px; font-size: 22px; z-index: 30; }
        #stats-display span { margin-right: 20px; }
        #character-sprite { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); height: 95%; max-width: 800px; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 0; z-index: 10; }
        #dialogue-box { position: absolute; bottom: 20px; left: 5%; width: 90%; min-height: 200px; background-color: rgba(10, 20, 40, 0.9); border: 2px solid #6c91d9; border-radius: 15px; padding: 20px; box-sizing: border-box; z-index: 21; }
        #dialogue-text.task-text { font-size: 26px; color: #ffc107; text-align: center; }
        #character-name { font-size: 28px; font-weight: bold; color: #ffc107; margin-bottom: 15px; }
        #dialogue-text { font-size: 24px; line-height: 1.4; margin: 0; }
        .term { color: cyan; text-decoration: underline; cursor: pointer; }
        #choices-container { position: absolute; bottom: 240px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 22; }
        .choice-button { width: 70%; padding: 18px; font-size: 20px; font-weight: bold; background-color: rgba(40, 80, 150, 0.9); color: #fff; border: 2px solid #a8c1ff; border-radius: 30px; cursor: pointer; text-align: center; transition: background-color 0.2s, transform 0.2s; }
        .choice-button:hover { background-color: rgba(60, 110, 200, 1); transform: scale(1.02); }
        #visual-model-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 20; }
        #glossary-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 40; color: white; font-size: 1.2em; }
        .visual-model, .glossary-box { display: flex; position: relative; width: 80%; max-width: 900px; padding: 30px; box-sizing: border-box; border: 2px solid cyan; background-color: rgba(10, 20, 30, 0.95); border-radius: 10px; justify-content: center; align-items: center; }
        .glossary-box { flex-direction: column; text-align: center; }
        .close-button { position: absolute; top: 10px; right: 20px; color: #ff4500; font-size: 3em; line-height: 1; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .close-button:hover { color: #ff7733; }
        #glossary-title { font-size: 2em; color: #ffc107; margin-bottom: 20px; padding-right: 40px; }
        #glossary-text { font-size: 1.4em; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stats-display">
            <span title="Теория">🧠 T: <span id="stat-theory">0</span></span>
            <span title="Практика">🛠️ П: <span id="stat-practice">0</span></span>
        </div>
        <img id="character-sprite" src="" alt="Персонаж">
        <div id="glossary-container">
            <div class="glossary-box">
                <span class="close-button">&times;</span>
                <h2 id="glossary-title"></h2>
                <p id="glossary-text"></p>
            </div>
        </div>
        <div id="dialogue-box">
            <div id="character-name"></div><p id="dialogue-text"></p>
        </div>
        <div id="choices-container"></div>
    </div>

    <audio id="audio-click" src="audio/click.wav"></audio>
    <audio id="audio-correct" src="audio/correct.wav"></audio>
    <audio id="audio-wrong" src="audio/wrong.wav"></audio>
    <audio id="audio-ambient" src="audio/ambient_lab.mp3" loop></audio>
    <audio id="audio-music" src="audio/background_music.mp3" loop></audio>

    <script>
        const storyData = {
            // --- АКТ 1: ИДЕАЛЬНЫЙ ГАЗ ---
            chapter2_scene1: {
                background: 'assets/backgrounds/reactor_hall.jpg', sprite: 'assets/sprites/alex_smirk.png', character: 'Алекс',
                text: 'Слышал, ты тут дрон ловил. Неплохо для новичка. Но сейчас дело серьезнее. В главном реакторе скачет давление.',
                choices: [{ text: 'Что случилось?', nextSceneId: 'chapter2_scene2' }]
            },
            chapter2_scene2: {
                 background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                 text: 'Алекс, не время для разговоров! Давление в контуре охлаждения выросло до __P__ Паскалей! Если мы не поймем причину, произойдет разгерметизация!',
                 choices: [{ text: 'Что будем делать?', nextSceneId: 'chapter2_act1_choice' }]
            },
            chapter2_act1_choice: {
                background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: null, character: 'МЕТОД:',
                text: 'Нужно срочно выяснить температуру. Как поступим?',
                choices: [
                    { text: '🧠 Использовать уравнение состояния идеального газа.', nextSceneId: 'chapter2_act1_quiz' },
                    { text: '🛠️ (Алекс) Расчеты долгие! Давайте просто стравим часть газа, давление упадет!', nextSceneId: 'chapter2_act1_bad_choice' }
                ]
            },
            chapter2_act1_bad_choice: {
                background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                text: 'Ни в коем случае! Мы изменим количество вещества в системе и не сможем провести точные расчеты. Действуем по протоколу!',
                choices: [{ text: 'Вы правы. Приступаю к расчетам.', stat: 'practice', nextSceneId: 'chapter2_act1_quiz' }]
            },
            chapter2_act1_quiz: {
                background: 'assets/backgrounds/reactor_hall.jpg', sprite: null, character: 'ЗАДАЧА: ИДЕАЛЬНЫЙ ГАЗ', isTask: true,
                text: 'Рассчитайте <span class="term" data-term="temperature">температуру</span> газа (T), используя <span class="term" data-term="idealgas">уравнение Менделеева-Клапейрона</span>: PV = νRT.<br>P = __P__ Па, V = __V__ м³, ν = __NU__ моль, R ≈ 8.31 Дж/(моль·К)',
                choices: 'CHOICES_CH2_ACT1'
            },
            chapter2_act1_fail: {
                background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'ОШИБКА',
                text: 'Неверно! Чтобы найти температуру, нужно выразить ее из формулы: T = PV / (νR). Проверьте свои вычисления.',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter2_act1_quiz'}]
            },
            chapter2_act1_success: {
                background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: 'assets/sprites/alina_happy.png', character: 'Доктор Белова',
                text: 'Верно! Температура __T__ Кельвинов... Это на 15% выше критической! Нам нужно срочно охладить систему, пока не поздно!',
                choices: [{ text: 'Переходим ко второму этапу.', nextSceneId: 'chapter2_act2_scene1'}]
            },

            // --- АКТ 2: ПЕРВЫЙ ЗАКОН ТЕРМОДИНАМИКИ ---
            chapter2_act2_scene1: {
                background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: 'assets/sprites/max_neutral.png', character: 'Инженер Орлов',
                text: 'Чтобы снизить температуру, нам нужно уменьшить <span class="term" data-term="internal_energy">внутреннюю энергию</span> газа на __DELTA_U__ Джоулей. Система охлаждения может либо отвести тепло, либо мы можем заставить газ совершить работу.',
                choices: [{ text: 'Как лучше поступить?', nextSceneId: 'chapter2_act2_choice'}]
            },
            chapter2_act2_choice: {
                background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: null, character: 'ЗАДАЧА: I ЗАКОН ТЕРМОДИНАМИКИ', isTask: true,
                text: 'Согласно <span class="term" data-term="first_law">первому закону термодинамики</span> (Q = ΔU + A), какое количество теплоты (Q) нужно отвести от системы при изохорном охлаждении (работа A = 0), чтобы уменьшить внутреннюю энергию на __DELTA_U__ Дж?',
                choices: 'CHOICES_CH2_ACT2'
            },
            chapter2_act2_fail: {
                background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'ОШИБКА',
                text: 'Не совсем. Внутренняя энергия УМЕНЬШАЕТСЯ, значит ΔU отрицательно. А количество теплоты Q мы ОТВОДИМ, то есть система его теряет, значит Q тоже отрицательно. Подумайте о знаках!',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter2_act2_choice'}]
            },
            chapter2_act2_success: {
                background: 'assets/backgrounds/reactor_hall.jpg', sprite: 'assets/sprites/max_happy.png', character: 'Инженер Орлов',
                text: 'Именно! Запускаю теплообменники на отвод __DELTA_U__ Джоулей тепла. Давление и температура стабилизировались!',
                choices: [{ text: 'Отлично! Проблема решена?', nextSceneId: 'chapter2_act3_scene1'}]
            },

            // --- АКТ 3: КПД ---
            chapter2_act3_scene1: {
                background: 'assets/backgrounds/reactor_hall.jpg', sprite: 'assets/sprites/alex_smirk.png', character: 'Алекс',
                text: 'Вы просто залатали дыру. Основная система охлаждения неисправна, мы работаем на вспомогательной. Её реальный КПД всего __ETA_REAL__%. Этого может не хватить.',
                choices: [{ text: 'Нужно проверить ее эффективность.', nextSceneId: 'chapter2_act3_quiz'}]
            },
            chapter2_act3_quiz: {
                background: 'assets/backgrounds/reactor_hall.jpg', sprite: null, character: 'ЗАДАЧA: КПД', isTask: true,
                text: 'Рассчитайте идеальный <span class="term" data-term="efficiency">КПД (η)</span> по циклу Карно, если температура нагревателя (реактора) __T_H__ K, а холодильника (атмосферы) __T_C__ K.<br>η = (Tн - Tх) / Tн',
                choices: 'CHOICES_CH2_ACT3'
            },
            chapter2_act3_fail: {
                background: 'assets/backgrounds/reactor_hall_alarm.jpg', sprite: 'assets/sprites/alex_neutral.png', character: 'Алекс',
                text: 'Неправильно. Убедись, что используешь температуры в Кельвинах и не перепутал нагреватель с холодильником в формуле. Попробуй еще раз.',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter2_act3_quiz'}]
            },
            chapter2_act3_success: {
                background: 'assets/backgrounds/reactor_hall.jpg', sprite: 'assets/sprites/alina_happy.png', character: 'Доктор Белова',
                text: 'Точно! Идеальный КПД - __ETA_IDEAL__%. Наша система работает близко к пределу. Этого достаточно, чтобы дождаться ремонта. Отличная работа, команда!',
                choices: [{ text: 'Завершить миссию', nextSceneId: 'ending_ch2'}]
            },
            ending_ch2: {
                background: 'assets/backgrounds/control_room.jpg', sprite: 'assets/sprites/2.png', character: 'ИТОГ',
                text: 'Поздравляем! Вы справились с угрозой перегрева и освоили основы термодинамики. Миссия завершена!',
                choices: [
                    { text: 'К списку миссий', href: 'missions.html', onComplete: 'mission2' } // <-- Добавлена новая опция onComplete
                ]
            }
        };

        const glossary = {
            temperature: { title: "Температура (T)", text: "Мера средней кинетической энергии частиц вещества. В термодинамике измеряется в Кельвинах (К). 0°C = 273.15 K." },
            idealgas: { title: "Уравнение Менделеева-Клапейрона", text: "Связывает давление (P), объем (V) и абсолютную температуру (T) идеального газа с количеством вещества (ν) и универсальной газовой постоянной (R). Формула: PV = νRT." },
            internal_energy: { title: "Внутренняя энергия (U)", text: "Сумма кинетической энергии хаотического движения всех частиц системы и потенциальной энергии их взаимодействия. Для идеального газа зависит только от температуры." },
            first_law: { title: "Первый закон термодинамики", text: "Количество теплоты (Q), переданное системе, идет на изменение ее внутренней энергии (ΔU) и на совершение системой работы (A) против внешних сил. Формула: Q = ΔU + A." },
            efficiency: { title: "КПД (η)", text: "Коэффициент полезного действия. Показывает, какая доля энергии от нагревателя превращается в полезную работу. Идеальный (максимально возможный) КПД для тепловой машины описывается циклом Карно." }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const gameContainer = document.getElementById('game-container');
            const spriteElement = document.getElementById('character-sprite');
            const nameElement = document.getElementById('character-name');
            const textElement = document.getElementById('dialogue-text');
            const choicesContainer = document.getElementById('choices-container');
            const statTheory = document.getElementById('stat-theory');
            const statPractice = document.getElementById('stat-practice');
            const glossaryContainer = document.getElementById('glossary-container');
            const glossaryCloseButton = document.querySelector('.close-button');
            const audioClick = document.getElementById('audio-click');
            const audioCorrect = document.getElementById('audio-correct');
            const audioWrong = document.getElementById('audio-wrong');
            const audioAmbient = document.getElementById('audio-ambient');
            const audioMusic = document.getElementById('audio-music');
            let gameState = {};

            function playSound(sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play failed: ", e));
            }

            function generateProblemData() {
                const p = {};
                // Акт 1 (Термодинамика)
                p.P = 200000 + Math.floor(Math.random() * 50000); // 200-250 кПа
                p.V = 10 + Math.floor(Math.random() * 5); // 10-14 м³
                p.NU = 80 + Math.floor(Math.random() * 41); // 80-120 моль
                const R = 8.31;
                const T_correct = (p.P * p.V) / (p.NU * R);
                const T_wrong1 = (p.P * p.V) / p.NU; // Забыли R
                const T_wrong2 = T_correct - 273.15; // Перепутали с Цельсием
                p.T = Math.round(T_correct);
                p.CHOICES_CH2_ACT1 = [
                    { text: `${Math.round(T_correct)} K`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter2_act1_success' },
                    { text: `${Math.round(T_wrong1)} K`, isCorrect: false, nextSceneId: 'chapter2_act1_fail' },
                    { text: `${Math.round(T_wrong2)} K`, isCorrect: false, nextSceneId: 'chapter2_act1_fail' }
                ].sort(() => Math.random() - 0.5);

                // Акт 2 (Термодинамика)
                p.DELTA_U = 50000 + Math.floor(Math.random() * 20000); // 50-70 кДж
                p.CHOICES_CH2_ACT2 = [
                    { text: `Q = -${p.DELTA_U} Дж`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter2_act2_success' },
                    { text: `Q = ${p.DELTA_U} Дж`, isCorrect: false, nextSceneId: 'chapter2_act2_fail' },
                    { text: `Q = 0 Дж`, isCorrect: false, nextSceneId: 'chapter2_act2_fail' }
                ].sort(() => Math.random() - 0.5);
                
                // Акт 3 (Термодинамика)
                p.T_C = 290 + Math.floor(Math.random() * 11); // 290-300 K (окруж. среда)
                p.T_H = p.T + Math.floor(Math.random() * 50); // Температура реактора чуть выше
                const eta_ideal = (p.T_H - p.T_C) / p.T_H;
                const eta_wrong1 = (p.T_H - p.T_C) / p.T_C; // Неправильный знаменатель
                const eta_wrong2 = 1 - (p.T_C / p.T_H) * 100; // Ошибка с процентами
                p.ETA_IDEAL = Math.round(eta_ideal * 100);
                p.ETA_REAL = p.ETA_IDEAL - (5 + Math.floor(Math.random() * 6)); // 5-10% ниже идеала
                p.CHOICES_CH2_ACT3 = [
                    { text: `${Math.round(eta_ideal * 100)} %`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter2_act3_success' },
                    { text: `${Math.round(eta_wrong1 * 100)} %`, isCorrect: false, nextSceneId: 'chapter2_act3_fail' },
                    { text: `${Math.round(eta_wrong2)} %`, isCorrect: false, nextSceneId: 'chapter2_act3_fail' }
                ].sort(() => Math.random() - 0.5);
                return p;
            }

            function initGame() {
                gameState = {
                    currentSceneId: 'chapter2_scene1', // Начинаем со второй главы
                    stats: { theory: 0, practice: 0 },
                    problemData: generateProblemData(),
                    viewedModels: {},
                    audioStarted: false
                };
                renderScene();
            }

            function renderScene() {
                const currentScene = storyData[gameState.currentSceneId];
                gameContainer.style.backgroundImage = `url(${currentScene.background})`;
                spriteElement.style.opacity = currentScene.sprite ? '1' : '0';
                if (currentScene.sprite) spriteElement.src = currentScene.sprite;
                nameElement.textContent = currentScene.character || '';
                
                let renderedText = currentScene.text;
                for (const key in gameState.problemData) {
                    if (typeof gameState.problemData[key] !== 'object' && typeof gameState.problemData[key] !== 'function') {
                        const value = gameState.problemData[key];
                        const roundedValue = Number.isInteger(value) ? value : value.toFixed(1);
                        renderedText = renderedText.replace(new RegExp(`__${key}__`, 'g'), roundedValue);
                    }
                }
                textElement.innerHTML = renderedText;
                textElement.classList.toggle('task-text', !!currentScene.isTask);

                choicesContainer.innerHTML = '';
                const choicesSource = (typeof currentScene.choices === 'string')
                    ? gameState.problemData[currentScene.choices]
                    : currentScene.choices;

                choicesSource.forEach(choice => {
                    const button = document.createElement('button');
                    button.innerHTML = choice.text;
                    button.className = 'choice-button';
                    button.onclick = () => {
                        playSound(audioClick);
                        handleChoice(choice);
                    };
                    choicesContainer.appendChild(button);
                });
                
                updateStatsDisplay();
                
                document.querySelectorAll('.term').forEach(term => {
                    term.onclick = (e) => {
                        e.stopPropagation();
                        const termKey = e.target.dataset.term;
                        showGlossary(termKey);
                    };
                });
            }
            
            function handleChoice(choice) {
                if (!gameState.audioStarted) {
                    audioAmbient.volume = 0.3;
                    audioMusic.volume = 0.5;
                    audioAmbient.play().catch(e => {});
                    audioMusic.play().catch(e => {});
                    gameState.audioStarted = true;
                }

                if (choice.href) {
                    if (choice.onComplete) {
                        localStorage.setItem(`${choice.onComplete}_status`, 'completed');
                    }
                    window.location.href = choice.href;
                    return;
                }
                
                if (choice.hasOwnProperty('isCorrect')) {
                    playSound(choice.isCorrect ? audioCorrect : audioWrong);
                }
                
                if (choice.isCorrect && choice.stat) {
                    gameState.stats[choice.stat]++;
                } else if (choice.stat && !choice.hasOwnProperty('isCorrect')) {
                    gameState.stats[choice.stat]++;
                }
                
                gameState.currentSceneId = choice.nextSceneId;
                renderScene();
            }
            
            function updateStatsDisplay() {
                statTheory.textContent = gameState.stats.theory;
                statPractice.textContent = gameState.stats.practice;
            }

            function showGlossary(termKey) {
                const termData = glossary[termKey];
                if (!termData) return;
                
                document.getElementById('glossary-title').textContent = termData.title;
                document.getElementById('glossary-text').textContent = termData.text;
                glossaryContainer.style.display = 'flex';
            }

            glossaryContainer.onclick = (e) => {
                if (e.target === glossaryContainer) {
                    glossaryContainer.style.display = 'none';
                }
            };
            glossaryCloseButton.onclick = () => {
                glossaryContainer.style.display = 'none';
            };
            
            initGame();
        });
    </script>
</body>
</html>
