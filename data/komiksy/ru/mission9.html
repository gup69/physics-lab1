<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный Клуб: Резонансный Коллапс</title>
    
    <style>
        /* Все стили (CSS) остаются точно такими же, как в прошлых версиях. */
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #game-container { position: relative; width: 1280px; height: 720px; background-color: #000; background-size: cover; background-position: center; border-radius: 10px; overflow: hidden; transition: background-image 0.5s ease-in-out; }
        #stats-display { position: absolute; top: 20px; left: 20px; background-color: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 8px; font-size: 22px; z-index: 30; }
        #stats-display span { margin-right: 20px; }
        #character-sprite { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); height: 95%; max-width: 800px; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 0; z-index: 10; }
        #dialogue-box { position: absolute; bottom: 20px; left: 5%; width: 90%; min-height: 200px; background-color: rgba(10, 20, 40, 0.9); border: 2px solid #6c91d9; border-radius: 15px; padding: 20px; box-sizing: border-box; z-index: 21; }
        #dialogue-text.task-text { font-size: 26px; color: #ffc107; text-align: center; }
        #character-name { font-size: 28px; font-weight: bold; color: #ffc107; margin-bottom: 15px; }
        #dialogue-text { font-size: 24px; line-height: 1.4; margin: 0; }
        .term { color: cyan; text-decoration: underline; cursor: pointer; }
        #choices-container { position: absolute; bottom: 240px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 22; }
        .choice-button { width: 70%; padding: 18px; font-size: 20px; font-weight: bold; background-color: rgba(40, 80, 150, 0.9); color: #fff; border: 2px solid #a8c1ff; border-radius: 30px; cursor: pointer; text-align: center; transition: background-color 0.2s, transform 0.2s; }
        .choice-button:hover { background-color: rgba(60, 110, 200, 1); transform: scale(1.02); }
        #glossary-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 40; color: white; font-size: 1.2em; }
        .glossary-box { display: flex; position: relative; width: 80%; max-width: 900px; padding: 30px; box-sizing: border-box; border: 2px solid cyan; background-color: rgba(10, 20, 30, 0.95); border-radius: 10px; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
        .close-button { position: absolute; top: 10px; right: 20px; color: #ff4500; font-size: 3em; line-height: 1; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .close-button:hover { color: #ff7733; }
        #glossary-title { font-size: 2em; color: #ffc107; margin-bottom: 20px; padding-right: 40px; }
        #glossary-text { font-size: 1.4em; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stats-display">
            <span title="Теория">🧠 T: <span id="stat-theory">0</span></span>
            <span title="Практика">🛠️ П: <span id="stat-practice">0</span></span>
        </div>
        <img id="character-sprite" src="" alt="Персонаж">
        <div id="glossary-container">
            <div class="glossary-box">
                <span class="close-button">&times;</span>
                <h2 id="glossary-title"></h2>
                <p id="glossary-text"></p>
            </div>
        </div>
        <div id="dialogue-box">
            <div id="character-name"></div><p id="dialogue-text"></p>
        </div>
        <div id="choices-container"></div>
    </div>

    <audio id="audio-click" src="audio/click.wav"></audio>
    <audio id="audio-correct" src="audio/correct.wav"></audio>
    <audio id="audio-wrong" src="audio/wrong.wav"></audio>
    <audio id="audio-ambient" src="audio/ambient_lab.mp3" loop></audio>
    <audio id="audio-music" src="audio/background_music.mp3" loop></audio>

    <script>
        const storyData = {
            chapter9_scene1: {
                background: 'assets/backgrounds/antenna_array_alarm.jpg', sprite: 'assets/sprites/max_worried.png', character: 'Инженер Орлов',
                text: 'Тревога! Конструкция главной антенны вибрирует! Амплитуда растет, это похоже на <span class="term" data-term="resonance">механический резонанс</span>!',
                choices: [{ text: 'Что его вызвало?', nextSceneId: 'chapter9_scene2' }]
            },
            chapter9_scene2: {
                 background: 'assets/backgrounds/antenna_array_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                 text: 'Сначала нужно определить собственную <span class="term" data-term="frequency">частоту</span> колебаний антенны. Она ведет себя как маятник длиной __L__ м.',
                 choices: [{ text: 'Приступаю к расчетам.', nextSceneId: 'chapter9_act1_quiz' }]
            },
            chapter9_act1_quiz: {
                background: 'assets/backgrounds/antenna_array.jpg', sprite: null, character: 'ЗАДАЧА: ПЕРИОД МАЯТНИКА', isTask: true,
                text: 'Рассчитайте <span class="term" data-term="period">период</span> (T) колебаний антенны-маятника длиной L = __L__ м.<br>T = 2π &sqrt;(L/g), где g ≈ 9.8 м/с², π ≈ 3.14',
                choices: 'CHOICES_CH9_ACT1'
            },
            chapter9_act1_fail: {
                background: 'assets/backgrounds/antenna_array_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'ОШИБКА',
                text: 'Неверный расчет. Убедись, что сначала разделил L на g, потом извлек корень, и только затем умножил на 2π.',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter9_act1_quiz'}]
            },
            chapter9_act1_success: {
                background: 'assets/backgrounds/antenna_array.jpg', sprite: 'assets/sprites/alina_happy.png', character: 'Доктор Белова',
                text: 'Верно, период __T__ с. А значит, собственная частота ν = 1/T составляет __NU_MECH__ Гц. Запомните это значение!',
                choices: [{ text: 'Есть! Но есть и другая проблема...', nextSceneId: 'chapter9_act2_scene1'}]
            },
            chapter9_act2_scene1: {
                background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/elena_worried.png', character: 'Елена',
                text: 'В приемном контуре антенны тоже хаос! Напряжение скачет до критических значений. Похоже на резонанс в <span class="term" data-term="lc_circuit">колебательном контуре</span>!',
                choices: [{ text: 'Нужно найти его собственную частоту!', nextSceneId: 'chapter9_act2_quiz'}]
            },
            chapter9_act2_quiz: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: null, character: 'ЗАДАЧА: ФОРМУЛА ТОМСОНА', isTask: true,
                text: 'Рассчитайте собственную <span class="term" data-term="frequency">частоту</span> (ν) контура.<br>ν = 1 / (2π &sqrt;(LC)). L = __L_COIL__ Гн, C = __C_CAP__ Ф.',
                choices: 'CHOICES_CH9_ACT2'
            },
            chapter9_act2_fail: {
                background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/elena_worried.png', character: 'Елена',
                text: 'Ошибка в расчетах. Перемножь L и C, извлеки корень, умножь на 2π и только потом найди обратную величину (1 разделить на результат).',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter9_act2_quiz'}]
            },
            chapter9_act2_success: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: 'assets/sprites/elena_happy.png', character: 'Елена',
                text: 'Так и есть! Частота контура — __NU_ELEC__ Гц. Поразительно, это почти та же частота, что и у механических колебаний!',
                choices: [{ text: 'Это не совпадение...', nextSceneId: 'chapter9_act3_scene1'}]
            },
            chapter9_act3_scene1: {
                background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'Доктор Белова',
                text: 'Это <span class="term" data-term="resonance">резонанс</span>. Внешняя вынуждающая сила совпала с собственными частотами обеих систем. Я нашла источник — незарегистрированная радиоволна.',
                choices: [{ text: 'Нужно проверить ее параметры!', nextSceneId: 'chapter9_act3_quiz'}]
            },
            chapter9_act3_quiz: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: null, character: 'ЗАДАЧА: УРАВНЕНИЕ ВОЛНЫ', isTask: true,
                text: 'Рассчитайте <span class="term" data-term="frequency">частоту</span> (ν) радиоволны, если её <span class="term" data-term="wavelength">длина</span> (λ) равна __LAMBDA__ км.<br>ν = c / λ, где c ≈ 300 000 км/с.',
                choices: 'CHOICES_CH9_ACT3'
            },
            chapter9_act3_fail: {
                background: 'assets/backgrounds/comms_room_alarm.jpg', sprite: 'assets/sprites/alina_worried.png', character: 'ОШИБКА',
                text: 'Простой расчет, не ошибись! Скорость света делим на длину волны.',
                choices: [{ text: 'Вернуться к задаче', nextSceneId: 'chapter9_act3_quiz'}]
            },
            chapter9_act3_success: {
                background: 'assets/backgrounds/comms_room.jpg', sprite: 'assets/sprites/alina_happy.png', character: 'Доктор Белова',
                text: 'Вот оно! Частота волны __NU_WAVE__ Гц. Она совпадает с частотами антенны и контура! Это и есть причина резонанса! Мы можем его подавить.',
                choices: [{ text: 'Миссия выполнена!', nextSceneId: 'ending_ch9'}]
            },
            ending_ch9: {
                background: 'assets/backgrounds/control_room.jpg', sprite: 'assets/sprites/2.png', character: 'ИТОГ',
                text: 'Поздравляем! Вы подавили "Резонансный Коллапс" и освоили основы колебаний и волн. Все миссии пройдены!',
                choices: [
                    { text: 'К списку миссий', href: 'missions.html', onComplete: 'mission9' }
                ]
            }
        };

        const glossary = {
            resonance: { title: "Резонанс", text: "Явление резкого возрастания амплитуды вынужденных колебаний, которое происходит при совпадении внешней (вынуждающей) частоты с собственной (внутренней) частотой колебательной системы." },
            period: { title: "Период колебаний (T)", text: "Время одного полного колебания. Измеряется в секундах (с)." },
            frequency: { title: "Частота колебаний (ν)", text: "Число полных колебаний за единицу времени. Измеряется в Герцах (Гц). Связана с периодом формулой ν = 1/T." },
            lc_circuit: { title: "Колебательный контур", text: "Электрическая цепь, состоящая из катушки индуктивности (L) и конденсатора (C). В такой цепи могут возникать свободные электромагнитные колебания." },
            wavelength: { title: "Длина волны (λ)", text: "Расстояние, на которое распространяется волна за время, равное одному периоду колебаний. Измеряется в метрах (м)." }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const gameContainer = document.getElementById('game-container');
            const spriteElement = document.getElementById('character-sprite');
            const nameElement = document.getElementById('character-name');
            const textElement = document.getElementById('dialogue-text');
            const choicesContainer = document.getElementById('choices-container');
            const statTheory = document.getElementById('stat-theory');
            const statPractice = document.getElementById('stat-practice');
            const glossaryContainer = document.getElementById('glossary-container');
            const glossaryCloseButton = document.querySelector('.close-button');
            const audioClick = document.getElementById('audio-click');
            const audioCorrect = document.getElementById('audio-correct');
            const audioWrong = document.getElementById('audio-wrong');
            const audioAmbient = document.getElementById('audio-ambient');
            const audioMusic = document.getElementById('audio-music');
            let gameState = {};

            function playSound(sound) {
                sound.currentTime = 0;
                sound.play().catch(e => {});
            }

            function generateProblemData() {
                const p = {};
                // Акт 1
                p.L = 20 + Math.floor(Math.random() * 11);
                const g = 9.8;
                const T_correct = 2 * Math.PI * Math.sqrt(p.L / g);
                p.T = T_correct.toFixed(1);
                p.NU_MECH = (1 / T_correct).toFixed(2);
                const T_wrong1 = 2 * Math.PI * (p.L / g);
                const T_wrong2 = Math.sqrt(p.L / g);
                p.CHOICES_CH9_ACT1 = [
                    { text: `${p.T} с`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter9_act1_success' },
                    { text: `${T_wrong1.toFixed(1)} с`, isCorrect: false, nextSceneId: 'chapter9_act1_fail' },
                    { text: `${T_wrong2.toFixed(1)} с`, isCorrect: false, nextSceneId: 'chapter9_act1_fail' }
                ].sort(() => Math.random() - 0.5);

                // Акт 2
                p.L_COIL = (2 + Math.random() * 2) * 1e-3;
                p.C_CAP = (5 + Math.random() * 5) * 1e-6;
                const nu_elec_correct = 1 / (2 * Math.PI * Math.sqrt(p.L_COIL * p.C_CAP));
                p.NU_ELEC = nu_elec_correct.toFixed(2);
                const nu_elec_wrong1 = 1 / (Math.sqrt(p.L_COIL * p.C_CAP));
                const nu_elec_wrong2 = 2 * Math.PI * Math.sqrt(p.L_COIL * p.C_CAP);
                p.CHOICES_CH9_ACT2 = [
                    { text: `${p.NU_ELEC} Гц`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter9_act2_success' },
                    { text: `${nu_elec_wrong1.toFixed(2)} Гц`, isCorrect: false, nextSceneId: 'chapter9_act2_fail' },
                    { text: `${nu_elec_wrong2.toFixed(2)} Гц`, isCorrect: false, nextSceneId: 'chapter9_act2_fail' }
                ].sort(() => Math.random() - 0.5);

                // Акт 3
                const c_km = 300000;
                p.LAMBDA = 1000 + Math.floor(Math.random() * 1001);
                const nu_wave_correct = c_km / p.LAMBDA;
                p.NU_WAVE = nu_wave_correct.toFixed(2);
                const nu_wave_wrong = p.LAMBDA / c_km;
                p.CHOICES_CH9_ACT3 = [
                    { text: `${p.NU_WAVE} Гц`, isCorrect: true, stat: 'theory', nextSceneId: 'chapter9_act3_success' },
                    { text: `${nu_wave_wrong.toFixed(2)} Гц`, isCorrect: false, nextSceneId: 'chapter9_act3_fail' },
                    { text: `${(nu_wave_correct*2).toFixed(2)} Гц`, isCorrect: false, nextSceneId: 'chapter9_act3_fail' }
                ].sort(() => Math.random() - 0.5);

                return p;
            }

            function initGame() {
                gameState = {
                    currentSceneId: 'chapter9_scene1',
                    stats: { theory: 0, practice: 0 },
                    problemData: generateProblemData(),
                    viewedModels: {},
                    audioStarted: false
                };
                renderScene();
            }

            function renderScene() {
                const currentScene = storyData[gameState.currentSceneId];
                gameContainer.style.backgroundImage = `url(${currentScene.background})`;
                spriteElement.style.opacity = currentScene.sprite ? '1' : '0';
                if (currentScene.sprite) spriteElement.src = currentScene.sprite;
                nameElement.textContent = currentScene.character || '';
                
                let renderedText = currentScene.text;
                for (const key in gameState.problemData) {
                    if (typeof gameState.problemData[key] !== 'object' && typeof gameState.problemData[key] !== 'function') {
                        renderedText = renderedText.replace(new RegExp(`__${key}__`, 'g'), gameState.problemData[key]);
                    }
                }
                textElement.innerHTML = renderedText;
                textElement.classList.toggle('task-text', !!currentScene.isTask);

                choicesContainer.innerHTML = '';
                const choicesSource = (typeof currentScene.choices === 'string')
                    ? gameState.problemData[currentScene.choices]
                    : currentScene.choices;

                choicesSource.forEach(choice => {
                    const button = document.createElement('button');
                    button.innerHTML = choice.text;
                    button.className = 'choice-button';
                    button.onclick = () => {
                        playSound(audioClick);
                        handleChoice(choice);
                    };
                    choicesContainer.appendChild(button);
                });
                
                updateStatsDisplay();
                
                document.querySelectorAll('.term').forEach(term => {
                    term.onclick = (e) => {
                        e.stopPropagation();
                        const termKey = e.target.dataset.term;
                        showGlossary(termKey);
                    };
                });
            }
            
            function handleChoice(choice) {
                if (!gameState.audioStarted) {
                    audioAmbient.volume = 0.3;
                    audioMusic.volume = 0.5;
                    audioAmbient.play().catch(e => {});
                    audioMusic.play().catch(e => {});
                    gameState.audioStarted = true;
                }

                if (choice.href) {
                    if (choice.onComplete) {
                        localStorage.setItem(`${choice.onComplete}_status`, 'completed');
                    }
                    window.location.href = choice.href;
                    return;
                }
                
                if (choice.hasOwnProperty('isCorrect')) {
                    playSound(choice.isCorrect ? audioCorrect : audioWrong);
                }
                
                if (choice.isCorrect && choice.stat) {
                    gameState.stats[choice.stat]++;
                } else if (choice.stat && !choice.hasOwnProperty('isCorrect')) {
                    gameState.stats[choice.stat]++;
                }
                
                gameState.currentSceneId = choice.nextSceneId;
                renderScene();
            }
            
            function updateStatsDisplay() {
                statTheory.textContent = gameState.stats.theory;
                statPractice.textContent = gameState.stats.practice;
            }

            function showGlossary(termKey) {
                const termData = glossary[termKey];
                if (!termData) return;
                
                document.getElementById('glossary-title').textContent = termData.title;
                document.getElementById('glossary-text').textContent = termData.text;
                glossaryContainer.style.display = 'flex';
            }

            glossaryContainer.onclick = (e) => {
                if (e.target === glossaryContainer) {
                    glossaryContainer.style.display = 'none';
                }
            };
            glossaryCloseButton.onclick = () => {
                glossaryContainer.style.display = 'none';
            };
            
            initGame();
        });
    </script>
</body>
</html>
