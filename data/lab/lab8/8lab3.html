            ammeter.style.left = `${pointEl.offsetLeft - ammeter.offsetWidth / 2 + pointEl.offsetWidth / 2}px`;

            // Определяем X-координаты для подключения щупов

            voltmeterReading.textContent = state.isCircuitClosed ? reading.toFixed(2) : "0.00";
            
            // ---ИСПРАВЛЕНО--- Корректно позиционируем щупы, чтобы они были видны
            const voltmeterBottomY = voltmeter.offsetTop + voltmeter.offsetHeight;
            const probeHeight = wireTopY - voltmeterBottomY;

            // Щуп 1 (левый)
            probe1.style.left = `${probeLeftX - 1}px`;
            probe1.style.top = `${voltmeterBottomY}px`;
            probe1.style.height = `${probeHeight}px`;

            probe2.style.left = `${probeRightX - 1}px`;
            probe2.style.top = `${voltmeterBottomY}px`;

    checkButton.addEventListener('click', function() {
        if (state.attemptsLeft <= 0) return;
        let allFieldsValid = true;
        const inputsToCheck = document.querySelectorAll('.student-info input, tbody input, #conclusion_select_i, #conclusion_select_v');
        inputsToCheck.forEach(input => { if (input.value.trim() === '') { input.classList.add('incorrect-input'); allFieldsValid = false; } else { input.classList.remove('incorrect-input'); } });
        if (!allFieldsValid) { validationMessageDiv.textContent = translations[currentLang].validation_message; validationMessageDiv.style.display = 'block'; return; }
        validationMessageDiv.style.display = 'none';

        state.attemptsLeft--;
        let score = 0;
        const totalPoints = 8;
        const tolerance = 0.1; // Допустимая погрешность 0.1 (например, 0.5А при ожидаемом 0.45А)

        const provideFeedback = (el, isCorrect) => {
            const feedbackEl = el.nextElementSibling;
            el.className = isCorrect ? 'correct-input' : 'incorrect-input';
            if (feedbackEl && feedbackEl.classList.contains('result-feedback')) {
                feedbackEl.textContent = isCorrect ? translations[currentLang].feedback_correct : translations[currentLang].feedback_incorrect;
                feedbackEl.className = 'result-feedback ' + (isCorrect ? 'correct' : 'incorrect');
            }
        };

        const checkValue = (id, correctValue) => {
            const input = document.getElementById(id);
            const userValue = parseFloat(input.value.replace(',', '.'));
            // Проверяем, что userValue - это число и оно близко к correctValue
            const isCorrect = !isNaN(userValue) && Math.abs(userValue - correctValue) <= tolerance;
            if (isCorrect) score++;
            provideFeedback(input, isCorrect);
        };
        checkValue('i1_input', CORRECT_VALUES.I); checkValue('i2_input', CORRECT_VALUES.I); checkValue('i3_input', CORRECT_VALUES.I);
        checkValue('u1_input', CORRECT_VALUES.U1); checkValue('u2_input', CORRECT_VALUES.U2); checkValue('u12_input', CORRECT_VALUES.U_total);
        
        const conclusion_i = document.getElementById('conclusion_select_i');
        const isConclusionICorrect = conclusion_i.value === 'eq';

    async function generatePdfBlob() {
        if (answersReviewDiv.style.display === 'none') {
            // Если ответы еще не показаны, отобразим их, но не будем скрывать showAnswersButton
            // Это нужно для корректного захвата всей информации в PDF
            const currentShowAnswersDisplay = showAnswersButton.style.display;
            showAnswersButton.click(); 
            showAnswersButton.style.display = currentShowAnswersDisplay; // Восстановим состояние кнопки
        }

        const { jsPDF } = window.jspdf;
        const mainContainer = document.querySelector('.container');
        
        // Скрыть кнопки и навигацию перед захватом
        const buttonsToHide = document.querySelectorAll('.action-buttons, .top-nav');
        buttonsToHide.forEach(el => el.style.visibility = 'hidden');

        const canvas = await html2canvas(mainContainer, { scale: 1.5, useCORS: true, windowWidth: 900 });
        
        // Восстановить видимость кнопок и навигации
        buttonsToHide.forEach(el => el.style.visibility = 'visible');

        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        const imgHeight = canvas.height * pdfWidth / canvas.width;
        let heightLeft = imgHeight, position = 0;

        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
        heightLeft -= pdfHeight;

        while (heightLeft > 0) {
            position -= pdfHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeight);
            heightLeft -= pdfHeight;
        }
        return pdf.output('blob');
    }

        // Функция для очистки имени файла от недопустимых символов
        function sanitizeFilename(name) {
            if (!name) return "";
            return name.replace(/[\/\\?%*:|"<>]/g, '_').replace(/\s+/g, '_');
        }

        try {
            const pdfBlob = await generatePdfBlob();
            
            if (!pdfBlob || pdfBlob.size === 0) {
                throw new Error("PDF generation failed or resulted in an empty file.");

                lastname: document.getElementById('student_lastname').value || 'student',

            };

            const safeClass = sanitizeFilename(student.class);
            const safeLastname = sanitizeFilename(student.lastname);
            const safeFirstname = sanitizeFilename(student.firstname);
            
            const fileName = `Lab_Report_3_${safeClass}_${safeLastname}_${safeFirstname}.pdf`;

            const formData = new FormData();

            formData.append('document', pdfBlob, fileName);
            formData.append('caption', caption);

            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            if (result.ok) {
                this.textContent = translations[currentLang].send_success; // Вернуть исходный текст кнопки
                this.style.backgroundColor = '#27ae60'; // Зеленый цвет при успехе
            } else {
                console.error('Telegram API Error Response:', result);
                let errorMessage = result.description || 'Unknown error';
                if (response.status === 400) {
                        errorMessage += ` (Bad Request). Это часто означает неверный CHAT_ID (${CHAT_ID}) или то, что вы не начали диалог с ботом.`;
                } else if (response.status === 401) {
                        errorMessage += ` (Unauthorized). Проверьте правильность BOT_TOKEN (${BOT_TOKEN}).`;
                }
                throw new Error(errorMessage);
            }
        } catch (error) {
            console.error('Full Error:', error);
            this.textContent = translations[currentLang].send_error; // Вернуть исходный текст кнопки
            this.style.backgroundColor = '#e74c3c'; // Красный цвет при ошибке
            this.disabled = false; // Активировать кнопку снова
            alert(`${translations[currentLang].send_error}: ${error.message}\n${translations[currentLang].error_details}`);
        }
    });

    function resetState() {
        // Случайные значения для напряжения источника (9-12В) и сопротивлений лампочек
        const U_total_source = parseFloat((Math.random() * 3 + 9).toFixed(2)); 
        const R1 = parseFloat((Math.random() * 2 + 4).toFixed(2)); // Сопротивление лампы 1 (4-6 Ом)
        const R2 = parseFloat((Math.random() * 2 + 2).toFixed(2)); // Сопротивление лампы 2 (2-4 Ом)

        const I = U_total_source / (R1 + R2);
        CORRECT_VALUES = { 
            I: I, 
            U1: I * R1, 
            U2: I * R2, 
            U_total: U_total_source // Напряжение на всем участке цепи равно напряжению источника
        };

        state = { isCircuitClosed: false, ammeterPosition: 'OFF', voltmeterPosition: 'OFF', attemptsLeft: 2, finalScoreText: '' };
        
        document.querySelectorAll('input, select').forEach(el => { el.value = ''; el.disabled = false; el.classList.remove('correct-input', 'incorrect-input'); });
        document.querySelectorAll('.student-info input').forEach(el => { el.value = ''; el.disabled = false; });
        document.querySelectorAll('.controls button').forEach(el => el.disabled = false); // Разблокируем все кнопки управления
        document.querySelectorAll('.result-feedback').forEach(el => el.textContent = '');

        checkButton.style.display = 'inline-block'; 
        showAnswersButton.style.display = 'none'; 
        shareToTeacherButton.style.display = 'none';
        finalResultDiv.innerHTML = ''; 
        answersReviewDiv.style.display = 'none'; 
        validationMessageDiv.style.display = 'none';
        
        document.querySelectorAll('button[data-point], button[data-vpoint]').forEach(b => b.classList.remove('active'));
        
        // Убедимся, что выключатель и метры в исходном состоянии
        switchVisualEl.classList.add('open');
        switchBtn.dataset.key = 'switch_btn_close';
        ammeter.style.visibility = 'hidden';
        voltmeter.style.visibility = 'hidden';
        probe1.style.visibility = 'hidden';
        probe2.style.visibility = 'hidden';

        setLanguage(currentLang); // Применяем текущий язык после сброса
        updateSimulation(); // Обновляем симуляцию после сброса и установки языка
    }
    
    resetState(); // Инициализация при загрузке страницы
});
</script>
</body>
</html>
