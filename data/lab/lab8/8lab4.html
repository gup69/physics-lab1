        }

        const I_total = state.U_source / R_total_circuit; // Общий ток в цепи
        const U_measured_rheo = I_total * R_rheo; // Напряжение на реостате

        dom.ammeterReading.textContent = I_total.toFixed(2);
        dom.voltmeterReading.textContent = U_measured_rheo.toFixed(2);
        
        // Перемещение ползунка реостата
        // 0px - левый край, 110px - правый край (ширина реостата 120px - ширина контакта 10px)
        dom.rheostatContact.style.left = `${(sliderValue / 100) * 110}px`;
    }
    
    function createTableRows(numRows) {
        dom.resultsTbody.innerHTML = '';
        for (let i = 1; i <= numRows; i++) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${i}</td>
                <td><input type="number" class="voltage-input" step="0.01"></td>
                <td><input type="number" class="current-input" step="0.01"></td>
                <td><div class="input-container"><input type="number" class="resistance-input" step="0.1"></div></td>
                <td class="feedback-cell"></td>
            `;
            dom.resultsTbody.appendChild(row);
        }
    }

    function resetState() {
        state.attemptsLeft = 2;
        state.finalScoreText = '';
        
        createTableRows(4);
        updateSimulation();

        dom.finalResultDiv.innerHTML = '';
        dom.answersReviewDiv.style.display = 'none';
        dom.checkButton.style.display = 'inline-block';
        dom.showAnswersButton.style.display = 'none';
        dom.shareToTeacherButton.style.display = 'none';
        dom.validationMessage.style.display = 'none';
        
        document.querySelectorAll('input, select').forEach(el => {
            if(!el.classList.contains('lang-btn') && el.id !== 'backButton') {
                el.disabled = false;
                if (el.tagName === 'INPUT' && el.type !== 'range') {
                    el.value = '';
                    el.classList.remove('correct-input', 'incorrect-input');
                }
                if(el.tagName === 'SELECT') {
                    el.value = '';
                    el.classList.remove('correct-input', 'incorrect-input');
                }
            }
        });
        updateCheckButtonText();
    }
    
    dom.checkButton.addEventListener('click', () => {
        if (state.attemptsLeft <= 0) return;

        let allFieldsValid = true;
        document.querySelectorAll('.student-info input').forEach(input => {
            if (input.value.trim() === '') allFieldsValid = false;
        });
        document.querySelectorAll('#results-tbody input').forEach(input => {
            if(input.value.trim() === '') allFieldsValid = false;
        });
        if (dom.conclusionSelect.value === '') allFieldsValid = false;

        if (!allFieldsValid) {
            dom.validationMessage.textContent = translations[currentLang].validation_message;
            dom.validationMessage.style.display = 'block';
            return;
        }
        dom.validationMessage.style.display = 'none';

        state.attemptsLeft--;
        let score = 0;
        const totalPoints = 5; // 4 rows + 1 conclusion
        const tolerance = 0.5; // Допустимая погрешность для сопротивления

        const tableRows = dom.resultsTbody.querySelectorAll('tr');
        tableRows.forEach(row => {
            const uInput = row.querySelector('.voltage-input');
            const iInput = row.querySelector('.current-input');
            const rInput = row.querySelector('.resistance-input');
            const feedbackCell = row.querySelector('.feedback-cell');

            const u = parseFloat(uInput.value.replace(',', '.'));
            const i = parseFloat(iInput.value.replace(',', '.'));
            const r = parseFloat(rInput.value.replace(',', '.'));

            [uInput, iInput, rInput].forEach(inp => {
                inp.classList.remove('correct-input', 'incorrect-input');
            });

            if (isNaN(u) || isNaN(i) || isNaN(r) || i === 0) {
                rInput.classList.add('incorrect-input');
                feedbackCell.innerHTML = `<span class="incorrect">${translations[currentLang].feedback_incorrect}</span>`;
                return;
            };

            const calculated_r = u / i;
            const isCorrect = Math.abs(r - calculated_r) < tolerance;

            rInput.classList.toggle('correct-input', isCorrect);
            rInput.classList.toggle('incorrect-input', !isCorrect);
            feedbackCell.innerHTML = `<span class="${isCorrect ? 'correct' : 'incorrect'}">${translations[currentLang][isCorrect ? 'feedback_correct' : 'feedback_incorrect']}</span>`;
            
            if (isCorrect) score++;
        });
        
        const isConclusionCorrect = dom.conclusionSelect.value === 'direct';
        dom.conclusionSelect.classList.toggle('correct-input', isConclusionCorrect);
        dom.conclusionSelect.classList.toggle('incorrect-input', !isConclusionCorrect);
        if(isConclusionCorrect) score++;

        const finalScore = Math.round((score / totalPoints) * 10);
        state.finalScoreText = `${finalScore} ${translations[currentLang].out_of_10}`;
        
        updateCheckButtonText();

        if (state.attemptsLeft === 0 || finalScore === 10) {
            dom.finalResultDiv.innerHTML = `<h3>${translations[currentLang].final_result_title} <span class="${finalScore >= 5 ? 'correct' : 'incorrect'}">${state.finalScoreText}</span></h3>`;
            dom.checkButton.style.display = 'none';
            dom.showAnswersButton.style.display = 'inline-block';
            
            document.querySelectorAll('input, select').forEach(el => {
                if(!el.classList.contains('lang-btn') && el.id !== 'backButton' && el.id !== 'showAnswersButton' && el.id !== 'shareToTeacherButton') {
                    el.disabled = true;
                }
            });
            dom.rheostatSlider.disabled = true; // Отключаем ползунок реостата после финальной проверки
        }
    });

    function populateAnswersReview() {
        const trans = translations[currentLang];
        const student = {
            lastname: document.getElementById('student_lastname').value || '...',
            firstname: document.getElementById('student_firstname').value || '...',
            classNum: document.getElementById('student_class_number').value || '...',
            classLetter: document.getElementById('student_class_letter').value || '...',
        };
        
        let reviewHTML = `<h4>${trans.answers_review_title}</h4>
            <p><b>${trans.report_student}</b> ${student.lastname} ${student.firstname}</p>
            <p><b>${trans.report_class}</b> ${student.classNum}${student.classLetter}</p>
            <p><b>${trans.report_score}</b> <span class="${parseFloat(state.finalScoreText) >= 5 ? 'correct' : 'incorrect'}">${state.finalScoreText}</span></p><hr>`;
        
        // Берем значения из первой строки для примера
        const row = dom.resultsTbody.querySelector('tr');
        const u = parseFloat(row.querySelector('.voltage-input').value.replace(',', '.')) || 'U';
        const i = parseFloat(row.querySelector('.current-input').value.replace(',', '.')) || 'I';
        let calc_r = (u !== 'U' && i !== 'I' && i !== 0) ? (u / i).toFixed(1) : 'R';

        reviewHTML += `<p><b>${trans.example_calculation}:</b> R = U / I. Если вы записали U = ${u} В и I = ${i} А, то правильный расчет R = ${calc_r} Ом.</p>`;
        reviewHTML += `<p><b>${trans.conclusion}:</b> ${trans.correct_answer} — <i>${trans.conclusion_option_direct}</i>.</p>`;

        dom.answersReviewDiv.innerHTML = reviewHTML;
        dom.answersReviewDiv.style.display = 'block';
    }

    dom.showAnswersButton.addEventListener('click', function() {
        populateAnswersReview();
        this.style.display = 'none';
        dom.shareToTeacherButton.style.display = 'inline-block';
    });

    async function generatePdfBlob() {
        if (dom.answersReviewDiv.style.display === 'none') { populateAnswersReview(); }
        const { jsPDF } = window.jspdf;
        const mainContainer = document.querySelector('.container');
        const buttonsToHide = document.querySelectorAll('.action-buttons, .top-nav');
        buttonsToHide.forEach(el => el.style.visibility = 'hidden');
        
        const canvas = await html2canvas(mainContainer, { scale: 1.5, useCORS: true, windowWidth: 900 });
        
        buttonsToHide.forEach(el => el.style.visibility = 'visible');

        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        const imgHeight = canvas.height * pdfWidth / canvas.width;
        let heightLeft = imgHeight, position = 0;
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
        heightLeft -= pdfHeight;
        while (heightLeft > 0) {
            position -= pdfHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeight);
            heightLeft -= pdfHeight;
        }
        return pdf.output('blob');
    }

    dom.shareToTeacherButton.addEventListener('click', async function() {
        this.textContent = translations[currentLang].sending; 
        this.disabled = true;
        try {
            const pdfBlob = await generatePdfBlob();
            const student = {
                lastname: document.getElementById('student_lastname').value || 'student',
                firstname: document.getElementById('student_firstname').value || 'report',
                class: (document.getElementById('student_class_number').value + document.getElementById('student_class_letter').value).trim() || 'class'
            };
            const fileName = `Lab_Report_4_${student.class}_${student.lastname}_${student.firstname}.pdf`.replace(/[\/\\?%*:|"<>]/g, '_');
            const caption = `Отчет по лабораторной работе №4\nУченик(ца): ${student.lastname} ${student.firstname}\nКласс: ${student.class}\nОценка: ${state.finalScoreText}`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', pdfBlob, fileName);
            formData.append('caption', caption);
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: 'POST', body: formData });
            const result = await response.json();
            if (result.ok) {
                this.textContent = translations[currentLang].send_success;
                this.style.backgroundColor = '#27ae60';
            } else {
                throw new Error(result.description || 'Unknown error');
            }
        } catch (error) {
            console.error('Full Error:', error);
            this.textContent = translations[currentLang].send_error;
            this.style.backgroundColor = '#e74c3c';
            this.disabled = false;
            alert(`${translations[currentLang].send_error}: ${error.message}. ${translations[currentLang].error_details}`);
        }
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (btn.classList.contains('active')) return;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            resetState();
            setLanguage(e.target.dataset.lang);
        });
    });

    function updateCheckButtonText() {
        if (state.attemptsLeft > 0) {
            const attemptText = translations[currentLang][state.attemptsLeft === 1 ? 'attempts_left_1' : 'attempts_left_2'];
            dom.checkButton.textContent = `${translations[currentLang].check_button} (${state.attemptsLeft} ${attemptText})`;
        } else {
            dom.checkButton.textContent = translations[currentLang].check_button;
            dom.checkButton.disabled = true;
        }
    }

    dom.rheostatSlider.addEventListener('input', updateSimulation);
    dom.backButton.addEventListener('click', () => window.history.back());

    resetState();
    setLanguage('ru');
});
</script>
</body>
</html>
