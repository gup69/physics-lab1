<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню лабораторных работ</title>
    <style>
        /* CSS стили для оформления страницы */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8; /* Сероватый фон */
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 90%;
            margin: 20px;
            background-color: #ffffff; /* Белый фон формы */
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease-in-out;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        /* Стили для шапки с логотипом */
        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
        }
        .page-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
            object-fit: cover;
            border: 3px solid #3498db;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .page-header .header-text h2 {
            margin: 0;
            padding: 0;
            border: none;
            color: #2c3e50;
            font-size: 2.2em;
        }
        .page-header .header-text p {
            margin: 5px 0 0 0;
            color: #7f8c8d;
            font-style: italic;
        }
        /* Стили для значка "Все права защищены" */
        .copyright {
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
            width: 100%;
        }
        /* Стили для кнопок меню */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 30px; /* Увеличенное расстояние между кнопками */
            margin-top: 30px;
            width: 100%;
            max-width: 400px;
        }
        .menu-button {
            display: block;
            padding: 15px;
            font-size: 1.2em;
            font-weight: 600;
            text-align: center;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        .menu-button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
        }
        .menu-button img {
            width: 30px;
            height: 30px;
            margin-right: 15px;
            filter: invert(100%); /* Делает иконку белой */
        }
        /* Стили для блока кнопок языка */
        .top-buttons {
            display: flex;
            justify-content: flex-end; /* Изменено для выравнивания по правому краю */
            width: 100%;
            margin-bottom: 15px;
        }
        .lang-switcher {
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            background: none;
            border: 1px solid #bdc3c7;
            padding: 5px 10px;
            margin-left: 2px; /* Уменьшенное расстояние между кнопками */
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s;
            text-decoration: none;
            font-size: 1em; /* Добавил, чтобы размер был одинаковым */
        }
        .lang-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }
        .lang-btn:hover {
            background-color: #e0e6ed;
            color: #555;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 2.5em;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <img src="logo.png" alt="Логотип автора">
            <div class="header-text">
                
                <p><span data-key="author_prefix">Автор:</span> <span data-key="author_details">Грязнов Юрий Петрович, учитель физики, гимназия №8 г. Шымкент, Казахстан</span></p>
            </div>
        </div>
        <div class="copyright" data-key="copyright">© Все права защищены, 2025</div>
        
        <div class="top-buttons">
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="ru">Русский</button>
                <button class="lang-btn" data-lang="kk">Қазақша</button>
                <button class="lang-btn" data-lang="en">English</button>
            </div>
        </div>

        <h1 data-key="menu_title">Выберите класс</h1>
        
        <div class="menu-buttons">
            <a href="lab7/lab7.html" class="menu-button" data-key="lab_7_button">Лабораторные работы 7 класс</a>
            <a href="lab8/lab8.html" class="menu-button" data-key="lab_8_button">Лабораторные работы 8 класс</a>
            <a href="lab9/lab9.html" class="menu-button" data-key="lab_9_button">Лабораторные работы 9 класс</a>
            <a href="lab10/lab10.html" class="menu-button" data-key="lab_10_button">Лабораторные работы 10 класс</a>
            <a href="lab11/lab11.html" class="menu-button" data-key="lab_11_button">Лабораторные работы 11 класс</a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const translations = {
                ru: {
                    
                    author_prefix: "Автор:",
                    author_details: "Грязнов Юрий Петрович, учитель физики, гимназия №8 г. Шымкент, Казахстан",
                    copyright: "© Все права защищены, {year}",
                    menu_title: "Выберите класс",
                    lab_7_button: "Лабораторные работы 7 класс",
                    lab_8_button: "Лабораторные работы 8 класс",
                    lab_9_button: "Лабораторные работы 9 класс",
                    lab_10_button: "Лабораторные работы 10 класс",
                    lab_11_button: "Лабораторные работы 11 класс"
                },
                kk: {
                    
                    author_prefix: "Авторы:",
                    author_details: "Грязнов Юрий Петрович, физика пәнінің мұғалімі, №8 гимназия, Шымкент қ., Қазақстан",
                    copyright: "© Барлық құқықтар қорғалған, {year}",
                    menu_title: "Сыныпты таңдаңыз",
                    lab_7_button: "7 сынып зертханалық жұмыстар",
                    lab_8_button: "8 сынып зертханалық жұмыстар",
                    lab_9_button: "9 сынып зертханалық жұмыстар",
                    lab_10_button: "10 сынып зертханалық жұмыстар",
                    lab_11_button: "11 сынып зертханалық жұмыстар"
                },
                en: {
                    
                    author_prefix: "Author:",
                    author_details: "Yuriy Gryaznov, Physics teacher, Gymnasium №8, Shymkent, Kazakhstan",
                    copyright: "© All rights reserved, {year}",
                    menu_title: "Choose a Grade",
                    lab_7_button: "Laboratory Work 7th Grade",
                    lab_8_button: "Laboratory Work 8th Grade",
                    lab_9_button: "Laboratory Work 9th Grade",
                    lab_10_button: "Laboratory Work 10th Grade",
                    lab_11_button: "Laboratory Work 11th Grade"
                }
            };
            let currentLang = 'ru';
            function setLanguage(lang) {
                currentLang = lang;
                document.querySelectorAll('[data-key]').forEach(element => {
                    const key = element.getAttribute('data-key');
                    if (translations[lang] && translations[lang][key]) {
                        let text = translations[lang][key];
                        if (key === 'copyright') {
                            text = text.replace('{year}', new Date().getFullYear());
                        }
                        element.textContent = text;
                    }
                });
                document.querySelector('html').setAttribute('lang', lang);
            }
            const langButtons = document.querySelectorAll('.lang-btn');
            langButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const lang = button.getAttribute('data-lang');
                    setLanguage(lang);
                    langButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                });
            });
            setLanguage('ru');
        });
    </script>
</body>
</html>
