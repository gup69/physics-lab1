<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню лабораторных работ</title>
    <style>
        /* CSS стили для оформления страницы */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 90%;
            margin: 20px;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease-in-out;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        /* Стили для шапки с логотипом */
        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
        }
        .page-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
            object-fit: cover;
            border: 3px solid #3498db;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .page-header .header-text h2 {
            margin: 0;
            padding: 0;
            border: none;
            color: #2c3e50;
            font-size: 2.2em;
        }
        .page-header .header-text p {
            margin: 5px 0 0 0;
            color: #7f8c8d;
            font-style: italic;
        }
        /* Стили для значка "Все права защищены" */
        .copyright {
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
            width: 100%;
        }
        /* Стили для кнопок меню */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 400px;
        }
        .menu-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            font-size: 1.2em;
            font-weight: 600;
            text-align: center;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        .menu-button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
        }
        .menu-button img {
            width: 30px;
            height: 30px;
            margin-right: 15px;
            filter: none;
        }
        /* Стили для блока кнопок "Назад" и "Язык" */
        .top-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
        }
        .lang-switcher {
            display: flex;
            gap: 5px;
        }
        .lang-btn, .back-btn {
            background: none;
            border: 1px solid #bdc3c7;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s; /* Добавлен border-color */
            text-decoration: none;
            color: #555;
            font-size: 1em;
        }
       
        /* Эффект при наведении на НЕактивную кнопку языка */
        .lang-btn:not(.active):hover {
            background-color: #e0e6ed;
            color: #555;
        }
        
        
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
     <img src="logo.png" alt="Логотип автора">
            <div class="header-text">
                <h2 data-key="grade_level">7 класс</h2>
                <p><span data-key="author_prefix">Автор:</span> <span data-key="author_details">Грязнов Юрий Петрович, учитель физики, гимназия №8 г. Шымкент, Казахстан</span></p>
            </div>
        </div>
        <div class="copyright" data-key="copyright">© Все права защищены, 2025</div>
        
        <div class="top-buttons">
            
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="ru">Русский</button>
                <button class="lang-btn" data-lang="kk">Қазақша</button>
                <button class="lang-btn" data-lang="en">English</button>
            </div>
        </div>

        <h1 data-key="menu_title">Меню лабораторных работ</h1>
        
        <div class="menu-buttons" id="menu-container"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // Единая иконка для всех лабораторных работ
            const labIcon = "icon.png";
        
            // Массив с данными о лабораторных работах
            const labsData = [
                { number: 1, href: "7lab1.html", icon: labIcon },
                { number: 2, href: "7lab2.html", icon: labIcon },
                { number: 3, href: "7lab3.html", icon: labIcon },
                { number: 4, href: "7lab4.html", icon: labIcon },
                { number: 5, href: "7lab5.html", icon: labIcon },
                { number: 6, href: "7lab6.html", icon: labIcon },
                { number: 7, href: "7lab7.html", icon: labIcon },
                { number: 8, href: "7lab8.html", icon: labIcon },
                { number: 9, href: "7lab9.html", icon: labIcon },
                { number: 10, href: "7lab10.html", icon: labIcon }
            ];

            const translations = {
                ru: {
                    grade_level: "7 класс",
                    author_prefix: "Автор:",
                    author_details: "Грязнов Юрий Петрович, учитель физики, гимназия №8 г. Шымкент, Казахстан",
                    copyright: "© Все права защищены, {year}",
                    menu_title: "Меню лабораторных работ",
                    lab_button: "Лабораторная работа №{number}",
                    back_button: "← Назад"
                    
                },
                kk: {
                    grade_level: "7 сынып",
                    author_prefix: "Авторы:",
                    author_details: "Грязнов Юрий Петрович, физика пәнінің мұғалімі, №8 гимназия, Шымкент қ., Қазақстан",
                    copyright: "© Барлық құқықтар қорғалған, {year}",
                    menu_title: "Зертханалық жұмыстар мәзірі",
                    lab_button: "№{number} Зертханалық жұмыс",
                    back_button: "← Артқа"
                    
                },
                en: {
                    grade_level: "7th Grade",
                    author_prefix: "Author:",
                    author_details: "Yuriy Gryaznov, Physics teacher, Gymnasium №8, Shymkent, Kazakhstan",
                    copyright: "© All rights reserved, {year}",
                    menu_title: "Laboratory Work Menu",
                    lab_button: "Laboratory Work #{number}",
                    back_button: "← Back"
                }
            };

            const menuContainer = document.getElementById('menu-container');
            let currentLang = 'ru';

            // Функция для создания и добавления кнопок
            function createLabButtons(lang) {
                // Очищаем контейнер от старых кнопок
                menuContainer.innerHTML = '';
                // Проходим по массиву labsData и создаем кнопку для каждой работы
                labsData.forEach(lab => {
                    const buttonText = translations[lang].lab_button.replace('{number}', lab.number);
                    const buttonLink = document.createElement('a');
                    buttonLink.href = lab.href;
                    buttonLink.className = 'menu-button';
                    buttonLink.setAttribute('data-key', `lab${lab.number}_button`);

                    const buttonImg = document.createElement('img');
                    buttonImg.src = lab.icon;
                    buttonImg.alt = `Иконка ЛР ${lab.number}`;

                    const buttonSpan = document.createElement('span');
                    buttonSpan.textContent = buttonText;

                    buttonLink.appendChild(buttonImg);
                    buttonLink.appendChild(buttonSpan);
                    menuContainer.appendChild(buttonLink);
                });
            }

            // Функция для установки языка
            function setLanguage(lang) {
                currentLang = lang;
                document.querySelectorAll('[data-key]').forEach(element => {
                    const key = element.getAttribute('data-key');
                    if (translations[lang] && translations[lang][key]) {
                        let text = translations[lang][key];
                        if (key === 'copyright') {
                            text = text.replace('{year}', new Date().getFullYear());
                        }
                        // Измененная проверка, чтобы не менять текст у `a` тегов, кроме кнопки "Назад"
                        if (element.tagName.toLowerCase() === 'a' && key === 'back_button') {
                            element.textContent = text;
                        } else if (element.tagName.toLowerCase() !== 'a') {
                            element.textContent = text;
                        }
                    }
                });
                document.querySelector('html').setAttribute('lang', lang);
                createLabButtons(lang);
            }

            const langButtons = document.querySelectorAll('.lang-btn');
            langButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const lang = button.getAttribute('data-lang');
                    setLanguage(lang);
                    langButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                });
            });

            // Запускаем создание кнопок при загрузке страницы
            setLanguage('ru');
        });
    </script>
</body>
</html>
