            gameState.hasSoilSample = null; allElements.labAnalysisBtn.disabled = true;
        };
        allElements.reagentAcidBtn.onclick = () => handleReagentChoice('acid'); allElements.reagentWaterBtn.onclick = () => handleReagentChoice('water'); allElements.reagentAlkaliBtn.onclick = () => handleReagentChoice('alkali');
        const handleBiologyAnswer = (userAnswer) => { if (userAnswer === gameState.currentBiologyQuestion.answer) { gameState.science += 200; updateLog('logBiologyDiscovery'); sounds.positive.play(); } allElements.biologyModal.classList.add('hidden'); setPauseState(false); };
        allElements.biologyTrueBtn.onclick = () => handleBiologyAnswer(true); allElements.biologyFalseBtn.onclick = () => handleBiologyAnswer(false);
        allElements.closeResultBtn.onclick = () => {
            allElements.resultModal.classList.add('hidden');
            if (gameState.pendingBiologyDiscovery) {
                gameState.pendingBiologyDiscovery = false; gameState.currentBiologyQuestion = biologyQuestions[Math.floor(Math.random() * biologyQuestions.length)];
                allElements.biologyQuestion.textContent = translations[gameState.currentLanguage][gameState.currentBiologyQuestion.key];
                setTimeout(() => allElements.biologyModal.classList.remove('hidden'), 200);
            } else { if (!gameState.gameWon) setPauseState(false); }
        };
        document.getElementById('upgrades-container').addEventListener('click', (event) => {
            const button = event.target.closest('.upgrade-btn'); if (!button || gameState.isPaused) return;
            const upgradeId = button.id.replace('upgrade-', ''); const upg = upgrades.find(u => u.id === upgradeId); if (!upg || upg.purchased) return;
            const canAfford = gameState.science >= upg.costScience && gameState.engineeringData >= upg.costEngineering && (!upg.costRareMinerals || gameState.rareMinerals >= upg.costRareMinerals);
            if (canAfford) { gameState.science -= upg.costScience; gameState.engineeringData -= upg.costEngineering; if (upg.costRareMinerals) { gameState.rareMinerals -= upg.costRareMinerals; } upg.purchased = true; upg.applyEffect(); sounds.positive.play(); if (!gameState.firstUpgradePurchased) { gameState.firstUpgradePurchased = true; } checkMissions(); renderUpgrades(); }
        });
        const handleConversion = (from, to) => {
            const amount = parseInt(allElements.conversionInput.value, 10); if (isNaN(amount) || amount <= 0) { return; }
            if (gameState[from] >= amount) {
                gameState[from] -= amount; const gained = Math.floor(amount * 0.5); gameState[to] += gained;
                sounds.positive.play();
                showResultModal('resultTitleSuccess', 'conversionSuccess', '✅', true, { spent: amount, from: translations[gameState.currentLanguage][from === 'science' ? 'scienceLabel' : 'engineeringLabel'], gained: gained, to: translations[gameState.currentLanguage][to === 'science' ? 'scienceLabel' : 'engineeringLabel'] });
            } else { sounds.negative.play(); showResultModal('resultTitleFail', 'conversionFail', '❌'); }
            allElements.conversionInput.value = '';
        };
        allElements.convertSToEBtn.onclick = () => handleConversion('science', 'engineeringData');
        allElements.convertEToSBtn.onclick = () => handleConversion('engineeringData', 'science');
        allElements.checkRepairBtn.onclick = checkRepairSolution;
        allElements.langRu.onclick = () => changeLanguage('ru'); allElements.langKz.onclick = () => changeLanguage('kz'); allElements.langEn.onclick = () => changeLanguage('en');
        [allElements.difficultyEasy, allElements.difficultyMedium, allElements.difficultyHard].forEach(btn => { btn.addEventListener('click', (event) => { [allElements.difficultyEasy, allElements.difficultyMedium, allElements.difficultyHard].forEach(b => b.classList.remove('active')); event.target.classList.add('active'); gameState.difficulty = event.target.id.replace('difficulty-', ''); allElements.startButton.disabled = false; }); });
        allElements.instructionsBtn.onclick = () => { setPauseState(true); allElements.instructionsModal.classList.remove('hidden'); };
        allElements.closeInstructionsBtn.onclick = () => { allElements.instructionsModal.classList.add('hidden'); if (!gameState.gameWon) setPauseState(false); };
    }
    // UTILITY AND SETUP FUNCTIONS
    function setPauseState(shouldBePaused) { if (gameState.gameWon && !shouldBePaused) return; gameState.isPaused = shouldBePaused; const lang = translations[gameState.currentLanguage]; allElements.pauseBtn.textContent = gameState.isPaused ? lang.resumeBtn : lang.pauseBtn; allElements.pauseBtn.classList.toggle('paused-btn', gameState.isPaused); if (gameState.isAlarmPlaying) { if (gameState.isPaused) sounds.alert.pause(); else sounds.alert.play().catch(e=>{}); } if(!gameState.isPaused) { gameState.lastTickTime = Date.now(); } }
    function checkAlarms() { const isCritical = gameState.energy < 25 || gameState.water < 25 || gameState.oxygen < 25; if (isCritical && !gameState.isAlarmPlaying) { sounds.alert.loop = true; sounds.alert.play().catch(e=>{}); gameState.isAlarmPlaying = true; } else if (!isCritical && gameState.isAlarmPlaying) { sounds.alert.pause(); sounds.alert.currentTime = 0; gameState.isAlarmPlaying = false; } }
    function updateLog(key, replacements = {}) { 
        gameState.lastLogKey = key; gameState.lastLogReplacements = replacements;
        let message = (translations[gameState.currentLanguage] && translations[gameState.currentLanguage][key]) || key; 
        for (const placeholder in replacements) { message = message.replace(`{${placeholder}}`, replacements[placeholder]); } 
        allElements.logMessage.textContent = message; 
    }
    function updatePlantStatus() { const lang = translations[gameState.currentLanguage]; if (gameState.water < 30 || gameState.energy < 20) { allElements.plantStatus.textContent = lang.plantStatusBad; allElements.plantIcon.textContent = '🥀'; } else { allElements.plantStatus.textContent = lang.plantStatusOK; allElements.plantIcon.textContent = '🌱'; } }
    function updateBarColor(barElement, value) { if (value < 25) { barElement.style.backgroundColor = '#d9534f'; } else if (value < 50) { barElement.style.backgroundColor = '#f0ad4e'; } else { barElement.style.backgroundColor = '#4caf50'; } }
    function startSimulation() { try { if (gameState.gameHasStarted || !gameState.difficulty) return; const selectedLang = gameState.currentLanguage; const selectedDifficulty = gameState.difficulty; initializeState(); updateLog('logInitial'); gameState.difficulty = selectedDifficulty; gameState.currentLanguage = selectedLang; gameState.gameHasStarted = true; changeLanguage(gameState.currentLanguage); document.getElementById('start-screen').classList.add('hidden'); if(mainGameInterval) clearInterval(mainGameInterval); if(secondaryGameInterval) clearInterval(secondaryGameInterval); if(eventInterval) clearInterval(eventInterval); mainGameInterval = setInterval(gameLoop, 50); secondaryGameInterval = setInterval(checkMissions, 1000); eventInterval = setInterval(triggerRandomEvent, 25000); } catch (error) { console.error("CRITICAL ERROR on simulation start:", error); alert("A critical error occurred."); } }
    function checkMissions() { if (gameState.gameWon) return; let missionCompletedNow = false; missions.forEach(phase => { phase.objectives.forEach(obj => { if (!obj.isComplete && obj.check(gameState)) { obj.isComplete = true; missionCompletedNow = true; } }); }); if (missionCompletedNow) { sounds.positive.play(); } const currentPhase = missions[gameState.currentMissionPhase]; if (currentPhase && currentPhase.objectives.every(obj => obj.isComplete)) { if (gameState.currentMissionPhase < missions.length - 1) { gameState.currentMissionPhase++; sounds.positive.play(); } else if (!gameState.gameWon) { gameState.gameWon = true; allElements.victoryModal.classList.remove('hidden'); setPauseState(true); } } renderMissions(); }
    function renderMissions() { const lang = translations[gameState.currentLanguage]; allElements.missionsList.innerHTML = ''; missions.forEach((phase, phaseIndex) => { const phaseItem = document.createElement('li'); phaseItem.textContent = lang[phase.titleKey]; phaseItem.className = 'phase-title'; if (phaseIndex > gameState.currentMissionPhase) phaseItem.classList.add('locked'); allElements.missionsList.appendChild(phaseItem); phase.objectives.forEach(obj => { const objItem = document.createElement('li'); const prefix = obj.isComplete ? '✅ ' : '⬜ '; const camelCaseId = obj.id.split('_').map((word, i) => i > 0 ? word.charAt(0).toUpperCase() + word.slice(1) : word).join(''); const missionKey = `mission${camelCaseId.charAt(0).toUpperCase() + camelCaseId.slice(1)}`; objItem.textContent = prefix + (lang[missionKey] || obj.id); if (obj.isComplete) objItem.classList.add('completed'); if (phaseIndex > gameState.currentMissionPhase) objItem.classList.add('locked'); allElements.missionsList.appendChild(objItem); }); }); }
    
    // ФУНКЦИЯ СОБЫТИЙ (С ИСПРАВЛЕНИЕМ ДЛЯ ЩИТА)
    function triggerRandomEvent() {
        if (gameState.activeEvent || gameState.isPaused || !gameState.gameHasStarted) return;

        let randomEvent = events[Math.floor(Math.random() * events.length)];
        
        // --- НОВАЯ ЛОГИКА ПРОВЕРКИ ЩИТА ---
        const isNegativeEvent = ['dustStorm', 'waterLeak', 'solarBreakdown', 'pumpBreakdown', 'oxygenBreakdown'].includes(randomEvent.id);

        if (isNegativeEvent && gameState.modifiers.eventProtection) {
            // Щит активен! Отменяем негативное событие.
            const positiveEvents = events.filter(e => e.id === 'clearDay' || e.id === 'iceFound');
            if (positiveEvents.length > 0) {
                randomEvent = positiveEvents[Math.floor(Math.random() * positiveEvents.length)];
            } else {
                return;
            }
        }
        // --- КОНЕЦ НОВОЙ ЛОГИКИ ---

        gameState.activeEvent = randomEvent;
        gameState.activeEvent.effect();
        checkMissions();
        
        const eventLogKey = `event${randomEvent.id?.charAt(0).toUpperCase() + randomEvent.id?.slice(1)}Desc`;
        updateLog(eventLogKey);

        setTimeout(() => {
            if (gameState.activeEvent === randomEvent) {
                gameState.activeEvent.removeEffect();
                gameState.activeEvent = null;
                updateLog('eventNormalDesc');
            }
        }, randomEvent.duration);
    }
    
    // --- REPAIR SYSTEM LOGIC ---
    function breakSystem(system) {
        let systemName;
        if (system === 'pump') systemName = 'water';
        else systemName = system;
        
        if (gameState.brokenSystems[systemName]) return;
        gameState.brokenSystems[systemName] = true;
        updateBrokenSystemsUI();
        const key = `event${system.charAt(0).toUpperCase() + system.slice(1)}BreakdownDesc`;
        updateLog(key);
        sounds.alert.play();
    }
    
    // ФУНКЦИЯ ПОЧИНКИ (УПРОЩЕНА, УБРАНА НАГРАДА)
    function fixSystem(system) {
        gameState.brokenSystems[system] = false;
        updateBrokenSystemsUI();
        setPauseState(false);
    }
    
    function updateBrokenSystemsUI() {
        const lang = translations[gameState.currentLanguage];
        const systemMap = { solar: allElements.solarBtn, water: allElements.waterBtn, oxygen: allElements.oxygenBtn };
        for (const system in gameState.brokenSystems) {
            const btn = systemMap[system];
            if (gameState.brokenSystems[system]) {
                btn.classList.add('broken-btn');
                btn.textContent = lang.repairBtn;
            } else {
                btn.classList.remove('broken-btn');
                const key = {solar: 'solarBtn', water: 'waterBtn', oxygen: 'oxygenBtn'}[system];
                btn.textContent = lang[key];
            }
        }
    }
    
    // ФУНКЦИЯ ОТКРЫТИЯ РЕМОНТА (ЗАПУСКАЕТ ТАЙМЕР)
    function openRepairModal(system) {
        gameState.modalOpenTime = Date.now(); // <--- ЗАПУСКАЕМ ТАЙМЕР
        setPauseState(true);
        gameState.systemToRepair = system;
        generateRepairPuzzle();
        allElements.repairModal.classList.remove('hidden');
    }
    
    // ГЕНЕРАЦИЯ ГОЛОВОЛОМКИ (С КОРРЕКТНЫМ SVG)
    function generateRepairPuzzle() {
        const svgData = {
            line: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                       <rect x="30" y="0" width="40" height="100" fill="#ffffff"/>
                     </svg>`,
            corner: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                         <rect x="30" y="0" width="40" height="70" fill="#ffffff"/>
                         <rect x="30" y="30" width="70" height="40" fill="#ffffff"/>
                       </svg>`,
            tpipe: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                        <rect x="30" y="0" width="40" height="100" fill="#ffffff"/>
                        <rect x="70" y="30" width="30" height="40" fill="#ffffff"/>
                      </svg>`
        };

        const createDataUrl = (svgString) => `url("data:image/svg+xml,${encodeURIComponent(svgString)}")`;

        const grid = Array(16).fill(null).map(() => {
            const rand = Math.random();
            const type = rand < 0.4 ? 'line' : (rand < 0.8 ? 'corner' : 'tpipe');
            return { type: type, rotation: Math.floor(Math.random() * 4) * 90 };
        });
        
        grid[0].type = 'start'; grid[15].type = 'end';
        allElements.repairGrid.innerHTML = '';
        
        grid.forEach((tile, index) => {
            const tileEl = document.createElement('div');
            tileEl.classList.add('repair-tile');
            if (tile.type === 'start' || tile.type === 'end') {
                tileEl.classList.add(tile.type);
            } else {
                const maskUrl = createDataUrl(svgData[tile.type]);
                tileEl.style.webkitMaskImage = maskUrl;
                tileEl.style.maskImage = maskUrl;
                tileEl.dataset.type = tile.type; 

                tileEl.style.transform = `rotate(${tile.rotation}deg)`;
                tileEl.dataset.rotation = tile.rotation;
                tileEl.onclick = () => {
                    let currentRotation = parseInt(tileEl.dataset.rotation, 10);
                    currentRotation = (currentRotation + 90) % 360;
                    tileEl.dataset.rotation = currentRotation;
                    tileEl.style.transform = `rotate(${currentRotation}deg)`;
                };
            }
            allElements.repairGrid.appendChild(tileEl);
        });
    }

    // ПРОВЕРКА РЕШЕНИЯ (С ЛОГИКОЙ БОНУСА)
    function checkRepairSolution() {
        const tiles = allElements.repairGrid.children;
        const grid = [];
        for (let i = 0; i < tiles.length; i++) {
            const tile = tiles[i];
            const type = tile.classList.contains('start') ? 'start' : (tile.classList.contains('end') ? 'end' : tile.dataset.type);
            grid.push({ type: type, rotation: parseInt(tile.dataset.rotation || 0, 10) });
        }
        
        // 0: Верх, 1: Право, 2: Низ, 3: Лево
        const connections = {
            line:   [[0, 2], [1, 3]],
            corner: [[0, 1], [1, 2], [2, 3], [3, 0]],
            tpipe:  [[0, 1, 2], [1, 2, 3], [2, 3, 0], [3, 0, 1]],
            start:  [[0, 1, 2, 3]],
            end:    [[0, 1, 2, 3]]
        };
        
        const queue = [{ index: 0, from: null }]; const visited = new Set([0]);
        while (queue.length > 0) {
            const { index, from } = queue.shift();
            
            if (index === 15) {
                // --- НАЧАЛО НОВОЙ ЛОГИКИ БОНУСА ---
                allElements.repairModal.classList.add('hidden');
                fixSystem(gameState.systemToRepair); // Чиним UI и снимаем паузу
                
                const timeElapsed = Date.now() - gameState.modalOpenTime;
                let reward = 5; // Базовая награда
                let logKey = 'repairSuccess';

                if (timeElapsed <= 10000) { // 10 секунд
                    reward *= 2; // Удваиваем
                    logKey = 'repairSuccessBonus';
                }

                gameState.engineeringData += reward;
                updateLog(logKey, { amount: reward });
                sounds.positive.play();
                // --- КОНЕЦ НОВОЙ ЛОГИКИ БОНУСА ---
                return; // Успех, выходим из функции
            }
            
            const getDirs = (tile) => {
                if (!tile || !tile.type || !connections[tile.type]) return [];
                if (tile.type === 'start' || tile.type === 'end') return connections.start[0];
                
                let rotIndex = 0;
                if (tile.type === 'line') rotIndex = (tile.rotation / 90) % 2;
                if (tile.type === 'corner') rotIndex = (tile.rotation / 90) % 4;
                if (tile.type === 'tpipe') rotIndex = (tile.rotation / 90) % 4;

                return connections[tile.type][rotIndex];
            };
            
            const currentDirs = getDirs(grid[index]);
            for (const dir of currentDirs) {
                let neighborIndex = -1;
                if (dir === 0 && index > 3) neighborIndex = index - 4; // 0 = Верх
                if (dir === 1 && (index + 1) % 4 !== 0) neighborIndex = index + 1; // 1 = Право
                if (dir === 2 && index < 12) neighborIndex = index + 4; // 2 = Низ
                if (dir === 3 && index % 4 !== 0) neighborIndex = index - 1; // 3 = Лево
                
                if (neighborIndex !== -1 && !visited.has(neighborIndex)) {
                    const neighborDirs = getDirs(grid[neighborIndex]);
                    const requiredDir = (dir + 2) % 4; // Требуемое направление (противоположное)
                    if (neighborDirs.includes(requiredDir)) { 
                        visited.add(neighborIndex); 
                        queue.push({ index: neighborIndex, from: index }); 
                    }
                }
            }
        }
        
        // Сюда мы попадаем, только если цикл while закончился (путь не найден)
        sounds.negative.play(); updateLog('repairFail'); gameState.energy = Math.max(0, gameState.energy - 5);
        allElements.repairModal.querySelector('.modal-window').classList.add('error');
        setTimeout(() => allElements.repairModal.querySelector('.modal-window').classList.remove('error'), 500);
    }

    
    // --- ENTRY POINT ---
    initializeState();
    attachEventListeners();
    changeLanguage('ru');
});
</script>
