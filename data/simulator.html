<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор симулятора</title>
    
    <style>
        /* --- Основные стили --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f0f0f0;
            /* Темный фон с "технологичным" синим градиентом */
            background: radial-gradient(circle, #1a2a40 0%, #0a0f18 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* --- Контейнер --- */
        .container {
            width: 90%;
            max-width: 800px;
            padding: 2rem 4rem;
            background: rgba(0, 0, 0, 0.4); /* Полупрозрачная панель */
            border-radius: 15px;
            /* Эффект "неонового" свечения, как у реактора */
            border: 1px solid rgba(0, 170, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 170, 255, 0.3), 
                        inset 0 0 10px rgba(0, 170, 255, 0.2);
            backdrop-filter: blur(5px); /* Эффект "матового стекла" */
        }

        /* --- Заголовок --- */
        header h1 {
            font-size: 2.8rem;
            font-weight: 600;
            color: #00aaff; /* Яркий, "ядерный" синий */
            text-shadow: 0 0 10px rgba(0, 170, 255, 0.7);
            margin-bottom: 1rem;
        }

        /* --- Подписи на трех языках --- */
        header p {
            font-size: 1.1rem;
            color: #ccc;
            margin: 0.5rem 0;
            line-height: 1.5;
        }

        /* --- Контейнер для кнопок --- */
        .language-selector {
            display: flex;
            justify-content: center;
            align-items: stretch; /* Делает кнопки одинаковой высоты */
            gap: 2rem;
            margin-top: 2.5rem;
            flex-wrap: wrap; /* Для мобильных устройств */
        }

        /* --- Сами кнопки (ссылки) --- */
        .lang-button {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 2.5rem;
            text-decoration: none;
            color: #f0f0f0;
            background-color: #222;
            border: 2px solid #00aaff;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 120px;
        }

        /* --- Эффект при наведении --- */
        .lang-button:hover {
            background-color: #00aaff;
            color: #111;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
            transform: translateY(-5px); /* "Приподнимаем" кнопку */
        }

        /* --- Иконки флагов --- */
        .flag-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Симулятор ядерных превращений</h1>
            <p>Пожалуйста, выберите язык для запуска программного обеспечения.</p>
            <p>Бағдарламалық жасақтаманы іске қосу үшін тілді таңдаңыз.</p>
            <p>Please select a language to launch the software.</p>
        </header>
        
        <nav class="language-selector">
            <a href="simulator1.html" class="lang-button">
                <span class="flag-icon">RU</span>
                <span>Русский</span>
            </a>
            
            <a href="simulator2.html" class="lang-button">
                <span class="flag-icon">KZ</span>
                <span>Қазақша</span>
            </a>
            
            <a href="simulator3.html" class="lang-button">
                <span class="flag-icon">EN</span>
                <span>English</span>
            </a>
        </nav>
    </div>

</body>
</html>
