<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диспетчер "Точный Расчет" v4.0 (Multi-lang)</title>
    <style>
        /* --- Стили CSS --- */
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            width: 100%;
            max-width: 1200px; 
            background-color: #2a2a4e;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            overflow: hidden;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        /* (ИЗМЕНЕНИЕ) Стили для выбора языка */
        .lang-selector {
            background-color: #1f1f3d;
            padding: 10px 25px;
            text-align: right;
            border-bottom: 1px solid #2a2a4e;
        }
        .lang-btn {
            background: none;
            border: 1px solid #888;
            color: #888;
            margin-left: 5px;
            cursor: pointer;
            border-radius: 5px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            color: #1a1a2e;
            background-color: #00ffcc;
            border-color: #00ffcc;
            font-weight: bold;
        }
        .lang-btn:hover:not(.active) {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }


        .mission-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background-color: #1f1f3d;
            padding: 10px;
            border-bottom: 2px solid #00ffcc;
        }

        .mission-nav button {
            background: none;
            border: 1px solid #888;
            color: #888;
            padding: 8px 12px;
            margin: 5px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            flex-basis: 18%; 
            min-width: 120px;
        }

        .mission-nav button.active {
            color: #1a1a2e;
            background-color: #00ffcc;
            border-color: #00ffcc;
            font-weight: bold;
        }

        .mission-nav button:hover:not(.active):not(:disabled) {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }

        .mission-nav button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .main-content-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch; 
        }

        .game-area {
            flex: 2; 
            display: flex;
            flex-direction: column;
        }

        .mission-monitor {
            padding: 25px;
            border-bottom: 1px dashed #444;
        }

        #mission-title {
            color: #00ffcc;
            margin-top: 0;
            text-transform: uppercase;
        }

        #mission-data {
            background-color: #1f1f3d;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #00ffcc;
            margin: 20px 0;
        }

        #mission-data p { margin: 8px 0; }
        #mission-question {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1em;
        }

        .input-console {
            padding: 25px;
        }

        .input-console label {
            font-size: 0.9em;
            color: #aaa;
        }

        #user-answer {
            width: 100%;
            background-color: #1f1f3d;
            border: 1px solid #888;
            color: #e0e0e0;
            padding: 12px;
            font-family: inherit;
            font-size: 1.2em;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s ease;
            box-sizing: border-box; 
            margin-top: 5px;
            margin-bottom: 15px;
        }

        #user-answer:focus { border-color: #00ffcc; }

        .console-buttons {
            display: flex;
            gap: 10px;
        }

        #submit-button, #new-data-button {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-button {
            background-color: #00ffcc;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
        }
        #submit-button:hover { background-color: #00e6b8; }
        
        #new-data-button {
            background: none;
            border: 1px solid #888;
            color: #888;
        }
        #new-data-button:hover {
            border-color: #e0e0e0;
            color: #e0e0e0;
        }

        #feedback-message {
            margin-top: 15px;
            text-align: center;
            font-size: 1.1em;
            height: 20px;
            font-weight: bold;
        }

        .feedback-correct { color: #00ffcc; }
        .feedback-unlock { color: #ffd700; } 
        .feedback-incorrect { color: #ff4d4d; }

        .progress-tracker {
            flex: 1; 
            background-color: #1f1f3d;
            padding: 20px 25px;
            border-left: 2px solid #00ffcc; 
            min-height: 100%; 
        }
        .progress-tracker h3 {
            color: #00ffcc;
            margin-top: 0;
            text-align: center;
        }
        #progress-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column; 
            gap: 10px;
        }
        #progress-list li {
            font-size: 0.95em;
            background-color: #2a2a4e;
            padding: 8px 12px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
        #progress-list li.locked {
            color: #666;
            background-color: #222;
        }
        .progress-stats {
            color: #fff;
            font-weight: bold;
        }
        .correct { color: #00ffcc; }
        .incorrect { color: #ff4d4d; }

        /* Убираем стрелки у input[type=number] */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>

        const missionData = document.getElementById('mission-data');
        const missionQuestion = document.getElementById('mission-question');
        const userAnswerInput = document.getElementById('user-answer');
        const submitButton = document.getElementById('submit-button');
        const newDataButton = document.getElementById('new-data-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const navButtons = document.querySelectorAll('.mission-nav button');
        const progressList = document.getElementById('progress-list');
        const langButtons = document.querySelectorAll('.lang-btn'); // (НОВОЕ)
        const progressTitle = document.getElementById('progress-title'); // (НОВОЕ)
        const inputLabel = document.getElementById('input-label'); // (НОВОЕ)

        // --- Утилиты ---

        function getRandom(min, max, decimals = 0) {
            const str = (Math.random() * (max - min) + min).toFixed(decimals);
            return parseFloat(str);
        }

        function resetConsole() {
            userAnswerInput.value = '';
            feedbackMessage.textContent = '';
            feedbackMessage.className = '';
        }

        function updateActiveButton(activeId) {
            navButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === activeId);
            });
        }

        // --- (ИЗМЕНЕНО) Логика переводов ---

        /**
         * (НОВАЯ) Устанавливает язык и обновляет весь интерфейс
         */
        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;

            // Обновляем классы кнопок языка
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === `lang-${lang}`);
            });

            // Обновляем статичный UI
            const ui = translations[currentLang].ui;
            submitButton.textContent = ui.submit;
            newDataButton.textContent = ui.newData;
            inputLabel.textContent = ui.inputLabel;
            userAnswerInput.placeholder = ui.placeholder;

            // Обновляем боковую панель (она тоже зависит от языка)
            updateProgressWindow();

            // Перезагружаем текущую миссию, чтобы обновить ее текст
            missionLoaders[currentMissionId]();
        }

        /**
         * (ИЗМЕНЕНО) Обновляет окно прогресса, используя `currentLang`
         */
        function updateProgressWindow() {
            progressList.innerHTML = ''; 
            const t = translations[currentLang].progress;
            
            // Обновляем заголовок боковой панели
            progressTitle.innerHTML = t.title;

            for (let i = 1; i <= TOTAL_MISSIONS; i++) {
                const progress = missionProgress[i];
                const btn = document.getElementById(`btn-m${i}`);
                const li = document.createElement('li');

                const stats = `<span class="progress-stats">
                                <span class="correct">${progress.correct} ✔</span> / 
                                <span class="incorrect">${progress.incorrect} ❌</span>
                             </span>`;

                if (progress.unlocked) {
                    li.innerHTML = `<span>${t.mission} ${i} 🔓</span> ${stats}`;
                    btn.disabled = false;
                    btn.innerHTML = `${t.mission} ${i}`;
                } else {
                    li.innerHTML = `<span>${t.mission} ${i} 🔒</span> ${stats}`;
                    li.classList.add('locked');
                    btn.disabled = true;
                    btn.innerHTML = `${t.mission} ${i} 🔒`;
                }
                progressList.appendChild(li);
            }
            updateActiveButton(`btn-m${currentMissionId}`);
        }

        // --- (ИЗМЕНЕНО) Загрузчики Миссий (теперь берут текст из `translations`) ---

        function loadMission1() {
            resetConsole();
            currentMissionId = 1;
            updateActiveButton('btn-m1');
            const S = getRandom(100, 500, 0);
            const vA = getRandom(15, 30, 0);
            const vB = getRandom(20, 40, 0);
            currentCorrectAnswer = S / (vA + vB);

            const t = translations[currentLang].missions[1];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.S} (S): ${S} км</p><p>${t.data.vA} (vA): ${vA} км/ч</p><p>${t.data.vB} (vB): ${vB} км/ч</p>`;
            missionQuestion.textContent = t.question;
        }

        function loadMission2() {
            resetConsole();
            currentMissionId = 2;
            updateActiveButton('btn-m2');
            const v0 = getRandom(80, 200, 0);
            const S = getRandom(500, 1500, 0);
            currentCorrectAnswer = (v0 * v0) / (2 * S);
            
            const t = translations[currentLang].missions[2];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.v0} (v0): ${v0} м/с</p><p>${t.data.S} (S): ${S} м</p>`;
            missionQuestion.textContent = t.question;
        }

        function loadMission3() {
            resetConsole();
            currentMissionId = 3;
            updateActiveButton('btn-m3');
            const h = getRandom(800, 3000, 0);
            const vx = getRandom(150, 350, 0);
            const time = Math.sqrt((2 * h) / G);
            currentCorrectAnswer = vx * time;
            
            const t = translations[currentLang].missions[3];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.h} (h): ${h} м</p><p>${t.data.vx} (vx): ${vx} м/с</p><p>(g = ${G} м/с²)</p>`;
            missionQuestion.textContent = t.question;
        }

        function loadMission4() {
            resetConsole();
            currentMissionId = 4;
            updateActiveButton('btn-m4');
            const L = getRandom(300, 1000, 0);
            const angle = 45;
            currentCorrectAnswer = Math.sqrt(L * G);
            
            const t = translations[currentLang].missions[4];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.L} (L): ${L} м</p><p>${t.data.angle} (α): ${angle}°</p><p>(g = ${G} м/с²)</p>`;
            missionQuestion.textContent = t.question;
        }

        function loadMission5() {
            resetConsole();
            currentMissionId = 5;
            updateActiveButton('btn-m5');
            const v0 = getRandom(100, 500, 0);
            currentCorrectAnswer = (v0 * v0) / (2 * G);

            const t = translations[currentLang].missions[5];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.v0} (v0): ${v0} м/с</p><p>(g = ${G} м/с²)</p>`;
            missionQuestion.textContent = t.question;
        }

        function loadMission6() {
            resetConsole();
            currentMissionId = 6;
            updateActiveButton('btn-m6');
            const v0 = getRandom(50, 300, 0);
            currentCorrectAnswer = (2 * v0) / G;
            
            const t = translations[currentLang].missions[6];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.v0} (v0): ${v0} м/с</p><p>(g = ${G} м/с²)</p>`;
            missionQuestion.textContent = t.question;
        }

        function loadMission7() {
            resetConsole();
            currentMissionId = 7;
            updateActiveButton('btn-m7');
            const h = getRandom(200, 2000, 0);
            currentCorrectAnswer = Math.sqrt((2 * h) / G);
            
            const t = translations[currentLang].missions[7];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.h} (h): ${h} м</p><p>(g = ${G} м/с²)</p>`;
            missionQuestion.textContent = t.question;
        }

        function loadMission8() {
            resetConsole();
            currentMissionId = 8;
            updateActiveButton('btn-m8');
            const v0 = getRandom(100, 400, 0);
            const angle = getRandom(20, 70, 0);
            const angleRad = angle * (Math.PI / 180);
            const vy = v0 * Math.sin(angleRad);
            currentCorrectAnswer = (vy * vy) / (2 * G);
            
            const t = translations[currentLang].missions[8];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.v0} (v0): ${v0} м/с</p><p>${t.data.angle} (α): ${angle}°</p><p>(g = ${G} м/с²)</p>`;
            missionQuestion.textContent = t.question;
        }
        
        function loadMission9() {
            resetConsole();
            currentMissionId = 9;
            updateActiveButton('btn-m9');
            const v0 = getRandom(100, 400, 0);
            const angle = getRandom(20, 70, 0);
            const angleRad = angle * (Math.PI / 180);
            const vy = v0 * Math.sin(angleRad);
            currentCorrectAnswer = (2 * vy) / G;

            const t = translations[currentLang].missions[9];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.v0} (v0): ${v0} м/с</p><p>${t.data.angle} (α): ${angle}°</p><p>(g = ${G} м/с²)</p>`;
            missionQuestion.textContent = t.question;
        }

        function loadMission10() {
            resetConsole();
            currentMissionId = 10;
            updateActiveButton('btn-m10');
            const v = getRandom(1000, 8000, 0); 
            const r = getRandom(6500, 42000, 0) * 1000;
            currentCorrectAnswer = (v * v) / r;
            
            const t = translations[currentLang].missions[10];
            missionTitle.textContent = t.title;
            missionScenario.textContent = t.scenario;
            missionData.innerHTML = `<p>${t.data.v} (v): ${v} м/с</p><p>${t.data.r} (r): ${r/1000} км</p>`;
            missionQuestion.textContent = t.question;
        }

        // --- (ИЗМЕНЕНО) Обработчик проверки ответа (использует `translations`) ---

        function checkAnswer() {
            const userAnswer = parseFloat(userAnswerInput.value);
            let unlockedNewMission = false;
            const t = translations[currentLang].feedback; // Сообщения обратной связи

            if (isNaN(userAnswer)) {
                feedbackMessage.textContent = t.enterNumber;
                feedbackMessage.className = 'feedback-incorrect';
                return;
            }

            if (Math.abs(userAnswer - currentCorrectAnswer) < (currentCorrectAnswer * TOLERANCE + 0.1) ) {
                // Правильный ответ
                missionProgress[currentMissionId].correct++;
                
                const nextMissionId = currentMissionId + 1;
                if (nextMissionId <= TOTAL_MISSIONS && !missionProgress[nextMissionId].unlocked) {
                    if (missionProgress[currentMissionId].correct >= WINS_TO_UNLOCK) {
                        missionProgress[nextMissionId].unlocked = true;
                        unlockedNewMission = true;
                    }
                }

                if (unlockedNewMission) {
                    feedbackMessage.textContent = `${t.unlock} ${nextMissionId} ${t.unlocked}`;
                    feedbackMessage.className = 'feedback-unlock';
                } else {
                    feedbackMessage.textContent = t.correct;
                    feedbackMessage.className = 'feedback-correct';
                }

            } else {
                // Неправильный ответ
                missionProgress[currentMissionId].incorrect++;
                feedbackMessage.textContent = `${t.incorrect} (${t.correctAnswer}: ${currentCorrectAnswer.toFixed(2)})`;
                feedbackMessage.className = 'feedback-incorrect';
            }

            // Обновляем окно прогресса и кнопки
            updateProgressWindow();
        }

        // --- (ИЗМЕНЕНО) Инициализация игры ---

        function initializeGame() {
            // 1. Заполняем массив загрузчиков
            missionLoaders.push(null, 
                loadMission1, loadMission2, loadMission3, loadMission4, loadMission5,
                loadMission6, loadMission7, loadMission8, loadMission9, loadMission10
            );

            // 2. Создаем объект прогресса
            for (let i = 1; i <= TOTAL_MISSIONS; i++) {
                missionProgress[i] = {
                    correct: 0,
                    incorrect: 0,
                    unlocked: true
                };
            }

            // 3. Назначаем слушатели на кнопки навигации
            navButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.id.replace('btn-m', ''));
                    missionLoaders[id](); 
                });
            });

            // 4. Слушатели на кнопки управления
            submitButton.addEventListener('click', checkAnswer);
            newDataButton.addEventListener('click', () => {
                missionLoaders[currentMissionId](); 
            });
            userAnswerInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    checkAnswer();
                }
            });

            // (НОВОЕ) 5. Слушатели на кнопки языка
            document.getElementById('lang-ru').addEventListener('click', () => setLanguage('ru'));
            document.getElementById('lang-kz').addEventListener('click', () => setLanguage('kz'));
            document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));

            // 5. Первичная отрисовка и запуск
            // (ИЗМЕНЕНО) Сначала устанавливаем язык, который сам вызовет
            // updateProgressWindow() и loadMission1()
            setLanguage(currentLang); 
        }

        // --- Запуск игры ---
        document.addEventListener('DOMContentLoaded', initializeGame);

    </script>
</body>
</html>
