<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диспетчер "Точный Расчет" v14.0 (Электромагнетизм)</title>
    <style>
        /* --- Стили CSS (Без изменений) --- */
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            width: 100%;
            max-width: 1200px;
            background-color: #2a2a4e;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            overflow: hidden;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .lang-selector {
            background-color: #1f1f3d;
            padding: 10px 25px;
            text-align: right;
            border-bottom: 1px solid #2a2a4e;
        }
        .lang-btn {
            background: none;
            border: 1px solid #888;
            color: #888;
            margin-left: 5px;
            cursor: pointer;
            border-radius: 5px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            color: #1a1a2e;
            background-color: #00ffcc;
            border-color: #00ffcc;
            font-weight: bold;
        }
        .lang-btn:hover:not(.active) {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }


        .mission-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background-color: #1f1f3d;
            padding: 10px;
            border-bottom: 2px solid #00ffcc;
        }

        .mission-nav button {
            background: none;
            border: 1px solid #888;
            color: #888;
            padding: 8px 12px;
            margin: 5px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            flex-basis: 18%; /* ~5 кнопок в ряд */
            min-width: 120px;
        }

        .mission-nav button.active {
            color: #1a1a2e;
            background-color: #00ffcc;
            border-color: #00ffcc;
            font-weight: bold;
        }

        .mission-nav button:hover:not(.active):not(:disabled) {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }

        .mission-nav button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .main-content-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        .game-area {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        .mission-monitor {
            padding: 25px;
            border-bottom: 1px dashed #444;
        }

        #mission-title {
            color: #00ffcc;
            margin-top: 0;
            text-transform: uppercase;
        }

        #mission-data {
            background-color: #1f1f3d;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #00ffcc;
            margin: 20px 0;
        }

        #mission-data p { margin: 8px 0; }
        #mission-question {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1em;
        }

        .input-console {
            padding: 25px;
        }

        .input-console label {
            font-size: 0.9em;
            color: #aaa;
        }

        #user-answer {
            width: 100%;
            background-color: #1f1f3d;
            border: 1px solid #888;
            color: #e0e0e0;
            padding: 12px;
            font-family: inherit;
            font-size: 1.2em;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        #user-answer:focus { border-color: #00ffcc; }

        .console-buttons {
            display: flex;
            gap: 10px;
        }

        #submit-button, #new-data-button {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-button {
            background-color: #00ffcc;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
        }
        #submit-button:hover { background-color: #00e6b8; }

        #new-data-button {
            background: none;
            border: 1px solid #888;
            color: #888;
        }
        #new-data-button:hover {
            border-color: #e0e0e0;
            color: #e0e0e0;
        }

        #feedback-message {
            margin-top: 15px;
            text-align: center;
            font-size: 1.1em;
            height: 20px;
            font-weight: bold;
        }

        .feedback-correct { color: #00ffcc; }
        .feedback-unlock { color: #ffd700; }
        .feedback-incorrect { color: #ff4d4d; }

        .progress-tracker {
            flex: 1;
            background-color: #1f1f3d;
            padding: 20px 25px;
            border-left: 2px solid #00ffcc;
            min-height: 100%;
        }
        .progress-tracker h3 {
            color: #00ffcc;
            margin-top: 0;
            text-align: center;
        }
        #progress-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #progress-list li {
            font-size: 0.95em;
            background-color: #2a2a4e;
            padding: 8px 12px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
        #progress-list li.locked {
            color: #666;
            background-color: #222;
        }
        .progress-stats {
            color: #fff;
            font-weight: bold;
        }
        .correct { color: #00ffcc; }
        .incorrect { color: #ff4d4d; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>

        <div class="lang-selector">
            <button id="lang-ru" class="lang-btn active">RU</button>

            <button id="lang-en" class="lang-btn">EN</button>
        </div>

        <div class="mission-nav">

                <ul id="progress-list">
                </ul>
            </div>
        </div>
    </div>

                    { title: "Mission 4: Lorentz Force", scenario: "An electron enters a magnetic field B with velocity v, perpendicular to the field lines. Calculate the Lorentz force acting on it.", data: { v: "Velocity (km/s)", B: "Field Induction (mT)" }, question: "Task: Enter the Lorentz force (F) in femtonewtons (fN, 10⁻¹⁵ N)." },
                    { title: "Mission 5: Orbit Radius (Lorentz)", scenario: "An electron enters a uniform magnetic field B perpendicularly and moves in a circle. Calculate the radius of this circle.", data: { v: "Velocity (km/s)", B: "Field Induction (mT)" }, question: "Task: Enter the orbit radius (R) in centimeters (cm)." },
                    { title: "Mission 6: Magnetic Flux", scenario: "Calculate the magnetic flux (Φ) through a flat surface of area S in a uniform field B (surface is perpendicular to the field).", data: { B: "Field Induction (mT)", S: "Area (cm²)" }, question: "Task: Enter the magnetic flux (Φ) in milliwebers (mWb)." },
                    { title: "Mission 7: Faraday's Law (EMF)", scenario: "The magnetic flux through a coil of N turns changed by ΔΦ in time Δt. Calculate the EMF of induction generated in the coil.", data: { N: "Number of turns", dPhi: "Flux change (mWb)", dt: "Time (ms)" }, question: "Task: Enter the magnitude of the induced EMF (|ε|) in Volts (V)." },
                    { title: "Mission 8: Motional EMF", scenario: "A straight conductor of length L moves with velocity v in a uniform field B. The vectors B, v, and the conductor are mutually perpendicular. Calculate the induced EMF in the conductor.", data: { B: "Field Induction (T)", L: "Length (cm)", v: "Velocity (m/s)" }, question: "Task: Enter the induced EMF (ε) in Volts (V)." },
                    { title: "Mission 9: Self-Induction EMF", scenario: "In a coil with inductance L, the current changed by ΔI in time Δt. Calculate the average EMF of self-induction.", data: { L: "Inductance (mH)", dI: "Current change (A)", dt: "Time (ms)" }, question: "Task: Enter the magnitude of the self-induced EMF (|ε|) in Volts (V)." },
                    { title: "Mission 10: Field Energy", scenario: "Calculate the energy of the magnetic field in a coil with inductance L carrying current I.", data: { L: "Inductance (mH)", I: "Current (A)" }, question: "Task: Enter the field energy (W) in Joules (J)." }
                ]
            }
        };


        // --- (НОВЫЕ) Глобальные Константы и Состояние ---
        const E_CHARGE = 1.602e-19; // Элементарный заряд (Кл)
        const E_MASS = 9.11e-31;   // Масса электрона (кг)
        const MU_0 = 1.256637e-6;  // Магнитная постоянная (Гн/м или Тл·м/А)

        const TOLERANCE = 0.03; // Погрешность (3%)
        const TOTAL_MISSIONS = 10;

        let currentMissionId = 1;
        let currentCorrectAnswer = 0;
        let currentLang = 'ru';
        let missionProgress = {};
        const missionLoaders = []; // Будет заполнен в initializeGame

        // --- DOM Элементы (Без изменений) ---
        const missionTitle = document.getElementById('mission-title');
        const missionScenario = document.getElementById('mission-scenario');
        const missionData = document.getElementById('mission-data');
        const missionQuestion = document.getElementById('mission-question');
        const userAnswerInput = document.getElementById('user-answer');
        const submitButton = document.getElementById('submit-button');
        const newDataButton = document.getElementById('new-data-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const navButtons = document.querySelectorAll('.mission-nav button');
        const progressList = document.getElementById('progress-list');
        const langButtons = document.querySelectorAll('.lang-btn');
        const progressTitle = document.getElementById('progress-title');
        const inputLabel = document.getElementById('input-label');

        // --- Утилиты (Без изменений) ---
        function getRandom(min, max, decimals) {
            let num = Math.random() * (max - min) + min;
            if (decimals !== undefined) {
                num = parseFloat(num.toFixed(decimals));
            }
            return num;
        }

        function resetConsole(message = '', messageClass = '') {
            userAnswerInput.value = '';
            feedbackMessage.textContent = message;
            feedbackMessage.className = messageClass;
        }

        function updateActiveButton(activeId) {
            navButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === activeId);
            });
        }

        // --- Логика Переводов (Без изменений) ---
        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === `lang-${lang}`);
            });

            const t = translations[currentLang];
            if (!t) {
                console.error("Переводы для языка не найдены:", lang);
                return;
            }

            if (t.ui) {
                submitButton.textContent = t.ui.submit;
                newDataButton.textContent = t.ui.newData;
                inputLabel.textContent = t.ui.inputLabel;
                userAnswerInput.placeholder = t.ui.placeholder;
            } else {
                 console.error("Секция 'ui' в переводах отсутствует для:", lang);
            }

            if (t.progress) {
                 updateProgressWindow();
            } else {
                console.error("Секция 'progress' в переводах отсутствует для:", lang);
            }
           
            if (t.missions && missionLoaders[currentMissionId]) {
                missionLoaders[currentMissionId]();
            } else {
                 // Эта ошибка может возникнуть при первой загрузке, это нормально
                 if (missionLoaders.length > 0) {
                    console.error("Секция 'missions' в переводах отсутствует или загрузчик миссии не найден для:", lang, currentMissionId);
                 }
            }
        }

        function updateProgressWindow() {
            progressList.innerHTML = '';
            
            const t = translations[currentLang].progress;
            if (!t) {
                console.error("Переводы 'progress' не найдены для:", currentLang);
                return;
            }
            progressTitle.innerHTML = t.title;

            for (let i = 1; i <= TOTAL_MISSIONS; i++) {
                if (!missionProgress || !missionProgress[i]) {
                    console.error("Объект прогресса отсутствует для миссии:", i);
                    continue; 
                }

                const progress = missionProgress[i];
                const btn = document.getElementById(`btn-m${i}`);
                const li = document.createElement('li');

                const stats = `<span class="progress-stats">
                                    <span class="correct">${progress.correct} ✔</span> /
                                    <span class="incorrect">${progress.incorrect} ❌</span>
                                </span>`;

                li.innerHTML = `<span>${t.mission} ${i}</span> ${stats}`;
                
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `${t.mission} ${i}`;
                } else {
                    console.error("Кнопка не найдена для миссии:", i);
                }

                progressList.appendChild(li);
            }
            updateActiveButton(`btn-m${currentMissionId}`);
        }

        // --- (НОВЫЕ) Загрузчики Миссий (Электромагнетизм) ---

        function loadMission1() { // Сила Ампера: F = B * I * L
            resetConsole();
            currentMissionId = 1;
            updateActiveButton('btn-m1');
            const B = getRandom(0.1, 0.9, 2); // Тл
            const I = getRandom(2, 10, 1);    // А
            const L_cm = getRandom(10, 50, 0); // см
            const L_m = L_cm / 100.0;         // м
            
            currentCorrectAnswer = B * I * L_m; // Ответ в Н

            const t = translations[currentLang].missions[1];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.B}: ${B} Тл</p><p>${t.data.I}: ${I} А</p><p>${t.data.L}: ${L_cm} см</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission2() { // Поле прямого тока: B = (μ₀ * I) / (2 * π * r)
            resetConsole();
            currentMissionId = 2;
            updateActiveButton('btn-m2');
            const I = getRandom(5, 50, 0);     // А
            const r_cm = getRandom(2, 10, 1);  // см
            const r_m = r_cm / 100.0;          // м
            
            const B_Tesla = (MU_0 * I) / (2 * Math.PI * r_m);
            currentCorrectAnswer = B_Tesla * 1e6; // Ответ в мкТл

            const t = translations[currentLang].missions[2];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.I}: ${I} А</p><p>${t.data.r}: ${r_cm} см</p><p>(μ₀ ≈ 1.257&times;10⁻⁶ Гн/м)</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission3() { // Поле соленоида: B = μ₀ * (N/L) * I
            resetConsole();
            currentMissionId = 3;
            updateActiveButton('btn-m3');
            const N = getRandom(200, 1000, 0); // витки
            const L_cm = getRandom(10, 40, 0); // см
            const L_m = L_cm / 100.0;          // м
            const I = getRandom(1, 5, 1);      // А
            
            const n = N / L_m; // витков на метр
            const B_Tesla = MU_0 * n * I;
            currentCorrectAnswer = B_Tesla * 1000.0; // Ответ в мТл

            const t = translations[currentLang].missions[3];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.N}: ${N}</p><p>${t.data.L}: ${L_cm} см</p><p>${t.data.I}: ${I} А</p><p>(μ₀ ≈ 1.257&times;10⁻⁶ Гн/м)</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission4() { // Сила Лоренца: F = q * v * B
            resetConsole();
            currentMissionId = 4;
            updateActiveButton('btn-m4');
            const v_kms = getRandom(500, 5000, 0); // км/с
            const v_ms = v_kms * 1000.0;           // м/с
            const B_mT = getRandom(1, 10, 1);      // мТл
            const B_T = B_mT / 1000.0;             // Тл
            
            const F_N = E_CHARGE * v_ms * B_T;
            currentCorrectAnswer = F_N * 1e15; // Ответ в фН (фемтоньютонах)

            const t = translations[currentLang].missions[4];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.v}: ${v_kms} км/с</p><p>${t.data.B}: ${B_mT} мТл</p><p>(e ≈ 1.6&times;10⁻¹⁹ Кл)</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission5() { // Радиус Лоренца: R = (m*v) / (q*B)
            resetConsole();
            currentMissionId = 5;
            updateActiveButton('btn-m5');
            const v_kms = getRandom(500, 5000, 0); // км/с
            const v_ms = v_kms * 1000.0;           // м/с
            const B_mT = getRandom(1, 10, 1);      // мТл
            const B_T = B_mT / 1000.0;             // Тл
            
            const R_m = (E_MASS * v_ms) / (E_CHARGE * B_T);
            currentCorrectAnswer = R_m * 100.0; // Ответ в см

            const t = translations[currentLang].missions[5];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.v}: ${v_kms} км/с</p><p>${t.data.B}: ${B_mT} мТл</p><p>(e ≈ 1.6&times;10⁻¹⁹ Кл, mₑ ≈ 9.1&times;10⁻³¹ кг)</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission6() { // Магнитный поток: Ф = B * S
            resetConsole();
            currentMissionId = 6;
            updateActiveButton('btn-m6');
            const B_mT = getRandom(20, 100, 0); // мТл
            const B_T = B_mT / 1000.0;          // Тл
            const S_cm2 = getRandom(10, 100, 0); // см²
            const S_m2 = S_cm2 / 10000.0;       // м²
            
            const Phi_Wb = B_T * S_m2;
            currentCorrectAnswer = Phi_Wb * 1000.0; // Ответ в мВб (милливеберах)

            const t = translations[currentLang].missions[6];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.B}: ${B_mT} мТл</p><p>${t.data.S}: ${S_cm2} см²</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission7() { // ЭДС Индукции: ε = -N * (ΔФ / Δt)
            resetConsole();
            currentMissionId = 7;
            updateActiveButton('btn-m7');
            const N = getRandom(50, 200, 0);       // витки
            const dPhi_mWb = getRandom(2, 10, 1);  // мВб
            const dPhi_Wb = dPhi_mWb / 1000.0;     // Вб
            const dt_ms = getRandom(10, 100, 0);   // мс
            const dt_s = dt_ms / 1000.0;           // с
            
            currentCorrectAnswer = N * (dPhi_Wb / dt_s); // Ответ в В (берем модуль)

            const t = translations[currentLang].missions[7];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.N}: ${N}</p><p>${t.data.dPhi}: ${dPhi_mWb} мВб</p><p>${t.data.dt}: ${dt_ms} мс</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission8() { // ЭДС в движущемся проводнике: ε = B * L * v
            resetConsole();
            currentMissionId = 8;
            updateActiveButton('btn-m8');
            const B = getRandom(0.1, 1.0, 2);  // Тл
            const L_cm = getRandom(10, 50, 0); // см
            const L_m = L_cm / 100.0;          // м
            const v = getRandom(2, 20, 1);     // м/с
            
            currentCorrectAnswer = B * L_m * v; // Ответ в В

            const t = translations[currentLang].missions[8];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.B}: ${B} Тл</p><p>${t.data.L}: ${L_cm} см</p><p>${t.data.v}: ${v} м/с</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission9() { // ЭДС Самоиндукции: ε = -L * (ΔI / Δt)
            resetConsole();
            currentMissionId = 9;
            updateActiveButton('btn-m9');
            const L_mH = getRandom(10, 100, 0); // мГн
            const L_H = L_mH / 1000.0;          // Гн
            const dI = getRandom(1, 5, 1);      // А
            const dt_ms = getRandom(10, 100, 0); // мс
            const dt_s = dt_ms / 1000.0;        // с
            
            currentCorrectAnswer = L_H * (dI / dt_s); // Ответ в В (берем модуль)

            const t = translations[currentLang].missions[9];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.L}: ${L_mH} мГн</p><p>${t.data.dI}: ${dI} А</p><p>${t.data.dt}: ${dt_ms} мс</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission10() { // Энергия поля: W = (L * I²) / 2
            resetConsole();
            currentMissionId = 10;
            updateActiveButton('btn-m10');
            const L_mH = getRandom(50, 500, 0); // мГн
            const L_H = L_mH / 1000.0;          // Гн
            const I = getRandom(2, 10, 1);      // А
            
            currentCorrectAnswer = (L_H * I * I) / 2.0; // Ответ в Дж

            const t = translations[currentLang].missions[10];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.L}: ${L_mH} мГн</p><p>${t.data.I}: ${I} А</p>`;
            missionQuestion.innerHTML = t.question;
        }


        // --- Обработчик Проверки (Без изменений) ---
        function checkAnswer() {
            const userAnswer = parseFloat(userAnswerInput.value);
            const t = translations[currentLang].feedback;

            if (isNaN(userAnswer)) {
                feedbackMessage.textContent = t.enterNumber;
                feedbackMessage.className = 'feedback-incorrect';
                return;
            }

            const tolerance = Math.max(0.05, Math.abs(currentCorrectAnswer * TOLERANCE));

            if (Math.abs(userAnswer - currentCorrectAnswer) < tolerance ) {
                missionProgress[currentMissionId].correct++;
                feedbackMessage.textContent = t.correct;
                feedbackMessage.className = 'feedback-correct';
            } else {
                missionProgress[currentMissionId].incorrect++;
                const t_feedback = translations[currentLang].feedback;
                feedbackMessage.textContent = `${t_feedback.incorrect} (${t_feedback.correctAnswer}: ${currentCorrectAnswer.toFixed(2)})`;
                feedbackMessage.className = 'feedback-incorrect';
            }

            updateProgressWindow();
        }


        // --- Инициализация Игры (ОБНОВЛЕНА) ---
        function initializeGame() {
            // (ИЗМЕНЕНО) Заполняем массив НОВЫМИ загрузчиками миссий
            missionLoaders.push(null,
                loadMission1, loadMission2, loadMission3, loadMission4, loadMission5,
                loadMission6, loadMission7, loadMission8, loadMission9, loadMission10
            );

            // (Без изменений) Инициализируем объект прогресса
            for (let i = 1; i <= TOTAL_MISSIONS; i++) {
                missionProgress[i] = {
                    correct: 0,
                    incorrect: 0,
                    unlocked: true 
                };
            }

            // (Без изменений) Назначаем слушателей на кнопки навигации миссий
            navButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.id.replace('btn-m', ''));
                    if (missionLoaders[id]) {
                        missionLoaders[id]();
                    } else {
                        console.error("Загрузчик миссии не найден для ID:", id);
                    }
                });
            });

            // (Без изменений) Слушатели кнопок консоли
            submitButton.addEventListener('click', checkAnswer);
            newDataButton.addEventListener('click', () => {
                if (missionLoaders[currentMissionId]) {
                    missionLoaders[currentMissionId](); 
                }
            });
            
            userAnswerInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    checkAnswer();
                }
            });

            // (Без изменений) Слушатели кнопок языка
            document.getElementById('lang-ru').addEventListener('click', () => setLanguage('ru'));
            document.getElementById('lang-kz').addEventListener('click', () => setLanguage('kz'));
            document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));

            // (Без изменений) Запускаем игру с языком по умолчанию
            setLanguage(currentLang); 
        }

        // --- Запуск игры ---
        document.addEventListener('DOMContentLoaded', initializeGame);

    </script>
</body>
</html>
