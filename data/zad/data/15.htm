<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диспетчер "Точный Расчет" v18.0 (Лучевая оптика)</title>
    <style>
        /* --- Стили CSS (Без изменений) --- */
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            width: 100%;
            max-width: 1200px;
            background-color: #2a2a4e;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            overflow: hidden;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .lang-selector {
            background-color: #1f1f3d;
            padding: 10px 25px;
            text-align: right;
            border-bottom: 1px solid #2a2a4e;
        }
        .lang-btn {
            background: none;
            border: 1px solid #888;
            color: #888;
            margin-left: 5px;
            cursor: pointer;
            border-radius: 5px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            color: #1a1a2e;
            background-color: #00ffcc;
            border-color: #00ffcc;
            font-weight: bold;
        }
        .lang-btn:hover:not(.active) {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }


        .mission-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background-color: #1f1f3d;
            padding: 10px;
            border-bottom: 2px solid #00ffcc;
        }

        .mission-nav button {
            background: none;
            border: 1px solid #888;
            color: #888;
            padding: 8px 12px;
            margin: 5px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            flex-basis: 18%; /* ~5 кнопок в ряд */
            min-width: 120px;
        }

        .mission-nav button.active {
            color: #1a1a2e;
            background-color: #00ffcc;
            border-color: #00ffcc;
            font-weight: bold;
        }

        .mission-nav button:hover:not(.active):not(:disabled) {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }

        .mission-nav button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .main-content-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        .game-area {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        .mission-monitor {
            padding: 25px;
            border-bottom: 1px dashed #444;
        }

        #mission-title {
            color: #00ffcc;
            margin-top: 0;
            text-transform: uppercase;
        }

        #mission-data {
            background-color: #1f1f3d;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #00ffcc;
            margin: 20px 0;
        }

        #mission-data p { margin: 8px 0; }
        #mission-question {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1em;
        }

        .input-console {
            padding: 25px;
        }

        .input-console label {
            font-size: 0.9em;
            color: #aaa;
        }

        #user-answer {
            width: 100%;
            background-color: #1f1f3d;
            border: 1px solid #888;
            color: #e0e0e0;
            padding: 12px;
            font-family: inherit;
            font-size: 1.2em;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        #user-answer:focus { border-color: #00ffcc; }

        .console-buttons {
            display: flex;
            gap: 10px;
        }

        #submit-button, #new-data-button {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-button {
            background-color: #00ffcc;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
        }
        #submit-button:hover { background-color: #00e6b8; }

        #new-data-button {
            background: none;
            border: 1px solid #888;
            color: #888;
        }
        #new-data-button:hover {
            border-color: #e0e0e0;
            color: #e0e0e0;
        }

        #feedback-message {
            margin-top: 15px;
            text-align: center;
            font-size: 1.1em;
            height: 20px;
            font-weight: bold;
        }

        .feedback-correct { color: #00ffcc; }
        .feedback-unlock { color: #ffd700; }
        .feedback-incorrect { color: #ff4d4d; }

        .progress-tracker {
            flex: 1;
            background-color: #1f1f3d;
            padding: 20px 25px;
            border-left: 2px solid #00ffcc;
            min-height: 100%;
        }
        .progress-tracker h3 {
            color: #00ffcc;
            margin-top: 0;
            text-align: center;
        }
        #progress-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #progress-list li {
            font-size: 0.95em;
            background-color: #2a2a4e;
            padding: 8px 12px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
        #progress-list li.locked {
            color: #666;
            background-color: #222;
        }
        .progress-stats {
            color: #fff;
            font-weight: bold;
        }
        .correct { color: #00ffcc; }
        .incorrect { color: #ff4d4d; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>

                    { title: "Mission 5: Lens Magnification", scenario: "An object is at distance dₒ from a lens, and its image is at distance dᵢ. Calculate the linear magnification of the lens.", data: { d_o: "Object distance (cm)", d_i: "Image distance (cm)" }, question: "Task: Enter the magnitude of magnification (M)." },
                    { title: "Mission 6: Image Height", scenario: "An object with height hₒ is placed in front of a lens. The magnification of the lens is M. Calculate the image height.", data: { h_o: "Object height (cm)", M: "Magnification magnitude" }, question: "Task: Enter the image height (hᵢ) in centimeters (cm)." },
                    { title: "Mission 7: Snell's Law", scenario: "A ray of light passes from medium n₁ at an angle α to the boundary. It refracts into medium n₂. Calculate the angle of refraction.", data: { n1: "Index n₁", n2: "Index n₂", alpha: "Angle of incidence (α) (°)" }, question: "Task: Enter the angle of refraction (β) in degrees (°)." },
                    { title: "Mission 8: Critical Angle", scenario: "Light transitions from a denser medium (n₁) to a less dense medium (n₂). Calculate the critical angle for total internal reflection.", data: { n1: "Index n₁ (n₁ > n₂)", n2: "Index n₂" }, question: "Task: Enter the critical angle (α_c) in degrees (°)." },
                    { title: "Mission 9: Refractive Index", scenario: "Light propagates in a transparent medium at a speed v. Calculate the absolute refractive index of this medium.", data: { v: "Speed of light in medium (×10⁸ m/s)" }, question: "Task: Enter the refractive index (n)." },
                    { title: "Mission 10: Apparent Depth", scenario: "The depth of a pond is H. An observer looks at the bottom vertically from above. Calculate the apparent depth of the pond.", data: { H: "True depth (m)", n: "Refractive index of water" }, question: "Task: Enter the apparent depth (h) in meters (m)." }
                ]
            }
        };


        // --- (НОВЫЕ) Глобальные Константы и Состояние ---
        const C_LIGHT = 3e8; // Скорость света в вакууме (м/с)

        const TOLERANCE = 0.03; // Погрешность (3%)
        const TOTAL_MISSIONS = 10;

        let currentMissionId = 1;
        let currentCorrectAnswer = 0;
        let currentLang = 'ru';
        let missionProgress = {};
        const missionLoaders = []; 

        // --- DOM Элементы ---
        let missionTitle, missionScenario, missionData, missionQuestion,
            userAnswerInput, submitButton, newDataButton, feedbackMessage,
            navButtons, progressList, langButtons, progressTitle, inputLabel;


        // --- Утилиты (Без изменений) ---
        function getRandom(min, max, decimals) {
            let num = Math.random() * (max - min) + min;
            if (decimals !== undefined) {
                num = parseFloat(num.toFixed(decimals));
            }
            return num;
        }
        
        // Вспомогательная функция для перевода градусов в радианы
        function degToRad(degrees) {
            return degrees * (Math.PI / 180);
        }

        // Вспомогательная функция для перевода радиан в градусы
        function radToDeg(radians) {
            return radians * (180 / Math.PI);
        }

        function resetConsole(message = '', messageClass = '') {
            userAnswerInput.value = '';
            feedbackMessage.textContent = message;
            feedbackMessage.className = messageClass;
        }

        function updateActiveButton(activeId) {
            navButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === activeId);
            });
        }

        // --- Логика Переводов (Без изменений) ---
        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === `lang-${lang}`);
            });

            const t = translations[currentLang];
            if (!t) {
                console.error("Переводы для языка не найдены:", lang);
                return;
            }

            if (t.ui) {
                submitButton.textContent = t.ui.submit;
                newDataButton.textContent = t.ui.newData;
                inputLabel.textContent = t.ui.inputLabel;
                userAnswerInput.placeholder = t.ui.placeholder;
            } else {
                 console.error("Секция 'ui' в переводах отсутствует для:", lang);
            }

            if (t.progress) {
                 updateProgressWindow();
            } else {
                console.error("Секция 'progress' в переводах отсутствует для:", lang);
            }
           
            if (t.missions && missionLoaders[currentMissionId]) {
                missionLoaders[currentMissionId]();
            } else {
                 if (missionLoaders.length > 0) {
                    console.error("Секция 'missions' в переводах отсутствует или загрузчик миссии не найден для:", lang, currentMissionId);
                 }
            }
        }

        function updateProgressWindow() {
            progressList.innerHTML = '';
            
            const t = translations[currentLang].progress;
            if (!t) {
                console.error("Переводы 'progress' не найдены для:", currentLang);
                return;
            }
            progressTitle.innerHTML = t.title;

            for (let i = 1; i <= TOTAL_MISSIONS; i++) {
                if (!missionProgress || !missionProgress[i]) {
                    console.error("Объект прогресса отсутствует для миссии:", i);
                    continue; 
                }

                const progress = missionProgress[i];
                const btn = document.getElementById(`btn-m${i}`);
                const li = document.createElement('li');

                const stats = `<span class="progress-stats">
                                    <span class="correct">${progress.correct} ✔</span> /
                                    <span class="incorrect">${progress.incorrect} ❌</span>
                                </span>`;

                li.innerHTML = `<span>${t.mission} ${i}</span> ${stats}`;
                
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `${t.mission} ${i}`;
                } else {
                    console.error("Кнопка не найдена для миссии:", i);
                }

                progressList.appendChild(li);
            }
            updateActiveButton(`btn-m${currentMissionId}`);
        }

        // --- (НОВЫЕ) Загрузчики Миссий (Лучевая оптика) ---

        function loadMission1() { // P = 1 / F (в метрах)
            resetConsole();
            currentMissionId = 1;
            updateActiveButton('btn-m1');
            const F_cm = getRandom(10, 50, 0); // см
            const F_m = F_cm / 100.0;         // м
            
            currentCorrectAnswer = 1 / F_m; // Ответ в дптр

            const t = translations[currentLang].missions[1];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.F}: ${F_cm} см</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission2() { // F = 1 / P
            resetConsole();
            currentMissionId = 2;
            updateActiveButton('btn-m2');
            const P = getRandom(1, 5, 2); // дптр
            
            const F_m = 1 / P;
            currentCorrectAnswer = F_m * 100.0; // Ответ в см

            const t = translations[currentLang].missions[2];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.P}: ${P} дптр</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission3() { // 1/d_i = 1/F - 1/d_o
            resetConsole();
            currentMissionId = 3;
            updateActiveButton('btn-m3');
            const F = getRandom(10, 20, 0); // см
            const d_o = getRandom(F + 5, F + 30, 0); // см (d_o > F)
            
            const d_i_inv = (1 / F) - (1 / d_o);
            currentCorrectAnswer = 1 / d_i_inv; // Ответ в см

            const t = translations[currentLang].missions[3];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.F}: ${F} см</p><p>${t.data.d_o}: ${d_o} см</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission4() { // 1/F = 1/d_o + 1/d_i
            resetConsole();
            currentMissionId = 4;
            updateActiveButton('btn-m4');
            const d_o = getRandom(20, 50, 0); // см
            const d_i = getRandom(30, 60, 0); // см
            
            const F_inv = (1 / d_o) + (1 / d_i);
            currentCorrectAnswer = 1 / F_inv; // Ответ в см

            const t = translations[currentLang].missions[4];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.d_o}: ${d_o} см</p><p>${t.data.d_i}: ${d_i} см</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission5() { // M = d_i / d_o
            resetConsole();
            currentMissionId = 5;
            updateActiveButton('btn-m5');
            const d_o = getRandom(20, 50, 0); // см
            const d_i = getRandom(10, 100, 0); // см
            
            currentCorrectAnswer = d_i / d_o; // Ответ (безразмерный)

            const t = translations[currentLang].missions[5];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.d_o}: ${d_o} см</p><p>${t.data.d_i}: ${d_i} см</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission6() { // h_i = h_o * M
            resetConsole();
            currentMissionId = 6;
            updateActiveButton('btn-m6');
            const h_o = getRandom(1, 5, 1); // см
            const M = getRandom(0.5, 3, 2); // увеличение
            
            currentCorrectAnswer = h_o * M; // Ответ в см

            const t = translations[currentLang].missions[6];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.h_o}: ${h_o} см</p><p>${t.data.M}: ${M}</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission7() { // n1*sin(a) = n2*sin(b) => b = asin((n1/n2) * sin(a))
            resetConsole();
            currentMissionId = 7;
            updateActiveButton('btn-m7');
            const n1 = getRandom(1.3, 1.5, 2);
            const n2 = getRandom(n1 + 0.1, 2.0, 2); // n2 > n1
            const alpha = getRandom(20, 60, 0); // градусы
            
            const sin_beta = (n1 / n2) * Math.sin(degToRad(alpha));
            currentCorrectAnswer = radToDeg(Math.asin(sin_beta)); // Ответ в градусах

            const t = translations[currentLang].missions[7];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.n1}: ${n1}</p><p>${t.data.n2}: ${n2}</p><p>${t.data.alpha}: ${alpha}&deg;</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission8() { // sin(a_c) = n2 / n1
            resetConsole();
            currentMissionId = 8;
            updateActiveButton('btn-m8');
            const n2 = getRandom(1.0, 1.3, 2); // воздух/вода
            const n1 = getRandom(n2 + 0.2, 2.4, 2); // стекло/алмаз (n1 > n2)
            
            const sin_alpha_c = n2 / n1;
            currentCorrectAnswer = radToDeg(Math.asin(sin_alpha_c)); // Ответ в градусах

            const t = translations[currentLang].missions[8];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.n1}: ${n1}</p><p>${t.data.n2}: ${n2}</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission9() { // n = c / v
            resetConsole();
            currentMissionId = 9;
            updateActiveButton('btn-m9');
            const v_display = getRandom(1.5, 2.5, 2); // ×10⁸ м/с
            const v_calc = v_display * 1e8;         // м/с
            
            currentCorrectAnswer = C_LIGHT / v_calc; // Ответ (безразмерный)

            const t = translations[currentLang].missions[9];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.v}: ${v_display} &times; 10⁸ м/с</p><p>(c &approx; 3&times;10⁸ м/с)</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission10() { // h' = H / n
            resetConsole();
            currentMissionId = 10;
            updateActiveButton('btn-m10');
            const H = getRandom(2, 10, 1);   // м
            const n = getRandom(1.3, 1.6, 2); // показатель преломления
            
            currentCorrectAnswer = H / n; // Ответ в м

            const t = translations[currentLang].missions[10];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.H}: ${H} м</p><p>${t.data.n}: ${n}</p>`;
            missionQuestion.innerHTML = t.question;
        }


        // --- Обработчик Проверки (Без изменений) ---
        function checkAnswer() {
            const userAnswer = parseFloat(userAnswerInput.value);
            const t = translations[currentLang].feedback;

            if (isNaN(userAnswer)) {
                feedbackMessage.textContent = t.enterNumber;
                feedbackMessage.className = 'feedback-incorrect';
                return;
            }

            const tolerance = Math.max(0.05, Math.abs(currentCorrectAnswer * TOLERANCE));

            if (Math.abs(userAnswer - currentCorrectAnswer) < tolerance ) {
                missionProgress[currentMissionId].correct++;
                feedbackMessage.textContent = t.correct;
                feedbackMessage.className = 'feedback-correct';
            } else {
                missionProgress[currentMissionId].incorrect++;
                const t_feedback = translations[currentLang].feedback;
                feedbackMessage.textContent = `${t_feedback.incorrect} (${t_feedback.correctAnswer}: ${currentCorrectAnswer.toFixed(2)})`;
                feedbackMessage.className = 'feedback-incorrect';
            }

            updateProgressWindow();
        }


        // --- Инициализация Игры (Исправлено в v15.1, без изменений) ---
        function initializeGame() {
            
            // Назначаем DOM-элементы
            missionTitle = document.getElementById('mission-title');
            missionScenario = document.getElementById('mission-scenario');
            missionData = document.getElementById('mission-data');
            missionQuestion = document.getElementById('mission-question');
            userAnswerInput = document.getElementById('user-answer');
            submitButton = document.getElementById('submit-button');
            newDataButton = document.getElementById('new-data-button');
            feedbackMessage = document.getElementById('feedback-message');
            navButtons = document.querySelectorAll('.mission-nav button');
            progressList = document.getElementById('progress-list');
            langButtons = document.querySelectorAll('.lang-btn');
            progressTitle = document.getElementById('progress-title');
            inputLabel = document.getElementById('input-label');
            
            // (ИЗМЕНЕНО) Заполняем массив НОВЫМИ загрузчиками миссий
            missionLoaders.push(null,
                loadMission1, loadMission2, loadMission3, loadMission4, loadMission5,
                loadMission6, loadMission7, loadMission8, loadMission9, loadMission10
            );

            // (Без изменений) Инициализируем объект прогресса
            for (let i = 1; i <= TOTAL_MISSIONS; i++) {
                missionProgress[i] = {
                    correct: 0,
                    incorrect: 0,
                    unlocked: true 
                };
            }

            // (Без изменений) Назначаем слушателей
            navButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.id.replace('btn-m', ''));
                    if (missionLoaders[id]) {
                        missionLoaders[id]();
                    } else {
                        console.error("Загрузчик миссии не найден для ID:", id);
                    }
                });
            });

            submitButton.addEventListener('click', checkAnswer);
            newDataButton.addEventListener('click', () => {
                if (missionLoaders[currentMissionId]) {
                    missionLoaders[currentMissionId](); 
                }
            });
            
            userAnswerInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    checkAnswer();
                }
            });

            document.getElementById('lang-ru').addEventListener('click', () => setLanguage('ru'));
            document.getElementById('lang-kz').addEventListener('click', () => setLanguage('kz'));
            document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));

            // (Без изменений) Запускаем игру с языком по умолчанию
            setLanguage(currentLang); 
        }

        // --- Запуск игры ---
        document.addEventListener('DOMContentLoaded', initializeGame);

    </script>
</body>
</html>
