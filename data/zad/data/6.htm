<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диспетчер "Точный Расчет" v9.0 (Термодинамика)</title>
    <style>
        /* --- Стили CSS (Без изменений) --- */
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            width: 100%;
            max-width: 1200px; 
            background-color: #2a2a4e;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            overflow: hidden;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        .lang-selector {
            background-color: #1f1f3d;
            padding: 10px 25px;
            text-align: right;
            border-bottom: 1px solid #2a2a4e;
        }
        .lang-btn {
            background: none;
            border: 1px solid #888;
            color: #888;
            margin-left: 5px;
            cursor: pointer;
            border-radius: 5px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            color: #1a1a2e;
            background-color: #00ffcc;
            border-color: #00ffcc;
            font-weight: bold;
        }
        .lang-btn:hover:not(.active) {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }


        .mission-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background-color: #1f1f3d;
            padding: 10px;
            border-bottom: 2px solid #00ffcc;
        }

        .mission-nav button {
            background: none;
            border: 1px solid #888;
            color: #888;
            padding: 8px 12px;
            margin: 5px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            flex-basis: 18%; 
            min-width: 120px;
        }

        .mission-nav button.active {
            color: #1a1a2e;
            background-color: #00ffcc;
            border-color: #00ffcc;
            font-weight: bold;
        }

        .mission-nav button:hover:not(.active):not(:disabled) {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }

        .mission-nav button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .main-content-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch; 
        }

        .game-area {
            flex: 2; 
            display: flex;
            flex-direction: column;
        }

        .mission-monitor {
            padding: 25px;
            border-bottom: 1px dashed #444;
        }

        #mission-title {
            color: #00ffcc;
            margin-top: 0;
            text-transform: uppercase;
        }

        #mission-data {
            background-color: #1f1f3d;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #00ffcc;
            margin: 20px 0;
        }

        #mission-data p { margin: 8px 0; }
        #mission-question {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1em;
        }

        .input-console {
            padding: 25px;
        }

        .input-console label {
            font-size: 0.9em;
            color: #aaa;
        }

        #user-answer {
            width: 100%;
            background-color: #1f1f3d;
            border: 1px solid #888;
            color: #e0e0e0;
            padding: 12px;
            font-family: inherit;
            font-size: 1.2em;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s ease;
            box-sizing: border-box; 
            margin-top: 5px;
            margin-bottom: 15px;
        }

        #user-answer:focus { border-color: #00ffcc; }

        .console-buttons {
            display: flex;
            gap: 10px;
        }

        #submit-button, #new-data-button {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-button {
            background-color: #00ffcc;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
        }
        #submit-button:hover { background-color: #00e6b8; }
        
        #new-data-button {
            background: none;
            border: 1px solid #888;
            color: #888;
        }
        #new-data-button:hover {
            border-color: #e0e0e0;
            color: #e0e0e0;
        }

        #feedback-message {
            margin-top: 15px;
            text-align: center;
            font-size: 1.1em;
            height: 20px;
            font-weight: bold;
        }

        .feedback-correct { color: #00ffcc; }
        .feedback-unlock { color: #ffd700; } 
        .feedback-incorrect { color: #ff4d4d; }

        .progress-tracker {
            flex: 1; 
            background-color: #1f1f3d;
            padding: 20px 25px;
            border-left: 2px solid #00ffcc; 
            min-height: 100%; 
        }
        .progress-tracker h3 {
            color: #00ffcc;
            margin-top: 0;
            text-align: center;
        }
        #progress-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column; 
            gap: 10px;
        }
        #progress-list li {
            font-size: 0.95em;
            background-color: #2a2a4e;
            padding: 8px 12px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
        #progress-list li.locked {
            color: #666;
            background-color: #222;
        }
        .progress-stats {
            color: #fff;
            font-weight: bold;
        }
        .correct { color: #00ffcc; }
        .incorrect { color: #ff4d4d; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>

        <div class="lang-selector">
            <button id="lang-ru" class="lang-btn active">RU</button>

                    </ul>
            </div> 
        </div>

                    { title: "Mission 4: First Law (Find &Delta;U)", scenario: "A gas received Q heat and performed A work. Calculate the change in its internal energy.", data: { Q_heat: "Heat (Q)", A_work: "Work done (A)" }, question: "Task: Enter the change in internal energy (&Delta;U) in Joules." },
                    { title: "Mission 5: First Law (Find A)", scenario: "A gas received Q heat, and its internal energy changed by &Delta;U. Calculate the work done by the gas.", data: { Q_heat: "Heat (Q)", dU: "Change in Internal Energy (&Delta;U)" }, question: "Task: Enter the work (A) in Joules." },
                    { title: "Mission 6: Heat Engine Efficiency (Work)", scenario: "A heat engine performs A work per cycle and receives Q<sub>H</sub> heat from the heater. Calculate its efficiency.", data: { A_work: "Work (A)", Q_H: "Heater Heat (Q<sub>H</sub>)" }, question: "Task: Enter the efficiency (&eta;) in percent (%)." },
                    { title: "Mission 7: Efficiency (Heater & Cooler)", scenario: "An engine receives Q<sub>H</sub> from a heater and gives Q<sub>C</sub> to a cooler. Calculate the efficiency.", data: { Q_H: "Heater Heat (Q<sub>H</sub>)", Q_C: "Cooler Heat (Q<sub>C</sub>)" }, question: "Task: Enter the efficiency (&eta;) in percent (%)." },
                    { title: "Mission 8: Ideal Efficiency (Carnot)", scenario: "An ideal engine operates with a heater T<sub>H</sub> and a cooler T<sub>C</sub>. Calculate its *maximum* efficiency.", data: { T_H: "Heater Temp. (T<sub>H</sub>)", T_C: "Cooler Temp. (T<sub>C</sub>)" }, question: "Task: Enter the Carnot efficiency (&eta;<sub>max</sub>) in percent (%)." },
                    { title: "Mission 9: Work and Efficiency", scenario: "An engine with known efficiency received Q<sub>H</sub> heat from the heater. How much useful work did it perform?", data: { eta: "Efficiency (&eta;)", Q_H: "Heater Heat (Q<sub>H</sub>)" }, question: "Task: Enter the work (A) in kJ (kilojoules)." },
                    { title: "Mission 10: Heat Quantity (Heating)", scenario: "An object was heated by &Delta;T. Calculate the amount of heat required for this.", data: { m: "Mass (kg)", c: "Specific Heat Cap.", dT: "Temp. Change (&Delta;T)" }, question: "Task: Enter the heat (Q) in kJ (kilojoules)." }
                ]
            }
        };


        // --- Глобальные Константы и Состояние ---
        const R_CONST = 8.314; // Универсальная газовая постоянная
        // const K_CONST = 1.38e-23; // Постоянная Больцмана (не нужна в этой версии)
        // const NA_CONST = 6.022e23; // Число Авогадро (не нужна в этой версии)
        
        const TOLERANCE = 0.02; // Погрешность
        const TOTAL_MISSIONS = 10;

        let currentMissionId = 1;
        let currentCorrectAnswer = 0;
        let currentLang = 'ru'; 
        let missionProgress = {};
        const missionLoaders = []; 

        // --- DOM Элементы ---
        const missionTitle = document.getElementById('mission-title');
        const missionScenario = document.getElementById('mission-scenario');
        const missionData = document.getElementById('mission-data');
        const missionQuestion = document.getElementById('mission-question');
        const userAnswerInput = document.getElementById('user-answer');
        const submitButton = document.getElementById('submit-button');
        const newDataButton = document.getElementById('new-data-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const navButtons = document.querySelectorAll('.mission-nav button');
        const progressList = document.getElementById('progress-list');
        const langButtons = document.querySelectorAll('.lang-btn');
        const progressTitle = document.getElementById('progress-title');
        const inputLabel = document.getElementById('input-label');

        // --- Утилиты ---

        function getRandom(min, max, decimals = 0) {
            const str = (Math.random() * (max - min) + min).toFixed(decimals);
            return parseFloat(str);
        }
        
        function toPrecision(num, sig) {
            return parseFloat(num.toPrecision(sig));
        }

        function resetConsole(message = '', messageClass = '') {
            userAnswerInput.value = '';
            feedbackMessage.textContent = message;
            feedbackMessage.className = messageClass;
        }

        function updateActiveButton(activeId) {
            navButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === activeId);
            });
        }

        // --- Логика Переводов ---

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === `lang-${lang}`);
            });
            const ui = translations[currentLang].ui;
            submitButton.textContent = ui.submit;
            newDataButton.textContent = ui.newData;
            inputLabel.textContent = ui.inputLabel;
            userAnswerInput.placeholder = ui.placeholder;
            updateProgressWindow();
            missionLoaders[currentMissionId]();
        }

        function updateProgressWindow() {
            progressList.innerHTML = ''; 
            const t = translations[currentLang].progress;
            progressTitle.innerHTML = t.title;

            for (let i = 1; i <= TOTAL_MISSIONS; i++) {
                const progress = missionProgress[i];
                const btn = document.getElementById(`btn-m${i}`);
                const li = document.createElement('li');

                const stats = `<span class="progress-stats">
                                <span class="correct">${progress.correct} ✔</span> / 
                                <span class="incorrect">${progress.incorrect} ❌</span>
                             </span>`;
                
                li.innerHTML = `<span>${t.mission} ${i}</span> ${stats}`;
                btn.disabled = false;
                btn.innerHTML = `${t.mission} ${i}`;
                
                progressList.appendChild(li);
            }
            updateActiveButton(`btn-m${currentMissionId}`);
        }

        // --- (ИЗМЕНЕНИЕ) Загрузчики Миссий (Термодинамика) ---

        function loadMission1() {
            resetConsole();
            currentMissionId = 1;
            updateActiveButton('btn-m1');
            const A_work = getRandom(100, 500, 0); 
            const dU = getRandom(200, 1000, 0);  
            currentCorrectAnswer = dU + A_work;

            const t = translations[currentLang].missions[1];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.A_work}: ${A_work} Дж</p><p>${t.data.dU}: ${dU} Дж</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission2() {
            resetConsole();
            currentMissionId = 2;
            updateActiveButton('btn-m2');
            const P_kPa = getRandom(100, 300, 0); // кПа
            const P_Pa = P_kPa * 1000; // Па
            const V1_L = getRandom(1, 5, 1); // литры
            const V2_L = getRandom(6, 15, 1); // литры
            const dV_L = V2_L - V1_L;
            const dV_m3 = dV_L / 1000.0; // м³
            currentCorrectAnswer = P_Pa * dV_m3;
            
            const t = translations[currentLang].missions[2];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.P}: ${P_kPa} кПа</p><p>${t.data.V1}: ${V1_L} л</p><p>${t.data.V2}: ${V2_L} л</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission3() {
            resetConsole();
            currentMissionId = 3;
            updateActiveButton('btn-m3');
            const nu = getRandom(1, 5, 1);
            const dT = getRandom(50, 200, 0); // K
            currentCorrectAnswer = 1.5 * nu * R_CONST * dT;
            
            const t = translations[currentLang].missions[3];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.nu}: ${nu} моль</p><p>${t.data.dT}: ${dT} K</p><p>(R &approx; ${R_CONST} Дж/(моль·К))</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission4() {
            resetConsole();
            currentMissionId = 4;
            updateActiveButton('btn-m4');
            const Q_heat = getRandom(1000, 2000, 0); 
            const A_work = getRandom(100, 800, 0); 
            currentCorrectAnswer = Q_heat - A_work;
            
            const t = translations[currentLang].missions[4];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.Q_heat}: ${Q_heat} Дж</p><p>${t.data.A_work}: ${A_work} Дж</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission5() {
            resetConsole();
            currentMissionId = 5;
            updateActiveButton('btn-m5');
            const Q_heat = getRandom(1000, 2000, 0); 
            const dU = getRandom(100, 800, 0); 
            currentCorrectAnswer = Q_heat - dU;

            const t = translations[currentLang].missions[5];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.Q_heat}: ${Q_heat} Дж</p><p>${t.data.dU}: ${dU} Дж</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission6() {
            resetConsole();
            currentMissionId = 6;
            updateActiveButton('btn-m6');
            const A_work = getRandom(100, 500, 0);
            const Q_H = getRandom(1000, 2000, 0);
            currentCorrectAnswer = (A_work / Q_H) * 100.0;
            
            const t = translations[currentLang].missions[6];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.A_work}: ${A_work} Дж</p><p>${t.data.Q_H}: ${Q_H} Дж</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission7() {
            resetConsole();
            currentMissionId = 7;
            updateActiveButton('btn-m7');
            const Q_H = getRandom(1000, 2000, 0);
            const Q_C = getRandom(500, Q_H - 100, 0); // Q_C < Q_H
            currentCorrectAnswer = ((Q_H - Q_C) / Q_H) * 100.0;
            
            const t = translations[currentLang].missions[7];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.Q_H}: ${Q_H} Дж</p><p>${t.data.Q_C}: ${Q_C} Дж</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission8() {
            resetConsole();
            currentMissionId = 8;
            updateActiveButton('btn-m8');
            const T_C_C = getRandom(20, 100, 0); // C
            const T_H_C = getRandom(300, 600, 0); // C
            const T_C_K = T_C_C + 273; // K
            const T_H_K = T_H_C + 273; // K
            currentCorrectAnswer = ((T_H_K - T_C_K) / T_H_K) * 100.0;
            
            const t = translations[currentLang].missions[8];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.T_H}: ${T_H_C} &deg;C</p><p>${t.data.T_C}: ${T_C_C} &deg;C</p><p>(Не забудьте перевести в Кельвины: T<sub>K</sub> = T<sub>C</sub> + 273)</p>`;
            missionQuestion.innerHTML = t.question;
        }
        
        function loadMission9() {
            resetConsole();
            currentMissionId = 9;
            updateActiveButton('btn-m9');
            const eta_percent = getRandom(20, 60, 0); // %
            const eta_decimal = eta_percent / 100.0;
            const Q_H_kJ = getRandom(1000, 5000, 0); // кДж
            currentCorrectAnswer = eta_decimal * Q_H_kJ; // Ответ в кДж

            const t = translations[currentLang].missions[9];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.eta}: ${eta_percent} %</p><p>${t.data.Q_H}: ${Q_H_kJ} кДж</p>`;
            missionQuestion.innerHTML = t.question;
        }

        function loadMission10() {
            resetConsole();
            currentMissionId = 10;
            updateActiveButton('btn-m10');
            const m = getRandom(1, 10, 1); // кг
            const c = getRandom(400, 4200, 0); // Дж/(кг·К)
            const dT = getRandom(20, 100, 0); // K
            currentCorrectAnswer = (m * c * dT) / 1000.0; // Ответ в кДж
            
            const t = translations[currentLang].missions[10];
            missionTitle.textContent = t.title;
            missionScenario.innerHTML = t.scenario;
            missionData.innerHTML = `<p>${t.data.m}: ${m} кг</p><p>${t.data.c}: ${c} Дж/(кг·К)</p><p>${t.data.dT}: ${dT} K</p>`;
            missionQuestion.innerHTML = t.question;
        }

        // --- Обработчик Проверки ---

        function checkAnswer() {
            const userAnswer = parseFloat(userAnswerInput.value);
            const t = translations[currentLang].feedback; 

            if (isNaN(userAnswer)) {
                feedbackMessage.textContent = t.enterNumber;
                feedbackMessage.className = 'feedback-incorrect';
                return;
            }

            const tolerance = Math.max(0.05, Math.abs(currentCorrectAnswer * TOLERANCE));

            if (Math.abs(userAnswer - currentCorrectAnswer) < tolerance ) {
                // Правильный ответ
                missionProgress[currentMissionId].correct++;
                feedbackMessage.textContent = t.correct;
                feedbackMessage.className = 'feedback-correct';
            } else {
                // Неправильный ответ
                missionProgress[currentMissionId].incorrect++;
                feedbackMessage.textContent = `${t.incorrect} (${currentCorrectAnswer.toFixed(2)})`;
                feedbackMessage.className = 'feedback-incorrect';
            }

            updateProgressWindow();
        }

        // --- Инициализация Игры ---

        function initializeGame() {
            // 1. Заполняем массив загрузчиков
            missionLoaders.push(null, 
                loadMission1, loadMission2, loadMission3, loadMission4, loadMission5,
                loadMission6, loadMission7, loadMission8, loadMission9, loadMission10 
            );

            // 2. Создаем объект прогресса
            for (let i = 1; i <= TOTAL_MISSIONS; i++) {
                missionProgress[i] = {
                    correct: 0,
                    incorrect: 0,
                    unlocked: true // Все миссии разблокированы
                };
            }

            // 3. Слушатели на кнопки навигации
            navButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.id.replace('btn-m', ''));
                    missionLoaders[id](); 
                });
            });

            // 4. Слушатели на кнопки управления
            submitButton.addEventListener('click', checkAnswer);
            newDataButton.addEventListener('click', () => {
                missionLoaders[currentMissionId](); 
            });
            userAnswerInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    checkAnswer();
                }
            });

            // 5. Слушатели на кнопки языка
            document.getElementById('lang-ru').addEventListener('click', () => setLanguage('ru'));
            document.getElementById('lang-kz').addEventListener('click', () => setLanguage('kz'));
            document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));

            // 6. Первичная отрисовка и запуск
            setLanguage(currentLang); 
        }

        // --- Запуск игры ---
        document.addEventListener('DOMContentLoaded', initializeGame);

    </script>
</body>
</html>
